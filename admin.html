<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Valle Verde Sari-Sari</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --ink: #1a1a1a;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --ok: #16a34a;
      --warn: #f59e0b;
      --soft: #f9fafb;
      --radius: 10px;
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--soft);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
    }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, select, textarea { font: inherit; color: inherit; }

    /* ---------- LOGIN SCREEN ---------- */
    .login-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .login-screen.hidden { display: none; }
    .login-box {
      background: #fff;
      border-radius: var(--radius);
      padding: 32px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 40px rgba(0,0,0,.1);
    }
    .login-box h1 { font-size: 20px; margin-bottom: 12px; }
    .login-box p { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    .field input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .field input:focus { border-color: var(--accent); }
    .login-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      margin-top: 16px;
      transition: background .15s;
    }
    .login-btn:hover { background: var(--accent-dark); }
    .login-error { color: #dc2626; font-size: 13px; margin-top: 12px; }

    /* ---------- ADMIN LAYOUT ---------- */
    header {
      flex-shrink: 0;
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 18px; }
    .logout-btn {
      padding: 8px 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 13px;
      transition: background .15s;
    }
    .logout-btn:hover { background: var(--line); }

    #admin-area { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .container {
      flex: 1; min-height: 0;
      max-width: 1200px; margin: 0 auto; padding: 20px 16px;
      width: 100%;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* ---------- TABS ---------- */
    .tabs {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .tab-btn {
      padding: 10px 16px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      cursor: pointer;
      transition: all .15s;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab-btn:hover { color: var(--ink); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    #products-tab.active { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
    #orders-tab.active   { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
    #add-tab.active { display: block; flex: 1; overflow-y: auto; }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-bar input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      outline: none;
    }
    .search-bar input:focus { border-color: var(--accent); }

    /* ---------- PRODUCTS LIST ---------- */
    .products-grid {
      display: block;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
      margin-bottom: 20px;
    }

    /* ---------- PRODUCT TABLE ---------- */
    .pt-row {
      display: grid;
      grid-template-columns: 36px 56px 1fr 80px 100px 64px 60px;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
    }
    .pt-head {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.04em;
      background: var(--soft);
      position: sticky; top: 0; z-index: 1;
    }
    .pt-data:last-child { border-bottom: none; }
    .pt-data:hover { background: #fafafa; }
    .pt-cell { display: flex; align-items: center; }
    .pt-check input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
    .pt-name-col { flex-direction: column; align-items: flex-start; gap: 2px; }
    .pt-pname { font-size: 14px; font-weight: 500; line-height: 1.3; }
    .pt-pmeta { font-size: 12px; color: var(--muted); }
    .pt-stock { font-size: 13px; }
    .pt-price-col { font-size: 13px; font-weight: 600; }
    .pt-edit-col .edit-btn {
      padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 500;
      background: #eff6ff; color: var(--accent); border: 1px solid #bfdbfe;
      transition: background .15s; white-space: nowrap;
    }
    .pt-edit-col .edit-btn:hover { background: #dbeafe; }
    .pt-avail-col { justify-content: center; }

    /* ---------- DELETE SELECTED BUTTON ---------- */
    .delete-sel-btn {
      margin-left: auto;
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 0;
      padding: 0; padding-right: 12px;
      border-radius: 999px;
      font-size: 13px; font-weight: 700;
      background: #c0392b; color: #fff;
      border: none;
      transition: background .15s;
      white-space: nowrap; overflow: hidden;
      height: 30px;
    }
    .delete-sel-btn .del-icon {
      display: grid; place-items: center;
      width: 30px; height: 30px;
      background: rgba(0,0,0,.22);
      border-radius: 999px 0 0 999px;
      font-size: 13px; flex-shrink: 0;
      margin-right: 8px;
    }
    .delete-sel-btn:hover:not(:disabled) { background: #a93226; }
    .delete-sel-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ---------- PRODUCT FORM MODAL ---------- */
    .product-form-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 150;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .product-form-overlay.show { opacity: 1; pointer-events: auto; }
    .product-form-modal {
      background: #fff;
      border-radius: var(--radius);
      width: 100%; max-width: 720px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 8px 40px rgba(0,0,0,.2);
      transform: scale(0.97); transition: transform .2s;
    }
    .product-form-overlay.show .product-form-modal { transform: scale(1); }
    .product-form-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      position: sticky; top: 0; background: #fff; z-index: 1;
    }
    .product-form-header h2 { font-size: 17px; font-weight: 600; }
    .product-form-body { padding: 20px 24px 24px; }

    /* ---------- CONFIRM MODAL ---------- */
    .confirm-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .confirm-overlay.show { opacity: 1; pointer-events: auto; }
    .confirm-box {
      background: #fff; border-radius: var(--radius);
      padding: 24px; width: 100%; max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,.15);
      transform: scale(0.95); transition: transform .2s;
    }
    .confirm-overlay.show .confirm-box { transform: scale(1); }
    .confirm-box h3 { font-size: 17px; margin-bottom: 8px; }
    .confirm-box p { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
    .confirm-box ul { padding-left: 20px; margin-bottom: 20px; font-size: 14px; max-height: 200px; overflow-y: auto; }
    .confirm-box ul li { margin-bottom: 4px; }
    .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .confirm-cancel { padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; background: var(--soft); border: 1px solid var(--line); transition: background .15s; }
    .confirm-cancel:hover { background: var(--line); }
    .confirm-delete-btn { padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; background: #dc2626; color: #fff; transition: background .15s; }
    .confirm-delete-btn:hover { background: #b91c1c; }

    /* ---------- FORM ---------- */
    .form-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }
    .form-card h2 { font-size: 16px; margin-bottom: 16px; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .form-grid.full { grid-template-columns: 1fr; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 80px; }
    .field small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

    .variant-item {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: end;
    }
    .variant-item input { font-size: 13px; }
    .variant-item .remove-btn {
      color: #dc2626;
      font-size: 18px;
      padding: 4px 8px;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .form-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: background .15s;
    }
    .save-btn {
      background: var(--ok);
      color: #fff;
    }
    .save-btn:hover { background: #15803d; }
    .cancel-btn {
      background: var(--line);
      color: var(--muted);
    }
    .cancel-btn:hover { background: #d1d5db; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--soft);
    }
    .empty-state div { font-size: 48px; margin-bottom: 12px; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      z-index: 300;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--ok); }
    .toast.error { background: #dc2626; }

    /* ---------- ADMIN CATEGORY SIDEBAR ---------- */
    .products-layout { flex: 1; min-height: 0; display: flex; gap: 20px; overflow: hidden; }
    .products-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .search-bar { flex-shrink: 0; }
    .products-grid { flex: 1; min-height: 0; overflow-y: auto; margin-bottom: 0; }
    .admin-cats {
      display: flex; flex-direction: column; gap: 8px;
      width: 180px; flex-shrink: 0; padding: 4px 0;
      overflow-y: auto;
    }
    .chip-group { display: flex; align-items: stretch; width: 100%; }
    .admin-chip {
      flex: 1; padding: 10px 14px;
      background: var(--soft); border: 1px solid var(--line); border-left: none;
      font-size: 13px; cursor: pointer; white-space: nowrap; text-align: left;
      transition: all .15s; border-radius: 0 8px 8px 0; overflow: hidden; text-overflow: ellipsis;
    }
    .admin-chip:not(.with-del) { border-radius: 8px; border-left: 1px solid var(--line); flex: none; width: 100%; }
    .admin-chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .admin-chip:hover:not(.active) { border-color: var(--ink); background: var(--soft); }
    .admin-chip.active:hover { background: var(--ink); }
    .chip-del {
      flex-shrink: 0; padding: 0 8px; font-size: 14px; line-height: 1;
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 8px 0 0 8px; color: #dc2626; cursor: pointer; transition: background .15s;
    }
    .chip-del:hover { background: #fee2e2; }

    /* ---------- TOGGLE SWITCH WRAPPER ---------- */

    /* ---------- TOGGLE SWITCH ---------- */
    .toggle-sw { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
    .toggle-sw input { opacity: 0; width: 0; height: 0; }
    .toggle-sl { position: absolute; cursor: pointer; inset: 0; background: #d1d5db; border-radius: 20px; transition: .2s; }
    .toggle-sl::before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .toggle-sw input:checked + .toggle-sl { background: var(--ok); }
    .toggle-sw input:checked + .toggle-sl::before { transform: translateX(16px); }

    /* ---------- ORDERS TAB ---------- */
    .orders-filter { display: flex; gap: 6px; flex-shrink: 0; margin-bottom: 12px; flex-wrap: wrap; }
    .orders-filter-btn { padding: 5px 14px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; background: var(--soft); cursor: pointer; transition: all .15s; }
    .orders-filter-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .orders-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
    .order-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; flex-shrink: 0; }
    .order-card.pending  { border-left: 4px solid var(--warn); }
    .order-card.confirmed { border-left: 4px solid var(--ok); }
    .order-card.cancelled { border-left: 4px solid #d1d5db; opacity: 0.65; }
    .order-card-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--soft); border-bottom: 1px solid var(--line); }
    .order-id-label { font-size: 13px; font-weight: 700; font-family: monospace; letter-spacing: 0.04em; }
    .order-status-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.05em; }
    .order-status-badge.pending   { background: #fef3c7; color: #92400e; }
    .order-status-badge.confirmed { background: #dcfce7; color: #166534; }
    .order-status-badge.cancelled { background: #f3f4f6; color: #6b7280; }
    .order-time-label { font-size: 12px; color: var(--muted); margin-left: auto; }
    .order-card-body { padding: 12px 14px; }
    .order-cust { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .order-addr { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .order-items-list { font-size: 13px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
    .order-item-row { display: flex; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid var(--line); }
    .order-item-row:last-child { border-bottom: none; }
    .order-total-row { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; }
    .order-pay-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .order-notes-label { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 6px; }
    .order-actions-row { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--soft); }
    .btn-confirm-order { flex: 1; padding: 8px; background: var(--ok); color: #fff; border-radius: 6px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: background .15s; }
    .btn-confirm-order:hover { background: #15803d; }
    .btn-cancel-order { padding: 8px 14px; background: #fff; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; cursor: pointer; color: var(--muted); transition: background .15s; }
    .btn-cancel-order:hover { background: var(--line); }
    .btn-refund-order { padding: 8px 14px; background: #fff; border: 1px solid #fca5a5; border-radius: 6px; font-size: 13px; cursor: pointer; color: #dc2626; transition: background .15s; }
    .btn-refund-order:hover { background: #fef2f2; }
    .order-card.refunded { border-left: 4px solid #f87171; opacity: 0.65; }
    .order-status-badge.refunded { background: #fee2e2; color: #991b1b; }

    /* ---------- ORDER BADGE ---------- */
    .order-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; background: #ef4444; color: #fff; border-radius: 999px; font-size: 10px; font-weight: 700; padding: 0 4px; margin-left: 5px; line-height: 1; vertical-align: middle; }

    /* ---------- LOW STOCK HIGHLIGHT ---------- */
    .pt-data.low-stock   { background: #fffbeb; }
    .pt-data.out-of-stock { background: #fef2f2; }
    .pt-data.low-stock   .pt-stock-val { color: #d97706; font-weight: 700; }
    .pt-data.out-of-stock .pt-stock-val { color: #dc2626; font-weight: 700; }

    /* ---------- STOCK ADJUSTMENT ---------- */
    .stock-adj { display: flex; align-items: center; gap: 4px; }
    .stock-btn { width: 20px; height: 20px; border-radius: 4px; font-size: 14px; line-height: 1; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; padding: 0; }
    .stock-btn:hover { background: var(--line); }

    @media (max-width: 600px) {
      .pt-row { grid-template-columns: 36px 44px 1fr 60px 60px; }
      .pt-stock, .pt-edit-col { display: none; }
      .form-grid { grid-template-columns: 1fr; }
      .variant-item { grid-template-columns: 1fr 1fr; }
      .products-layout { flex-direction: column; overflow-y: auto; }
      .admin-cats {
        width: 100%; flex-direction: row; overflow-x: auto; overflow-y: hidden;
        flex-wrap: nowrap; padding: 4px 0 6px; gap: 6px;
        flex-shrink: 0;
      }
      .products-main { overflow-y: auto; }
      .products-grid { flex: unset; min-height: unset; overflow-y: unset; }
      .chip-group { width: auto; flex-shrink: 0; }
      .admin-chip { flex: initial; text-align: center; }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- ADMIN LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h1>🔐 Admin Access</h1>
    <p>Enter password to manage products</p>
    <div class="field">
      <input type="password" id="password-input" placeholder="Password" />
    </div>
    <button class="login-btn" onclick="login()">Login</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="admin-area" style="display:none;">
  <header>
    <h1>📦 Product Management</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" data-tab="products" onclick="switchTab('products')">All Products</button>
      <button class="tab-btn" data-tab="orders" onclick="switchTab('orders')">Orders<span class="order-badge" id="order-badge" style="display:none;"></span></button>
      <button class="tab-btn" onclick="openAddModal()">Add New Product</button>
      <button class="delete-sel-btn" id="delete-sel-btn" onclick="deleteSelected()" disabled>
        <span class="del-icon">🗑️</span><span id="delete-sel-label">Delete</span>
      </button>
    </div>

    <!-- TAB: PRODUCTS LIST -->
    <div class="tab-panel active" id="products-tab">
      <div class="products-layout">
        <div class="admin-cats" id="admin-cats"></div>
        <div class="products-main">
          <div class="search-bar">
            <input type="search" id="product-search" placeholder="Search products by name, category, or description" oninput="setSearchTerm(this.value)" />
          </div>
          <div class="products-grid" id="products-list"></div>
        </div>
      </div>
    </div>

    <!-- TAB: ORDERS -->
    <div class="tab-panel" id="orders-tab">
      <div class="orders-filter">
        <button class="orders-filter-btn active" data-filter="all"       onclick="setOrdersFilter('all')">All</button>
        <button class="orders-filter-btn"        data-filter="pending"   onclick="setOrdersFilter('pending')">Pending</button>
        <button class="orders-filter-btn"        data-filter="confirmed" onclick="setOrdersFilter('confirmed')">Confirmed</button>
        <button class="orders-filter-btn"        data-filter="cancelled" onclick="setOrdersFilter('cancelled')">Cancelled</button>

// ---------- PHOTO UPLOAD ----------
function handlePhotoUpload(event) {
  const files = Array.from(event.target.files);
  const remaining = 5 - currentImages.length;
  files.slice(0, remaining).forEach(file => compressImage(file, compressed => {
    if (currentImages.length < 5) { currentImages.push(compressed); renderPhotoPreviews(); }
  }));
  event.target.value = '';
}

function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const max = 400;
      let w = img.width, h = img.height;
      if (w > max || h > max) {
        if (w > h) { h = Math.round(h * max / w); w = max; }
        else { w = Math.round(w * max / h); h = max; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.6));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  if (msg) msg.textContent = currentImages.length > 0 ? `${currentImages.length}/5 photo${currentImages.length !== 1 ? 's' : ''}` : '';
}

  if (unsubscribeOrders)   { unsubscribeOrders();   unsubscribeOrders   = null; }

  isLoggedIn = false;

function showLogin() {

  document.getElementById('admin-area').style.display = 'none';
}

function showAdmin() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('admin-area').style.display = 'flex';
  subscribeToProducts();
  subscribeToOrders();
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function subscribeToProducts() {
  if (unsubscribeProducts) unsubscribeProducts();
  unsubscribeProducts = db.collection('products').onSnapshot(snapshot => {
    products = snapshot.docs.map(doc => doc.data());
    products.sort((a, b) => a.id - b.id);
    if (products.length === 0) {
      seedDefaultProducts();
    } else {
      renderAdminCategories();
      renderProducts();
    }
  }, err => {
    console.error('Firestore error:', err);
    showToast('Error connecting to database', 'error');
  });
}

// ---------- ORDERS ----------
function subscribeToOrders() {
  if (unsubscribeOrders) unsubscribeOrders();
  let isFirstLoad = true;
  unsubscribeOrders = db.collection('orders')
    .orderBy('createdAt', 'desc')
    .onSnapshot(snapshot => {
      orders = snapshot.docs.map(doc => ({ ...doc.data(), orderId: doc.id }));
      renderOrders();
      updateOrderBadge();
      if (!isFirstLoad) {
        snapshot.docChanges().forEach(change => {
          if (change.type === 'added' && change.doc.data().status === 'pending') {
            notifyNewOrder(change.doc.data(), change.doc.id);
          }
        });
      }
      isFirstLoad = false;
    }, err => console.error('Orders listener error:', err));
}

function notifyNewOrder(order, orderId) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const shortId = orderId.slice(-6).toUpperCase();
  const items = (order.items || []).map(i => `${i.qty}× ${i.productName}`).join(', ');
  new Notification(`🛒 New Order #${shortId}`, {
    body: `${order.customer?.name} · ₱${parseFloat(order.total).toFixed(2)}\n${items}`,
    tag: orderId,
  });
}

function updateOrderBadge() {
  const pending = orders.filter(o => o.status === 'pending').length;
  const badge = document.getElementById('order-badge');
  if (!badge) return;
  badge.style.display = pending > 0 ? 'inline-flex' : 'none';
  badge.textContent = pending;
}

function setOrdersFilter(filter) {
  ordersFilter = filter;
  document.querySelectorAll('.orders-filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === filter);
  });
  renderOrders();
}

function formatOrderTime(ts) {
  if (!ts || !ts.toDate) return '';
  const date = ts.toDate();
  const diffMins = Math.floor((Date.now() - date) / 60000);
  if (diffMins < 1) return 'Just now';
  if (diffMins < 60) return `${diffMins}m ago`;
  const diffHrs = Math.floor(diffMins / 60);
  if (diffHrs < 24) return `${diffHrs}h ago`;
  return date.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
}

function renderOrders() {
  const list = document.getElementById('orders-list');
  if (!list) return;

  const filtered = ordersFilter === 'all' ? orders : orders.filter(o => o.status === ordersFilter);

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state"><div>📋</div><div>No ${ordersFilter === 'all' ? '' : ordersFilter + ' '}orders yet</div></div>`;
    return;
  }

  list.innerHTML = filtered.map(o => {
    const shortId  = o.orderId.slice(-6).toUpperCase();
    const addr     = o.address ? `Block ${o.address.block}, Lot ${o.address.lot}, Phase ${o.address.phase}, St. ${o.address.street}, Valle Verde` : '—';
    const payLabel = o.payment === 'gcash' ? '📱 GCash' : '💵 Cash on Delivery';
    const itemsHtml = (o.items || []).map(item => `
      <div class="order-item-row">
        <span>${item.qty}× ${item.productName}</span>
        <span>₱${parseFloat(item.lineTotal).toFixed(2)}</span>
      </div>`).join('');
    const actionsHtml = o.status === 'pending' ? `
      <div class="order-actions-row">
        <button class="btn-confirm-order" onclick="confirmOrder('${o.orderId}')">✓ Confirm &amp; Deduct Stock</button>
        <button class="btn-cancel-order"  onclick="cancelOrder('${o.orderId}')">✗ Cancel</button>
      </div>` :
      o.status === 'confirmed' ? `
      <div class="order-actions-row">
        <button class="btn-refund-order" onclick="refundAndRestock('${o.orderId}')">↩ Refund &amp; Restock</button>
      </div>` : '';

    return `
      <div class="order-card ${o.status}">
        <div class="order-card-header">
          <span class="order-id-label">#${shortId}</span>
          <span class="order-status-badge ${o.status}">${o.status}</span>
          <span class="order-time-label">${formatOrderTime(o.createdAt)}</span>
        </div>
        <div class="order-card-body">
          <div class="order-cust">${o.customer?.name || '—'} · ${o.customer?.phone || '—'}</div>
          <div class="order-addr">${addr}</div>
          <div class="order-items-list">${itemsHtml}</div>
          <div class="order-total-row"><span>Total</span><span>₱${parseFloat(o.total).toFixed(2)}</span></div>
          <div class="order-pay-label">${payLabel}</div>
          ${o.notes ? `<div class="order-notes-label">Notes: ${o.notes}</div>` : ''}
        </div>
        ${actionsHtml}
      </div>`;
  }).join('');
}

async function confirmOrder(orderId) {
  const order = orders.find(o => o.orderId === orderId);
  if (!order) return;
  try {
    const batch = db.batch();
    batch.update(db.collection('orders').doc(orderId), {
      status: 'confirmed',
      confirmedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    for (const item of (order.items || [])) {
      const product = products.find(p => String(p.id) === String(item.productId));
      if (product && product.stock !== null && product.stock !== undefined) {
        const newStock = Math.max(0, product.stock - item.qty);
        const upd = { stock: newStock };
        if (newStock === 0) upd.available = false;
        batch.update(db.collection('products').doc(String(item.productId)), upd);
      }
    }
    await batch.commit();
    showToast('Order confirmed — stock updated', 'success');
  } catch (err) {
    console.error('Confirm order error:', err);
    showToast('Error confirming order', 'error');
  }
}

async function cancelOrder(orderId) {
  try {
    await db.collection('orders').doc(orderId).update({
      status: 'cancelled',
      cancelledAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    showToast('Order cancelled', 'success');
  } catch (err) {
    console.error('Cancel order error:', err);
    showToast('Error cancelling order', 'error');
  }
}

async function refundAndRestock(orderId) {
  const order = orders.find(o => o.orderId === orderId);
  if (!order) return;
  try {
    const batch = db.batch();
    batch.update(db.collection('orders').doc(orderId), {
      status: 'refunded',
      refundedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    for (const item of (order.items || [])) {
      const product = products.find(p => String(p.id) === String(item.productId));
      if (product && product.stock !== null && product.stock !== undefined) {
        const newStock = product.stock + item.qty;
        const upd = { stock: newStock };
        if (product.stock === 0 && newStock > 0) upd.available = true;
        batch.update(db.collection('products').doc(String(item.productId)), upd);
      }
    }
    await batch.commit();
    showToast('Order refunded — stock restored', 'success');
  } catch (err) {
    console.error('Refund order error:', err);
    showToast('Error processing refund', 'error');
  }
}

async function adjustStock(id, delta) {
  const product = products.find(p => p.id === id);
  if (!product || product.stock === null || product.stock === undefined) return;
  const newStock = Math.max(0, product.stock + delta);
  const upd = { stock: newStock };
  if (newStock === 0) upd.available = false;
  else if (product.stock === 0 && newStock > 0) upd.available = true;
  try {
    await db.collection('products').doc(String(id)).update(upd);
  } catch (err) {
    console.error('Adjust stock error:', err);
    showToast('Error updating stock', 'error');
  }
}

// ---------- TABS ----------
function switchTab(tab, reset = true) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

  const button = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
  if (button) {
    button.classList.add('active');
  }
  document.getElementById(tab + '-tab').classList.add('active');

  if (tab === 'add' && reset) {
    resetForm();
  }
}

// ---------- PRODUCTS ----------
function setSearchTerm(value) {
  searchTerm = value.trim().toLowerCase();
  renderProducts();
}

function renderAdminCategories() {
  const cats = new Set(['All']);
  products.forEach(p => { if (p.category) cats.add(p.category); });
  const wrap = document.getElementById('admin-cats');
  if (!wrap) return;
  wrap.innerHTML = [...cats].map(c => {
    const active = c === adminActiveCategory ? 'active' : '';
    const safeC = c.replace(/'/g, "\\'");
    if (c === 'All') {
      return `<button class="admin-chip ${active}" onclick="pickAdminCategory('${safeC}')">${c}</button>`;
    }
    return `<span class="chip-group">
      <button class="chip-del" onclick="deleteCategory('${safeC}')" title="Delete category">×</button>
      <button class="admin-chip with-del ${active}" onclick="pickAdminCategory('${safeC}')">${c}</button>
    </span>`;
  }).join('');
  updateCategorySelect();
}

function pickAdminCategory(cat) {
  adminActiveCategory = cat;
  renderAdminCategories();
  renderProducts();
}

function deleteCategory(cat) {
  const tagged = products.filter(p => p.category === cat);
  if (tagged.length > 0) {
    showToast(
      `Cannot delete "${cat}" — ${tagged.length} product${tagged.length > 1 ? 's are' : ' is'} still tagged to it. Reassign or delete them first.`,
      'error'
    );
    return;
  }
  if (adminActiveCategory === cat) adminActiveCategory = 'All';
  renderAdminCategories();
  renderProducts();
  showToast(`Category "${cat}" removed.`, 'success');
}

function updateCategorySelect(selectedValue = '') {
  const sel = document.getElementById('product-category');
  if (!sel) return;
  const cats = new Set([...ADMIN_CATEGORIES]);
  products.forEach(p => { if (p.category) cats.add(p.category); });
  sel.innerHTML =
    `<option value="">Select Category</option>` +
    [...cats].map(c => `<option value="${c}" ${selectedValue === c ? 'selected' : ''}>${c}</option>`).join('') +
    `<option value="__custom__">+ Create new category…</option>`;
}

function handleCategoryChange(val) {
  const inp = document.getElementById('custom-category-input');
  if (val === '__custom__') {
    inp.style.display = 'block';
    inp.focus();
  } else {
    inp.style.display = 'none';
    inp.value = '';
  }
}

async function toggleAvailability(id, available) {
  try {
    await db.collection('products').doc(String(id)).update({ available });
  } catch (err) {
    console.error('Toggle error:', err);
    showToast('Error updating availability', 'error');
  }
}

function renderProducts() {
  let filtered = products;
  if (adminActiveCategory !== 'All') {
    filtered = filtered.filter(p => p.category === adminActiveCategory);
  }
  if (searchTerm) {
    filtered = filtered.filter(p => {
      const text = `${p.name} ${p.category} ${p.description || ''}`.toLowerCase();
      return text.includes(searchTerm);
    });
  }

  const list = document.getElementById('products-list');

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div>${searchTerm ? '🔍' : '📦'}</div>
        <div>${searchTerm ? `No products match "${searchTerm}"` : 'No products in this category'}</div>
        <p style="margin-top: 8px; font-size: 13px;">Try a different name, category, or keyword.</p>
      </div>`;
    updateDeleteBtn();
    return;
  }

  list.innerHTML = `
    <div class="pt-row pt-head">
      <div class="pt-cell pt-check"><input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)" /></div>
      <div class="pt-cell"></div>
      <div class="pt-cell">Product</div>
      <div class="pt-cell">Stock</div>
      <div class="pt-cell">Price</div>
      <div class="pt-cell"></div>
      <div class="pt-cell">Available</div>
    </div>
    ${filtered.map(p => {
      const available  = p.available !== false;
      const stockNum   = (p.stock !== null && p.stock !== undefined) ? p.stock : null;
      const isLowStock = stockNum !== null && stockNum > 0 && stockNum <= 5;
      const isOutOf    = stockNum !== null && stockNum === 0;
      const stockClass = isOutOf ? 'out-of-stock' : (isLowStock ? 'low-stock' : '');
      const stockCell  = stockNum !== null
        ? `<div class="stock-adj">
             <button class="stock-btn" onclick="adjustStock(${p.id}, -1)">−</button>
             <span class="pt-stock-val">${stockNum}</span>
             <button class="stock-btn" onclick="adjustStock(${p.id}, 1)">+</button>
           </div>`
        : `<span class="pt-stock-val">—</span>`;
      const thumb = p.images && p.images.length > 0
        ? `<img src="${p.images[0]}" alt="${p.name}" style="width:44px;height:44px;border-radius:6px;object-fit:cover;">`
        : `<div style="width:44px;height:44px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:22px;">${p.emoji || '📦'}</div>`;
      return `
        <div class="pt-row pt-data ${stockClass}">
          <div class="pt-cell pt-check"><input type="checkbox" class="row-check" data-id="${p.id}" onchange="updateDeleteBtn()" /></div>
          <div class="pt-cell">${thumb}</div>
          <div class="pt-cell pt-name-col">
            <div class="pt-pname">${p.name}</div>
            <div class="pt-pmeta">${p.category}${p.unit ? ' · ' + p.unit : ''}</div>
          </div>
          <div class="pt-cell pt-stock">${stockCell}</div>
          <div class="pt-cell pt-price-col">₱${parseFloat(p.price).toFixed(2)}</div>
          <div class="pt-cell pt-edit-col"><button class="edit-btn" onclick="editProduct(${p.id})">Edit</button></div>
          <div class="pt-cell pt-avail-col">
            <label class="toggle-sw" title="${available ? 'Mark as out of stock' : 'Mark as available'}">
              <input type="checkbox" ${available ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleAvailability(${p.id}, this.checked)" />
              <span class="toggle-sl"></span>
            </label>
          </div>
        </div>
      `;
    }).join('')}
  `;
  updateDeleteBtn();
}

function toggleSelectAll(checked) {
  document.querySelectorAll('.row-check').forEach(cb => cb.checked = checked);
  updateDeleteBtn();
}

function updateDeleteBtn() {
  const selected = document.querySelectorAll('.row-check:checked');
  const btn = document.getElementById('delete-sel-btn');
  const lbl = document.getElementById('delete-sel-label');
  if (btn) {
    btn.disabled = selected.length === 0;
    if (lbl) lbl.textContent = selected.length > 0 ? `Delete (${selected.length})` : 'Delete';
  }
  const all = document.querySelectorAll('.row-check');
  const selAll = document.getElementById('select-all');
  if (selAll && all.length > 0) {
    selAll.checked = selected.length === all.length;
    selAll.indeterminate = selected.length > 0 && selected.length < all.length;
  }
}

function deleteSelected() {
  const checked = [...document.querySelectorAll('.row-check:checked')];
  if (checked.length === 0) return;
  const ids = checked.map(cb => parseInt(cb.dataset.id));
  const toDelete = ids.map(id => products.find(p => p.id === id)).filter(Boolean);
  document.getElementById('confirm-product-list').innerHTML = toDelete.map(p => `<li>${p.name}</li>`).join('');
  document.getElementById('confirm-modal').classList.add('show');
  window._pendingDeleteIds = ids;
}

async function confirmDelete() {
  const ids = window._pendingDeleteIds || [];
  closeConfirmModal();
  let errors = 0;
  for (const id of ids) {
    try {
      await db.collection('products').doc(String(id)).delete();
    } catch (err) {
      console.error('Delete error:', err);
      errors++;
    }
  }
  if (errors > 0) {
    showToast(`${errors} product(s) failed to delete`, 'error');
  } else {
    showToast(`${ids.length} product${ids.length > 1 ? 's' : ''} deleted`, 'success');
  }
}

function closeConfirmModal() {
  document.getElementById('confirm-modal').classList.remove('show');
  window._pendingDeleteIds = [];
}

function editProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;

  editingProductId = id;
  document.getElementById('form-title').textContent = 'Edit Product';
  document.getElementById('product-id').value = p.id;
  document.getElementById('product-name').value = p.name;
  document.getElementById('product-description').value = p.description || '';
  updateCategorySelect(p.category);
  document.getElementById('custom-category-input').style.display = 'none';
  document.getElementById('product-price').value = p.price;
  document.getElementById('product-unit').value = p.unit;
  document.getElementById('product-stock').value = p.stock || '';
  currentImages = p.images ? [...p.images] : [];
  renderPhotoPreviews();

  // Populate variants
  variantCount = 0;
  document.getElementById('variants-list').innerHTML = '';
  if (p.variants && p.variants.length > 0) {
    p.variants.forEach(v => {
      addVariantField(v.name, v.price);
    });
  }

  showProductFormModal();
}


async function saveProduct(e) {
  e.preventDefault();

  const selCat = document.getElementById('product-category').value;
  const customCat = document.getElementById('custom-category-input').value.trim();
  const category = selCat === '__custom__' ? customCat : selCat;
  if (!category) {
    showToast('Please select or enter a category', 'error');
    return;
  }

  const formData = {
    name: document.getElementById('product-name').value,
    description: document.getElementById('product-description').value,
    category,
    price: parseFloat(document.getElementById('product-price').value),
    unit: document.getElementById('product-unit').value,
    stock: document.getElementById('product-stock').value ? parseInt(document.getElementById('product-stock').value) : null,
    emoji: editingProductId ? (products.find(p => p.id === editingProductId)?.emoji || '📦') : '📦',
    images: [...currentImages],
    variants: []
  };

  document.querySelectorAll('[data-variant-name]').forEach(field => {
    const idx = field.dataset.variantIndex;
    const name = field.value;
    const priceField = document.querySelector(`[data-variant-price="${idx}"]`);
    const price = priceField ? parseFloat(priceField.value) || 0 : 0;
    if (name) formData.variants.push({ name, price });
  });

  formData.id = editingProductId || (products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1);

  try {
    await db.collection('products').doc(String(formData.id)).set(formData);
    showToast(editingProductId ? 'Product updated' : 'Product added', 'success');
    closeProductModal();
  } catch (err) {
    console.error('Save error:', err);
    showToast('Error saving product', 'error');
  }
}

function openAddModal() {
  resetForm();
  showProductFormModal();
}

function showProductFormModal() {
  document.getElementById('product-form-overlay').classList.add('show');
}

function closeProductModal() {
  document.getElementById('product-form-overlay').classList.remove('show');
  resetForm();
}

function resetForm() {
  document.getElementById('form-title').textContent = 'Add New Product';
  document.getElementById('product-form').reset();
  document.getElementById('product-id').value = '';
  document.getElementById('variants-list').innerHTML = '';
  const customInp = document.getElementById('custom-category-input');
  if (customInp) { customInp.style.display = 'none'; customInp.value = ''; }
  updateCategorySelect();
  variantCount = 0;
  editingProductId = null;
  currentImages = [];
  renderPhotoPreviews();
}

function addVariantField(name = '', price = '') {
  const idx = variantCount++;
  const html = `
    <div class="variant-item">
      <input type="text" data-variant-name data-variant-index="${idx}" placeholder="Variant name (e.g., Large)" value="${name}" />
      <input type="number" data-variant-price="${idx}" step="0.01" placeholder="Price" value="${price}" />
      <button type="button" class="remove-btn" onclick="this.parentElement.remove()">×</button>
    </div>
  `;
  document.getElementById('variants-list').innerHTML += html;
}

// Products are saved directly to Firestore via saveProduct() / deleteProduct()

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('success', 'error');
  t.classList.add('show', type);
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- INIT ----------
window.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('password-input') === document.activeElement) {
    login();
  }
  if (e.key === 'Escape') {
    closeProductModal();
    closeConfirmModal();
  }
});

if (isLoggedIn) {
  showAdmin();
} else {
  showLogin();
}
</script>
