<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Valle Verde Sari-Sari</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff;
      --ink: #1a1a1a;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --ok: #16a34a;
      --warn: #f59e0b;
      --soft: #f9fafb;
      --radius: 10px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--soft);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, select, textarea { font: inherit; color: inherit; }

    /* ---------- LOGIN SCREEN ---------- */
    .login-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .login-screen.hidden { display: none; }
    .login-box {
      background: #fff;
      border-radius: var(--radius);
      padding: 32px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 40px rgba(0,0,0,.1);
    }
    .login-box h1 { font-size: 20px; margin-bottom: 12px; }
    .login-box p { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    .field input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .field input:focus { border-color: var(--accent); }
    .login-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      margin-top: 16px;
      transition: background .15s;
    }
    .login-btn:hover { background: var(--accent-dark); }
    .login-error { color: #dc2626; font-size: 13px; margin-top: 12px; }

    /* ---------- ADMIN LAYOUT ---------- */
    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 18px; }
    .logout-btn {
      padding: 8px 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 13px;
      transition: background .15s;
    }
    .logout-btn:hover { background: var(--line); }

    .container { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }

    /* ---------- TABS ---------- */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    .tab-btn {
      padding: 10px 16px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      cursor: pointer;
      transition: all .15s;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab-btn:hover { color: var(--ink); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-bar input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      outline: none;
    }
    .search-bar input:focus { border-color: var(--accent); }

    /* ---------- PRODUCTS LIST ---------- */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .product-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .product-card h3 { font-size: 15px; font-weight: 600; }
    .product-meta { font-size: 13px; color: var(--muted); }
    .product-badge {
      display: inline-block;
      background: var(--soft);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      width: fit-content;
    }
    .product-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .product-actions button {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 12px;
      transition: all .15s;
    }
    .product-actions .edit-btn {
      background: #eff6ff;
      color: var(--accent);
    }
    .product-actions .edit-btn:hover { background: #dbeafe; }
    .product-actions .delete-btn {
      background: #fee2e2;
      color: #dc2626;
    }
    .product-actions .delete-btn:hover { background: #fecaca; }

    /* ---------- FORM ---------- */
    .form-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }
    .form-card h2 { font-size: 16px; margin-bottom: 16px; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .form-grid.full { grid-template-columns: 1fr; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 80px; }
    .field small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

    .variant-item {
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: end;
    }
    .variant-item input { font-size: 13px; }
    .variant-item .remove-btn {
      color: #dc2626;
      font-size: 18px;
      padding: 4px 8px;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .form-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: background .15s;
    }
    .save-btn {
      background: var(--ok);
      color: #fff;
    }
    .save-btn:hover { background: #15803d; }
    .cancel-btn {
      background: var(--line);
      color: var(--muted);
    }
    .cancel-btn:hover { background: #d1d5db; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--soft);
    }
    .empty-state div { font-size: 48px; margin-bottom: 12px; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      z-index: 300;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--ok); }
    .toast.error { background: #dc2626; }

    /* ---------- ADMIN CATEGORY SIDEBAR ---------- */
    .products-layout { display: flex; gap: 20px; align-items: flex-start; }
    .products-main { flex: 1; min-width: 0; }
    .admin-cats {
      display: flex; flex-direction: column; gap: 8px;
      width: 180px; flex-shrink: 0; padding: 4px 0;
    }
    .chip-group { display: flex; align-items: stretch; width: 100%; }
    .admin-chip {
      flex: 1; padding: 10px 14px;
      background: var(--soft); border: 1px solid var(--line); border-left: none;
      font-size: 13px; cursor: pointer; white-space: nowrap; text-align: left;
      transition: all .15s; border-radius: 0 8px 8px 0; overflow: hidden; text-overflow: ellipsis;
    }
    .admin-chip:not(.with-del) { border-radius: 8px; border-left: 1px solid var(--line); }
    .admin-chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .admin-chip:hover:not(.active) { border-color: var(--ink); background: var(--soft); }
    .admin-chip.active:hover { background: var(--ink); }
    .chip-del {
      flex-shrink: 0; padding: 0 8px; font-size: 14px; line-height: 1;
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 8px 0 0 8px; color: #dc2626; cursor: pointer; transition: background .15s;
    }
    .chip-del:hover { background: #fee2e2; }

    /* ---------- AVAILABILITY ROW ---------- */
    .product-card { position: relative; }
    .avail-row {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 7px 12px;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--soft); border-bottom: 1px solid var(--line);
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .avail-label { font-size: 11px; font-weight: 600; color: var(--muted); }
    .avail-label.ok { color: var(--ok); }

    /* ---------- TOGGLE SWITCH ---------- */
    .toggle-sw { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
    .toggle-sw input { opacity: 0; width: 0; height: 0; }
    .toggle-sl { position: absolute; cursor: pointer; inset: 0; background: #d1d5db; border-radius: 20px; transition: .2s; }
    .toggle-sl::before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .toggle-sw input:checked + .toggle-sl { background: var(--ok); }
    .toggle-sw input:checked + .toggle-sl::before { transform: translateX(16px); }

    @media (max-width: 600px) {
      .products-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .variant-item { grid-template-columns: 1fr 1fr; }
      .products-layout { flex-direction: column; }
      .admin-cats {
        width: 100%; flex-direction: row; overflow-x: auto;
        flex-wrap: nowrap; padding: 4px 0 6px; gap: 6px;
      }
      .chip-group { width: auto; flex-shrink: 0; }
      .admin-chip { flex: initial; text-align: center; }
    }
  </style>

</head>

<!-- ADMIN LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h1>🔐 Admin Access</h1>
    <p>Enter password to manage products</p>
    <div class="field">
      <input type="password" id="password-input" placeholder="Password" />
    </div>
    <button class="login-btn" onclick="login()">Login</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="admin-area" style="display:none;">
  <header>
    <h1>📦 Product Management</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" data-tab="products" onclick="switchTab('products')">All Products</button>
      <button class="tab-btn" data-tab="add" onclick="switchTab('add')">Add New Product</button>
    </div>

    <!-- TAB: PRODUCTS LIST -->
    <div class="tab-panel active" id="products-tab">
      <div class="products-layout">
        <div class="admin-cats" id="admin-cats"></div>
        <div class="products-main">
          <div class="search-bar">
            <input type="search" id="product-search" placeholder="Search products by name, category, or description" oninput="setSearchTerm(this.value)" />
          </div>
          <div class="products-grid" id="products-list"></div>
        </div>
      </div>
    </div>

    <!-- TAB: ADD/EDIT PRODUCT -->
    <div class="tab-panel" id="add-tab">
      <form class="form-card" onsubmit="saveProduct(event)">
        <h2 id="form-title">Add New Product</h2>

        <div class="form-grid">
          <div class="field">
            <label>Product ID (auto-assigned)</label>
            <input type="number" id="product-id" readonly style="background: var(--soft); color: var(--muted);" />
          </div>
          <div class="field">
            <label>Product Name *</label>
            <input type="text" id="product-name" placeholder="e.g., Bigas (Rice) — 1kg" required />
          </div>
        </div>

        <div class="field form-grid full">
          <label>Description</label>
          <textarea id="product-description" placeholder="Add product description (optional)"></textarea>
        </div>

        <div class="form-grid">
          <div class="field">
            <label>Category *</label>
            <select id="product-category" onchange="handleCategoryChange(this.value)">
              <option value="">Select Category</option>
            </select>
            <input type="text" id="custom-category-input" placeholder="Type new category name (e.g., Fresh Bread)"
              style="display:none; margin-top:6px; width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; outline:none;" />
          </div>
          <div class="field">
            <label>Price (₱) *</label>
            <input type="number" id="product-price" step="0.01" placeholder="0.00" required />
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label>Unit/Measurement *</label>
            <input type="text" id="product-unit" placeholder="e.g., per kilo, per pack, per pc" required />
          </div>
          <div class="field">
            <label>Stock Quantity</label>
            <input type="number" id="product-stock" step="1" placeholder="Leave blank for unlimited" />
          </div>
        </div>

        <div class="field form-grid full">
          <label>Product Photos <span style="font-weight:400; color:var(--muted);">(max 5)</span></label>
          <small>First photo appears on the product card. Supports JPG, PNG, WEBP.</small>
          <div id="photo-previews" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;"></div>
          <label id="photo-upload-label" style="margin-top:8px; padding:9px 14px; background:var(--soft); border:1px dashed var(--line); border-radius:8px; cursor:pointer; font-size:13px; display:inline-block; width:fit-content;">
            + Add Photo
            <input type="file" id="product-photos" accept="image/*" multiple style="display:none;" onchange="handlePhotoUpload(event)" />
          </label>
          <span id="photo-count-msg" style="font-size:12px; color:var(--muted); margin-top:4px; display:block;"></span>
        </div>

        <!-- VARIANTS -->
        <div class="field form-grid full">
          <label>Product Variants (e.g., different sizes)</label>
          <small>Add different options customers can choose from</small>
          <div id="variants-list" style="margin-top: 8px;"></div>
          <button type="button" onclick="addVariantField()" style="margin-top: 8px; padding: 8px 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; cursor: pointer; width: fit-content;">+ Add Variant</button>
        </div>

        <div class="form-actions">
          <button type="submit" class="save-btn">Save Product</button>
          <button type="button" class="cancel-btn" onclick="resetForm()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  { id: 64, name: "Instant Ramen Pack",       category: "Noodles",            price: 8,   unit: "per pack",   emoji: "🍜" },
  { id: 65, name: "Mami Noodles",             category: "Noodles",            price: 10,  unit: "per pack",   emoji: "🍲" },
  { id: 66, name: "Crackers Pack",            category: "Snacks",             price: 22,  unit: "per pack",   emoji: "🥣" },
  { id: 67, name: "Sliced Bread",             category: "Household",          price: 35,  unit: "per loaf",   emoji: "🍞" },
  { id: 68, name: "Butter (Unsalted)",        category: "Cooking Essentials", price: 80,  unit: "per carton", emoji: "🧈" },
  { id: 69, name: "Coffee Mix — 1kg",         category: "Beverages",          price: 120, unit: "per pack",   emoji: "☕" }
];

let products = [];
let isLoggedIn = localStorage.getItem('sariAdminLoggedIn') === 'true';
let editingProductId = null;
let variantCount = 0;
let searchTerm = '';
let currentImages = [];
let unsubscribeProducts = null;
let adminActiveCategory = 'All';

async function seedDefaultProducts() {
  const local = JSON.parse(localStorage.getItem('sariProducts') || '[]');
  const source = local.length > 0 ? local : DEFAULT_PRODUCTS;
  const batch = db.batch();
  source.forEach(p => { batch.set(db.collection('products').doc(String(p.id)), p); });
  try {
    await batch.commit();
    showToast('Products synced to cloud!', 'success');
  } catch (err) {
    console.error('Seed error:', err);
    showToast('Error syncing products', 'error');
  }
}

// ---------- PHOTO UPLOAD ----------
function handlePhotoUpload(event) {
  const files = Array.from(event.target.files);
  const remaining = 5 - currentImages.length;
  files.slice(0, remaining).forEach(file => compressImage(file, compressed => {
    if (currentImages.length < 5) { currentImages.push(compressed); renderPhotoPreviews(); }
  }));
  event.target.value = '';
}

function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const max = 400;
      let w = img.width, h = img.height;
      if (w > max || h > max) {
        if (w > h) { h = Math.round(h * max / w); w = max; }
        else { w = Math.round(w * max / h); h = max; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.6));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderPhotoPreviews() {
  const container  = document.getElementById('photo-previews');
  const uploadLabel = document.getElementById('photo-upload-label');
  const msg        = document.getElementById('photo-count-msg');
  if (!container) return;
  container.innerHTML = currentImages.map((src, i) => `
    <div style="position:relative;">
      <img src="${src}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line);" />
      <button type="button" onclick="removePhoto(${i})"
        style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:#dc2626;color:#fff;border-radius:50%;font-size:14px;display:grid;place-items:center;cursor:pointer;">×</button>
    </div>
  `).join('');
  if (uploadLabel) uploadLabel.style.display = currentImages.length >= 5 ? 'none' : 'inline-block';
  if (msg) msg.textContent = currentImages.length > 0 ? `${currentImages.length}/5 photo${currentImages.length !== 1 ? 's' : ''}` : '';
}

function removePhoto(index) {
  currentImages.splice(index, 1);
  renderPhotoPreviews();
}

// ---------- AUTH ----------
function login() {
  const pwd = document.getElementById('password-input').value;
  if (pwd === ADMIN_PASSWORD) {
    localStorage.setItem('sariAdminLoggedIn', 'true');
    isLoggedIn = true;
    showAdmin();
  } else {
    document.getElementById('login-error').textContent = 'Incorrect password';
  }
}

function logout() {
  if (unsubscribeProducts) { unsubscribeProducts(); unsubscribeProducts = null; }
  localStorage.removeItem('sariAdminLoggedIn');
  isLoggedIn = false;
  showLogin();
  resetForm();
}

function showLogin() {
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('admin-area').style.display = 'none';
}

function showAdmin() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('admin-area').style.display = 'block';
  subscribeToProducts();
}

function subscribeToProducts() {
  if (unsubscribeProducts) unsubscribeProducts();
  unsubscribeProducts = db.collection('products').onSnapshot(snapshot => {
    products = snapshot.docs.map(doc => doc.data());
    products.sort((a, b) => a.id - b.id);
    if (products.length === 0) {
      seedDefaultProducts();
    } else {
      renderAdminCategories();
      renderProducts();
    }
  }, err => {
    console.error('Firestore error:', err);
    showToast('Error connecting to database', 'error');
  });
}

// ---------- TABS ----------
function switchTab(tab, reset = true) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

  const button = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
  if (button) {
    button.classList.add('active');
  }
  document.getElementById(tab + '-tab').classList.add('active');

  if (tab === 'add' && reset) {
    resetForm();
  }
}

// ---------- PRODUCTS ----------
function setSearchTerm(value) {
  searchTerm = value.trim().toLowerCase();
  renderProducts();
}

function renderAdminCategories() {
  const cats = new Set(['All']);
  products.forEach(p => { if (p.category) cats.add(p.category); });
  const wrap = document.getElementById('admin-cats');
  if (!wrap) return;
  wrap.innerHTML = [...cats].map(c => {
    const active = c === adminActiveCategory ? 'active' : '';
    const safeC = c.replace(/'/g, "\\'");
    if (c === 'All') {
      return `<button class="admin-chip ${active}" onclick="pickAdminCategory('${safeC}')">${c}</button>`;
    }
    return `<span class="chip-group">
      <button class="chip-del" onclick="deleteCategory('${safeC}')" title="Delete category">×</button>
      <button class="admin-chip with-del ${active}" onclick="pickAdminCategory('${safeC}')">${c}</button>
    </span>`;
  }).join('');
  updateCategorySelect();
}

function pickAdminCategory(cat) {
  adminActiveCategory = cat;
  renderAdminCategories();
  renderProducts();
}

function deleteCategory(cat) {
  const tagged = products.filter(p => p.category === cat);
  if (tagged.length > 0) {
    showToast(
      `Cannot delete "${cat}" — ${tagged.length} product${tagged.length > 1 ? 's are' : ' is'} still tagged to it. Reassign or delete them first.`,
      'error'
    );
    return;
  }
  if (adminActiveCategory === cat) adminActiveCategory = 'All';
  renderAdminCategories();
  renderProducts();
  showToast(`Category "${cat}" removed.`, 'success');
}

function updateCategorySelect(selectedValue = '') {
  const sel = document.getElementById('product-category');
  if (!sel) return;
  const cats = new Set([...ADMIN_CATEGORIES]);
  products.forEach(p => { if (p.category) cats.add(p.category); });
  sel.innerHTML =
    `<option value="">Select Category</option>` +
    [...cats].map(c => `<option value="${c}" ${selectedValue === c ? 'selected' : ''}>${c}</option>`).join('') +
    `<option value="__custom__">+ Create new category…</option>`;
}

function handleCategoryChange(val) {
  const inp = document.getElementById('custom-category-input');
  if (val === '__custom__') {
    inp.style.display = 'block';
    inp.focus();
  } else {
    inp.style.display = 'none';
    inp.value = '';
  }
}

async function toggleAvailability(id, available) {
  try {
    await db.collection('products').doc(String(id)).update({ available });
  } catch (err) {
    console.error('Toggle error:', err);
    showToast('Error updating availability', 'error');
  }
}

function renderProducts() {
  let filtered = products;
  if (adminActiveCategory !== 'All') {
    filtered = filtered.filter(p => p.category === adminActiveCategory);
  }
  if (searchTerm) {
    filtered = filtered.filter(p => {
      const text = `${p.name} ${p.category} ${p.description || ''}`.toLowerCase();
      return text.includes(searchTerm);
    });
  }

  if (filtered.length === 0) {
    document.getElementById('products-list').innerHTML = `
      <div class="empty-state" style="grid-column: 1 / -1;">
        <div>${searchTerm ? '🔍' : '📦'}</div>
        <div>${searchTerm ? `No products match "${searchTerm}"` : 'No products in this category'}</div>
        <p style="margin-top: 8px; font-size: 13px;">Try a different name, category, or keyword.</p>
      </div>`;
    return;
  }

  document.getElementById('products-list').innerHTML = filtered.map(p => {
    const available = p.available !== false;
    return `
    <div class="product-card" style="padding-top: 42px;">
      <div class="avail-row">
        <span class="avail-label ${available ? 'ok' : ''}">${available ? '● Available' : '○ Out of stock'}</span>
        <label class="toggle-sw" title="${available ? 'Mark as out of stock' : 'Mark as available'}">
          <input type="checkbox" ${available ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleAvailability(${p.id}, this.checked)" />
          <span class="toggle-sl"></span>
        </label>
      </div>
      <div style="width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-size:32px;">
        ${p.images && p.images.length > 0 ? `<img src="${p.images[0]}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;">` : p.emoji || '📦'}
      </div>
      <h3>${p.name}</h3>
      <div class="product-meta">
        <div><strong>₱${parseFloat(p.price).toFixed(2)}</strong> · ${p.unit}</div>
        <div style="margin-top: 4px; color: var(--muted);">${p.category}</div>
        ${p.stock ? `<div style="margin-top: 4px; color: var(--warn);">Stock: ${p.stock}</div>` : ''}
      </div>
      ${p.description ? `<div style="font-size: 13px; margin-top: 8px; color: var(--muted);">${p.description}</div>` : ''}
      ${p.variants && p.variants.length > 0 ? `
        <div style="background: var(--soft); padding: 8px; border-radius: 6px; margin-top: 8px; font-size: 12px;">
          <strong>Variants:</strong> ${p.variants.map(v => `${v.name} (₱${parseFloat(v.price || 0).toFixed(2)})`).join(', ')}
        </div>
      ` : ''}
      <div class="product-actions">
        <button type="button" class="edit-btn" onclick="editProduct(${p.id})">Edit</button>
        <button type="button" class="delete-btn" onclick="deleteProduct(${p.id})">Delete</button>
      </div>
    </div>
  `;}).join('');
}

function editProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;

  editingProductId = id;
  document.getElementById('form-title').textContent = 'Edit Product';
  document.getElementById('product-id').value = p.id;
  document.getElementById('product-name').value = p.name;
  document.getElementById('product-description').value = p.description || '';
  updateCategorySelect(p.category);
  document.getElementById('custom-category-input').style.display = 'none';
  document.getElementById('product-price').value = p.price;
  document.getElementById('product-unit').value = p.unit;
  document.getElementById('product-stock').value = p.stock || '';
  currentImages = p.images ? [...p.images] : [];
  renderPhotoPreviews();

  // Populate variants
  variantCount = 0;
  document.getElementById('variants-list').innerHTML = '';
  if (p.variants && p.variants.length > 0) {
    p.variants.forEach(v => {
      addVariantField(v.name, v.price);
    });
  }

  switchTab('add', false);
}

async function deleteProduct(id) {
  if (!confirm('Delete this product? This cannot be undone.')) return;
  try {
    await db.collection('products').doc(String(id)).delete();
    showToast('Product deleted', 'success');
  } catch (err) {
    console.error('Delete error:', err);
    showToast('Error deleting product', 'error');
  }
}

async function saveProduct(e) {
  e.preventDefault();

  const selCat = document.getElementById('product-category').value;
  const customCat = document.getElementById('custom-category-input').value.trim();
  const category = selCat === '__custom__' ? customCat : selCat;
  if (!category) {
    showToast('Please select or enter a category', 'error');
    return;
  }

  const formData = {
    name: document.getElementById('product-name').value,
    description: document.getElementById('product-description').value,
    category,
    price: parseFloat(document.getElementById('product-price').value),
    unit: document.getElementById('product-unit').value,
    stock: document.getElementById('product-stock').value ? parseInt(document.getElementById('product-stock').value) : null,
    emoji: editingProductId ? (products.find(p => p.id === editingProductId)?.emoji || '📦') : '📦',
    images: [...currentImages],
    variants: []
  };

  document.querySelectorAll('[data-variant-name]').forEach(field => {
    const idx = field.dataset.variantIndex;
    const name = field.value;
    const priceField = document.querySelector(`[data-variant-price="${idx}"]`);
    const price = priceField ? parseFloat(priceField.value) || 0 : 0;
    if (name) formData.variants.push({ name, price });
  });

  formData.id = editingProductId || (products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1);

  try {
    await db.collection('products').doc(String(formData.id)).set(formData);
    showToast(editingProductId ? 'Product updated' : 'Product added', 'success');
    resetForm();
    switchTab('products');
  } catch (err) {
    console.error('Save error:', err);
    showToast('Error saving product', 'error');
  }
}

function resetForm() {
  document.getElementById('form-title').textContent = 'Add New Product';
  document.querySelector('form').reset();
  document.getElementById('product-id').value = '';
  document.getElementById('variants-list').innerHTML = '';
  const customInp = document.getElementById('custom-category-input');
  if (customInp) { customInp.style.display = 'none'; customInp.value = ''; }
  updateCategorySelect();
  variantCount = 0;
  editingProductId = null;
  currentImages = [];
  renderPhotoPreviews();
}

function addVariantField(name = '', price = '') {
  const idx = variantCount++;
  const html = `
    <div class="variant-item">
      <input type="text" data-variant-name data-variant-index="${idx}" placeholder="Variant name (e.g., Large)" value="${name}" />
      <input type="number" data-variant-price="${idx}" step="0.01" placeholder="Price" value="${price}" />
      <button type="button" class="remove-btn" onclick="this.parentElement.remove()">×</button>
    </div>
  `;
  document.getElementById('variants-list').innerHTML += html;
}

// Products are saved directly to Firestore via saveProduct() / deleteProduct()

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('success', 'error');
  t.classList.add('show', type);
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- INIT ----------
window.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('password-input') === document.activeElement) {
    login();
  }
});

if (isLoggedIn) {
  showAdmin();
} else {
  showLogin();
}
</script>
