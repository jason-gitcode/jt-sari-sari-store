<!DOCTYPE html>

<meta charset="UTF-8" />

<title>Order Summary — JT Sari-Sari Store</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --ink: #1a1a1a; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-dark: #1d4ed8;
    --ok: #16a34a; --soft: #f9fafb; --radius: 10px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font: inherit; color: inherit; }

  /* Header */
  header { position: sticky; top: 0; z-index: 50; background: #fff; border-bottom: 1px solid var(--line); }
  .nav { max-width: 640px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .back-btn { font-size: 14px; color: var(--accent); font-weight: 500; text-decoration: none; flex-shrink: 0; }
  .back-btn:hover { color: var(--accent-dark); }
  .nav-title { font-size: 16px; font-weight: 600; }

  /* Layout */
  .container { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
  .section { margin-bottom: 20px; }
  .section-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }

  /* Order summary */
  .summary-card { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .summary-list { width: 100%; margin: 0; padding: 0; list-style: none; font-size: 13px; }
  .order-item { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .order-item:last-child { border-bottom: none; }
  .order-item__qty { font-weight: 700; color: var(--ink); width: 34px; min-width: 34px; }
  .order-item__desc { display: inline-block; width: 100%; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .order-item__price { font-weight: 700; color: var(--ink); white-space: nowrap; text-align: right; }
  .summary-fee-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .summary-fee-row span:last-child { font-weight: 600; color: var(--ink); }
  .summary-fee-row .free { color: var(--ok); }
  .summary-total { display: flex; justify-content: space-between; align-items: center; padding: 14px 14px; background: var(--soft); font-weight: 700; font-size: 15px; border-top: 1px solid var(--line); }
  .summary-total__amount { color: var(--accent); }
  @media (max-width: 480px) {
    .order-item { padding: 10px 12px; gap: 8px; }
    .order-item__qty, .order-item__desc { font-size: 11px; }
    .order-item__price { font-size: 13px; }
    .summary-total { padding: 12px; font-size: 14px; }
  }

  /* Form fields */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; outline: none; background: #fff;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 60px; }
  .address-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .sub-label { font-size: 12px; color: var(--muted); margin-bottom: 3px; display: block; }

  /* Payment */
  .pay-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pay-opt { border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 14px; text-align: center; transition: all .15s; }
  .pay-opt.active { border-color: var(--accent); background: #eff6ff; color: var(--accent-dark); font-weight: 600; }
  .pay-info { margin-top: 10px; padding: 10px; background: var(--soft); border-radius: 8px; font-size: 13px; color: var(--muted); display: none; }
  .pay-info.show { display: block; }
  .pay-info strong { color: var(--ink); }

  /* Send button */
  .send-btn { width: 100%; padding: 14px; background: var(--accent); color: #fff; border-radius: var(--radius); font-weight: 600; font-size: 16px; transition: background .15s; margin-top: 4px; }
  .send-btn:hover { background: var(--accent-dark); }

  /* Toast */
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 300; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Empty state */
  .empty { text-align: center; padding: 60px 16px; color: var(--muted); }
  .empty a { color: var(--accent); font-weight: 500; text-decoration: none; }

  /* Order confirmation screen */
  .confirm-screen { text-align: center; padding: 48px 16px; }
  .confirm-icon { font-size: 72px; margin-bottom: 16px; line-height: 1; }
  .confirm-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .confirm-order-num { font-size: 13px; color: var(--muted); margin-bottom: 16px; font-family: monospace; letter-spacing: 0.1em; }
  .confirm-gcash-box { background: var(--soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; text-align: left; margin: 16px auto; max-width: 360px; font-size: 14px; }
  .confirm-gcash-box h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .confirm-gcash-box p { margin-top: 6px; }
  .confirm-back { display: inline-block; margin-top: 24px; padding: 12px 28px; background: var(--accent); color: #fff; border-radius: var(--radius); font-weight: 600; text-decoration: none; font-size: 15px; transition: background .15s; }
  .confirm-back:hover { background: var(--accent-dark); }

</style>

async function sendDiscordNotification(order, shortId) {
  const addr = order.address
    ? `Block ${order.address.block}, Lot ${order.address.lot}, Phase ${order.address.phase}, St. ${order.address.street}, Valle Verde`
    : '—';
  const itemLines = (order.items || [])
    .map(i => `  ${i.qty}× ${i.productName} — ₱${parseFloat(i.lineTotal).toFixed(2)}`)
    .join('\n');
  const lines = [
    `🛒 **New Order #${shortId}**`,
    ``,
    `👤 ${order.customer.name} · ${order.customer.phone}`,
    `📍 ${addr}`,
    ``,
    itemLines,
    ``,
    `🧾 Subtotal: ₱${parseFloat(order.subtotal || order.total).toFixed(2)}`,
    `🛵 Delivery: ${(order.deliveryFee || 0) === 0 ? 'Free' : '₱' + parseFloat(order.deliveryFee).toFixed(2)}`,
    `💰 **Total: ₱${parseFloat(order.total).toFixed(2)}**`,
    `💳 ${order.payment === 'gcash' ? '📱 GCash' : '💵 Cash on Delivery'}`,
  ];
  if (order.notes) lines.push(`📝 Notes: ${order.notes}`);
  try {
    await fetch(DISCORD_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: lines.join('\n') })
    });
  } catch (e) { console.error('Discord notification error:', e); }
}

function pickPay(method) {
  payMethod = method;
  document.querySelectorAll('.pay-opt').forEach(b => b.classList.toggle('active', b.dataset.pay === method));

async function placeOrder() {
  const name   = document.getElementById('cust-name').value.trim();
  const phone  = document.getElementById('cust-phone').value.trim();
  const block  = document.getElementById('cust-block').value;
  const lot    = document.getElementById('cust-lot').value;
  const phase  = document.getElementById('cust-phase').value;
  const street = document.getElementById('cust-street').value;

  let hasError = false;

  if (!name) { showToast("Please fill in your name."); hasError = true; }

  const phoneErr   = document.getElementById('phone-error');
  const phoneInput = document.getElementById('cust-phone');
  const validPhone = /^09\d{9}$/.test(phone);
  if (!validPhone) {
    if (phoneErr)   phoneErr.style.display = 'block';
    if (phoneInput) phoneInput.style.borderColor = '#dc2626';
    if (!hasError)  showToast("Mobile number must be 11 digits and start with 09.");
    hasError = true;
  } else {
    if (phoneErr)   phoneErr.style.display = 'none';
    if (phoneInput) phoneInput.style.borderColor = '';
  }

  if (!block || !lot || !phase || !street) {
    if (!hasError) showToast("Please complete your delivery address.");
    hasError = true;
  }

  if (hasError) return;

  const btn = document.getElementById('place-order-btn');
  btn.disabled = true;
  btn.textContent = 'Placing order…';

  const items = Object.entries(cart).map(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    if (!p) return null;
    return { productId: String(id), productName: p.name, qty, price: p.price, lineTotal: p.price * qty };
  }).filter(Boolean);

  const orderData = {
    status: 'pending',
    customer: { name, phone },
    address: { block, lot, phase, street },
    payment: payMethod,
    notes: document.getElementById('cust-notes').value.trim(),
    items,
    subtotal: cartTotal(),
    deliveryFee: deliveryFee(),
    total: cartTotal() + deliveryFee(),
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  const orderRef = db.collection('orders').doc();
  let stockErrorMsg = null;

  try {
    await db.runTransaction(async (transaction) => {
      // Read all stock-tracked products first (reads must precede writes in a transaction)
      const trackedItems = items.filter(item => {
        const p = PRODUCTS.find(x => x.id == item.productId);
        return p && p.stock !== null && p.stock !== undefined;
      });
      const productRefs = trackedItems.map(item => db.collection('products').doc(item.productId));
      const snaps = await Promise.all(productRefs.map(ref => transaction.get(ref)));

      // Validate stock for each tracked item
      for (let i = 0; i < trackedItems.length; i++) {
        const snap = snaps[i];
        const item = trackedItems[i];
        const data = snap.data();
        if (!snap.exists || data.available === false || data.stock === 0) {
          stockErrorMsg = `"${item.productName}" is sold out.`;
          throw new Error(stockErrorMsg);
        }
        if (data.stock < item.qty) {
          stockErrorMsg = `Only ${data.stock} of "${item.productName}" left in stock.`;
          throw new Error(stockErrorMsg);
        }
      }

      // All checks passed — write order and deduct stock atomically
      transaction.set(orderRef, orderData);
      for (let i = 0; i < trackedItems.length; i++) {
        const newStock = snaps[i].data().stock - trackedItems[i].qty;
        const upd = { stock: newStock };
        if (newStock === 0) upd.available = false;
        transaction.update(productRefs[i], upd);
      }
    });

    const shortId = orderRef.id.slice(-6).toUpperCase();
    sendDiscordNotification(orderData, shortId).catch(() => {});
    localStorage.setItem('sariCustomer', JSON.stringify({ name, phone }));
    localStorage.setItem('sariAddress',  JSON.stringify({ block, lot, phase, street }));
    localStorage.removeItem('sariCart');
    showOrderConfirmation(orderRef.id, payMethod);
  } catch (err) {
    console.error('Order error:', err);
    btn.disabled = false;
    btn.textContent = 'Place Order';
    showToast(stockErrorMsg || 'Failed to place order. Please try again.');
  }
}

function showOrderConfirmation(orderId, payment) {
  const shortId = orderId.slice(-6).toUpperCase();
  const gcashHtml = payment === 'gcash' ? `
    <div class="confirm-gcash-box">
      <h3>📱 GCash Payment Required</h3>
      <p>Send payment to:</p>
      <p style="margin-top:6px;"><strong>${STORE.gcashName}</strong></p>
      <p style="display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;">
        <strong>${STORE.gcashNumber}</strong>
        <button onclick="navigator.clipboard.writeText('${STORE.gcashNumber}').catch(()=>{})" style="padding:2px 8px;font-size:12px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;">Copy</button>
      </p>
      <p style="display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap;">
        <span>Order No. <strong>#${shortId}</strong></span>
        <button onclick="navigator.clipboard.writeText('#${shortId}').catch(()=>{})" style="padding:2px 8px;font-size:12px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;">Copy</button>
      </p>
      <p style="margin-top:10px;font-size:13px;color:var(--muted);">When sending payment in the GCash app, include the Order No. in the message.</p>
    </div>
  ` : '';

  document.getElementById('main').innerHTML = `
    <div class="confirm-screen">
      <div class="confirm-icon">✅</div>
      <div class="confirm-title">Order Placed!</div>
      <div class="confirm-order-num">Order #${shortId}</div>
      <p style="font-size:14px;color:var(--muted);">We'll review your order and confirm it shortly.</p>
      ${gcashHtml}
      <a href="index.html" class="confirm-back">Continue Shopping</a>
    </div>
  `;
}

function copyGcashNumber() {
  const number = document.getElementById('gcash-number').textContent;
  navigator.clipboard.writeText(number).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    btn.style.borderColor = 'var(--ok)';
    btn.style.color = 'var(--ok)';
    setTimeout(() => { btn.textContent = 'Copy'; btn.style.borderColor = 'var(--line)'; btn.style.color = ''; }, 2000);
  });
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// Load products from Firestore, then render
db.collection('products').get().then(snapshot => {
  if (!snapshot.empty) {
    PRODUCTS = snapshot.docs.map(doc => doc.data());
    PRODUCTS.sort((a, b) => a.id - b.id);
  } else {
    PRODUCTS = DEFAULT_PRODUCTS;
  }
  Object.keys(cart).forEach(id => { if (!PRODUCTS.find(x => x.id == id)) delete cart[id]; });
  init();
}).catch(() => {
  PRODUCTS = JSON.parse(localStorage.getItem('sariProducts') || '[]');
  if (!PRODUCTS.length) PRODUCTS = DEFAULT_PRODUCTS;
  Object.keys(cart).forEach(id => { if (!PRODUCTS.find(x => x.id == id)) delete cart[id]; });
  init();
});
</script>
