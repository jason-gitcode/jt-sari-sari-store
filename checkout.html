<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --ink: #1a1a1a; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-dark: #1d4ed8;
    --ok: #16a34a; --soft: #f9fafb; --radius: 10px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font: inherit; color: inherit; }

  /* Header */
  header { position: sticky; top: 0; z-index: 50; background: #fff; border-bottom: 1px solid var(--line); }
  .nav { max-width: 640px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .back-btn { font-size: 14px; color: var(--accent); font-weight: 500; text-decoration: none; flex-shrink: 0; }
  .back-btn:hover { color: var(--accent-dark); }
  .nav-title { font-size: 16px; font-weight: 600; }

  /* Layout */
  .container { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
  .section { margin-bottom: 20px; }
  .section-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }

  /* Order summary */
  .summary-card { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .summary-list { width: 100%; margin: 0; padding: 0; list-style: none; font-size: 13px; }
  .order-item { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .order-item:last-child { border-bottom: none; }
  .order-item__qty { font-weight: 700; color: var(--ink); width: 34px; min-width: 34px; }
  .order-item__desc { display: inline-block; width: 100%; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .order-item__price { font-weight: 700; color: var(--ink); white-space: nowrap; text-align: right; }
  .summary-fee-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .summary-fee-row span:last-child { font-weight: 600; color: var(--ink); }
  .summary-fee-row .free { color: var(--ok); }
  .summary-total { display: flex; justify-content: space-between; align-items: center; padding: 14px 14px; background: var(--soft); font-weight: 700; font-size: 15px; border-top: 1px solid var(--line); }
  .summary-total__amount { color: var(--accent); }
  .free-delivery-nudge { padding: 10px 14px 12px; border-top: 1px solid var(--line); }
  .free-delivery-nudge-track { height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .free-delivery-nudge-fill { height: 100%; background: #16a34a; border-radius: 99px; }
  .free-delivery-nudge-text { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }
  .free-delivery-nudge-text strong { color: var(--ink); }
  @media (max-width: 480px) {
    .order-item { padding: 10px 12px; gap: 8px; }
    .order-item__qty, .order-item__desc { font-size: 11px; }
    .order-item__price { font-size: 13px; }
    .summary-total { padding: 12px; font-size: 14px; }
  }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .field input, .field select, .field textarea {

    border: 1px solid var(--line); border-radius: 8px;

  .loc-search { padding: 10px 16px; border-bottom: 1px solid var(--line); position: relative; flex-shrink: 0; }

  .loc-results { position: absolute; left: 16px; right: 16px; top: calc(100% - 1px); background: #fff; border: 1px solid var(--line); border-radius: 0 0 8px 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12); z-index: 600; display: none; max-height: 220px; overflow-y: auto; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 300; pointer-events: none; }

const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1500127416901959761/oOa7M12ubSvN_KDDO1uNX7nTPVBSYc_h56t0MSC4BDPGrKL3Adov0B8G5cBcw7n3DDpt';

async function sendDiscordNotification(order, shortId) {
  const isPickup = order.fulfillmentMethod === 'pickup';
  const addr = (order.address && !isPickup)
    ? [order.address.lotBlock, order.address.street, order.address.subdivision, order.address.floor ? `Floor ${order.address.floor}` : ''].filter(Boolean).join(', ')
    : '—';
  const itemLines = (order.items || [])
    .map(i => `  ${i.qty}× ${i.productName} — ₱${parseFloat(i.lineTotal).toFixed(2)}`)
    .join('\n');
  const payLabel = order.payment === 'gcash' ? '📱 GCash'
                 : order.payment === 'cash'  ? '💵 Cash at Pickup'
                 : '🛵 Cash on Delivery';
  const lines = [
    `🛒 **New Order #${shortId}** ${isPickup ? '· 🏬 PICK-UP' : '· 🛵 DELIVERY'}`,
    ``,
    `👤 ${order.customer.name} · ${order.customer.phone}`,
    isPickup ? `🏬 Pick-up at store` : `📍 ${addr}`,
    ``,
    itemLines,
    ``,
    `🧾 Subtotal: ₱${parseFloat(order.subtotal || order.total).toFixed(2)}`,
    `🛵 Delivery: ${isPickup ? '—' : ((order.deliveryFee || 0) === 0 ? 'Free' : '₱' + parseFloat(order.deliveryFee).toFixed(2))}`,
    `💰 **Total: ₱${parseFloat(order.total).toFixed(2)}**`,
    `💳 ${payLabel}`,
  ];
  if (order.deliverySchedule) lines.push(`🕒 Delivery Schedule: ${order.deliverySchedule}`);
  if (order.notes) lines.push(`📝 Notes: ${order.notes}`);
  try {
    await fetch(DISCORD_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: lines.join('\n') })
    });
  } catch (e) { console.error('Discord notification error:', e); }
}

function resolveTenantId() {
  const parts = window.location.pathname.split('/').filter(Boolean);
  if (parts.length === 0) return null;
  if (RESERVED_TENANT_IDS.has(parts[0])) return null;
  return parts[0];
}

function tcol(name) {
  if (!TENANT_ID) throw new Error('Cannot read ' + name + ' — no tenant in URL');
  return db.collection('tenants').doc(TENANT_ID).collection(name);
}
function tdoc(name, id) { return tcol(name).doc(id); }
function tenantUrl(suffix) {
  const s = suffix.startsWith('/') ? suffix.slice(1) : suffix;
  return '/' + (TENANT_ID || 'jsminimart') + '/' + s;
}
function resolveTenantHrefs() {
  document.querySelectorAll('[data-tenant-href]').forEach(el => {
    const suffix = el.getAttribute('data-tenant-href') || '';
    el.setAttribute('href', tenantUrl(suffix));

}

  { start: '10:00', end: '14:00' },

function fmtTime12Short(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'pm' : 'am';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return m === 0 ? `${h12}${ampm}` : `${h12}:${String(m).padStart(2, '0')}${ampm}`;
}

function scheduleSlotsFromSettings() {
  const arr = (Array.isArray(storeSettingsData.deliverySchedules) && storeSettingsData.deliverySchedules.length > 0)
    ? storeSettingsData.deliverySchedules
    : DEFAULT_DELIVERY_SCHEDULES;
  return arr.map(s => ({
    id:    `${s.start}-${s.end}`,
    label: `${fmtTime12Short(s.start)} – ${fmtTime12Short(s.end)}`,
    start: s.start,
    end:   s.end
  }));
}

function getManilaHour() {
  const now = new Date();
  const manilaDate = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Manila' }));
  return manilaDate.getHours();
}

function getOpenHour()  { return (typeof storeSettingsData.storeOpenHour  === 'number') ? storeSettingsData.storeOpenHour  : 6; }
function getCloseHour() { return (typeof storeSettingsData.storeCloseHour === 'number') ? storeSettingsData.storeCloseHour : 16; }
function getOpenDays()  { return Array.isArray(storeSettingsData.openDays) ? storeSettingsData.openDays : [0,1,2,3,4,5,6]; }
function getManilaDayIdx() {
  const wd = new Intl.DateTimeFormat('en-US', { weekday: 'short', timeZone: 'Asia/Manila' }).format(new Date());
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(wd);
}
function fmtHour12Long(h) {
  if (h === 0) return '12:00 AM'; if (h < 12) return `${h}:00 AM`;
  if (h === 12) return '12:00 PM'; return `${h - 12}:00 PM`;
}

function isStoreHoursClosed() {
  if (!getOpenDays().includes(getManilaDayIdx())) return true;
  const h = getManilaHour();
  const o = getOpenHour(), c = getCloseHour();
  return (o < c) ? (h < o || h >= c) : (h >= c && h < o);
}

// Period-id helpers — keep in lockstep with admin.html and checkout/index.html
function getCurrentPeriodId() {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Manila',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: 'numeric', hour12: false
  }).formatToParts(new Date());
  const y = parts.find(p => p.type === 'year').value;
  const m = parts.find(p => p.type === 'month').value;
  const d = parts.find(p => p.type === 'day').value;
  const h = parseInt(parts.find(p => p.type === 'hour').value);
  const o = getOpenHour(), c = getCloseHour();
  if (o < c) {
    if (h >= o && h < c) return `${y}-${m}-${d}-open`;
    if (h >= c)          return `${y}-${m}-${d}-closed`;
    const utc = new Date(`${y}-${m}-${d}T00:00:00Z`);
    utc.setUTCDate(utc.getUTCDate() - 1);
    return `${utc.getUTCFullYear()}-${String(utc.getUTCMonth() + 1).padStart(2,'0')}-${String(utc.getUTCDate()).padStart(2,'0')}-closed`;
  } else {
    if (h >= c && h < o) return `${y}-${m}-${d}-closed`;
    return `${y}-${m}-${d}-open`;
  }
}

let storeSettingsData = {};
function getEffectiveStoreClosed() {
  if (storeSettingsData.storeClosedSource === 'manual'
      && storeSettingsData.storeClosedPeriodId === getCurrentPeriodId()) {
    return storeSettingsData.storeClosed === true;
  }
  return isStoreHoursClosed();
}

function getAvailableSlots() {
  const now = new Date();
  const manila = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Manila' }));
  const nowMin = manila.getHours() * 60 + manila.getMinutes();
  return scheduleSlotsFromSettings().filter(s => {
    const [eh, em] = s.end.split(':').map(Number);
    return (eh * 60 + em) > nowMin;
  });
}

function updateWeatherWarning() {
  const closedNotice  = document.getElementById('store-closed-notice');
  const maintNotice   = document.getElementById('maintenance-notice');
  const offlineNotice = document.getElementById('offline-notice');
  const warning       = document.getElementById('weather-warning');
  const btn           = document.getElementById('place-order-btn');
  if (!btn) return;

  const hideAll = () => {
    if (closedNotice)  closedNotice.style.display  = 'none';
    if (maintNotice)   maintNotice.style.display   = 'none';
    if (offlineNotice) offlineNotice.style.display = 'none';
    if (warning)       warning.style.display       = 'none';
  };

  if (storeClosed) {
    hideAll();
    if (closedNotice) closedNotice.style.display = 'block';
    btn.disabled = true;
  } else if (offlineMode) {
    hideAll();
    if (offlineNotice) offlineNotice.style.display = 'block';
    btn.disabled = true;
  } else if (maintenanceMode) {
    hideAll();
    if (maintNotice) maintNotice.style.display = 'block';
    btn.disabled = true;
  } else {
    hideAll();
    if (rainMode) {
      if (warning) warning.style.display = 'block';
      btn.disabled = !document.getElementById('weather-confirm')?.checked;
    } else {
      btn.disabled = false;
    }
  }
}

function applyTenantStoreConfig() {
  const storeName = storeSettingsData.storeName || STORE.name || '';
  const pickup = storeSettingsData.pickupAddress || '';
  const pickupBox = document.getElementById('pickup-info');
  if (pickupBox) {

  if (offlineAddrEl) offlineAddrEl.textContent = pickup || (storeName ? storeName : 'our store');

  if (closedHoursEl) closedHoursEl.textContent = `${fmtHour12Long(getOpenHour())} to ${fmtHour12Long(getCloseHour())}`;
  const deliveryOn = storeSettingsData.deliveryEnabled !== false;
  const pickupOn   = storeSettingsData.pickupEnabled   !== false;
  const gcashOn    = storeSettingsData.payGcashEnabled !== false;
  const cashOn     = storeSettingsData.payCashEnabled  !== false && pickupOn;
  const codOn      = storeSettingsData.payCodEnabled   !== false && deliveryOn;
  // Force fulfillment to whatever is actually available.
  if (!deliveryOn && pickupOn && fulfillmentMethod !== 'pickup') fulfillmentMethod = 'pickup';
  if (!pickupOn && deliveryOn && fulfillmentMethod !== 'delivery') fulfillmentMethod = 'delivery';
  const ffOptionsWrap = document.querySelector('.ff-options')?.closest('.section');
  const showFfPicker = deliveryOn && pickupOn;
  if (ffOptionsWrap) ffOptionsWrap.style.display = showFfPicker ? '' : 'none';
  const ffDelBtn  = document.querySelector('.ff-opt[data-ff="delivery"]');
  const ffPickBtn = document.querySelector('.ff-opt[data-ff="pickup"]');
  if (ffDelBtn)  ffDelBtn.style.display  = deliveryOn ? '' : 'none';
  if (ffPickBtn) ffPickBtn.style.display = pickupOn   ? '' : 'none';
  const sched = document.getElementById('schedule-section');

  if (!deliveryOn) {
    const addr = document.getElementById('delivery-address-section');
    if (addr) addr.style.display = 'none';
    if (sched) sched.style.display = 'none';
    if (pickupBox) pickupBox.style.display = 'block';
  } else if (!pickupOn) {
    if (pickupBox) pickupBox.style.display = 'none';
    const hasSlots = scheduleSlotsFromSettings().length > 0;
    if (sched) sched.style.display = (schedulesOn && hasSlots) ? '' : 'none';
  } else {
    const hasSlots = scheduleSlotsFromSettings().length > 0;
    if (sched) sched.style.display = (schedulesOn && hasSlots) ? '' : 'none';

  const setPayVisible = (key, on) => {

  };

  refreshTotals();
  updatePaymentOptions();
}

function cartTotal() {
  return Object.entries(cart).reduce((sum, [key, qty]) => {
    const [idStr, vPart] = key.split('_v');
    const p = PRODUCTS.find(x => x.id == idStr);
    if (!p) return sum;
    const variant = vPart !== undefined && p.variants ? p.variants[parseInt(vPart)] : null;
    const price = variant ? parseFloat(variant.price || p.price) : p.price;
    return sum + price * qty;
  }, 0);
}
function deliveryFee() {
  const feeOn = storeSettingsData.deliveryFeeEnabled !== false;
  if (!feeOn) return 0;
  const freeOn = storeSettingsData.freeDeliveryEnabled !== false;
  const threshold = (typeof storeSettingsData.freeDeliveryThreshold === 'number') ? storeSettingsData.freeDeliveryThreshold : 400;
  if (freeOn && cartTotal() >= threshold) return 0;
  const amt = (typeof storeSettingsData.deliveryFee === 'number') ? storeSettingsData.deliveryFee : 45;
  return amt;
}

  // Restore saved pin coordinates so the picker reopens at the right spot
  if (savedAddress?.lat && savedAddress?.lng) {
    locLat = savedAddress.lat;
    locLon = savedAddress.lng;
    locPicked = true;
  }
  if (typeof updateLocStatus === 'function') updateLocStatus();

  // Attach real-time phone validation after HTML is rendered
  const phoneInput = document.getElementById('cust-phone');
  const phoneErr   = document.getElementById('phone-error');

  phoneInput.addEventListener('input', function () {
    this.value = this.value.replace(/[^0-9]/g, '');
    const val = this.value;
    const bad = (val.length >= 1 && val[0] !== '0') ||
                (val.length >= 2 && val[1] !== '9') ||
                (val.length === 11 && !/^09\d{9}$/.test(val));
    phoneErr.style.display = bad ? 'block' : 'none';
    this.style.borderColor  = bad ? '#dc2626' : '';
  });

  phoneInput.addEventListener('blur', function () {
    const bad = this.value.length > 0 && !/^09\d{9}$/.test(this.value);
    phoneErr.style.display = bad ? 'block' : 'none';
    this.style.borderColor  = bad ? '#dc2626' : '';
  });

  // Apply tenant settings to the freshly-rendered DOM.
  applyTenantStoreConfig();
}

function locateMe() {
  if (!navigator.geolocation) { showToast('Geolocation is not supported by your browser.'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: lat, longitude: lon } = pos.coords;
      // Persist into the same state the Leaflet picker uses so the order
      // gets `lat/lng` saved on its address. Without this, the iframe map
      // would refresh visually but nothing reaches the admin doc.
      locLat = lat;
      locLon = lon;
      locPicked = true;
      const iframe = document.getElementById('map-iframe');
      if (iframe) iframe.src = `https://maps.google.com/maps?q=${lat},${lon}&z=17&output=embed`;
      // If the full-screen map picker is already open, recenter it + move
      // the draggable marker so the visible state matches what was captured.
      if (locMap && locMarker) {
        locMap.setView([lat, lon], 17);
        locMarker.setLatLng([lat, lon]);
      }
      updateLocStatus();
      console.log('[locateMe] captured', { lat, lon, locPicked });
      showToast('📍 Location captured — the store will get a map link on your order.');
    },
    () => showToast('Unable to retrieve your location.')
  );
}

function handleGcashReceiptUpload(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('Please choose an image file.'); return; }
  if (file.size > 10 * 1024 * 1024) { showToast('Image too large. Max 10 MB.'); return; }
  gcashReceiptName = file.name || 'receipt.jpg';
  compressReceiptImage(file, (compressed) => {
    gcashReceiptData = compressed;
    renderGcashReceiptPreview();
  });
}
function compressReceiptImage(file, callback) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const max = 900;
      let w = img.width, h = img.height;
      if (w > max || h > max) {
        if (w > h) { h = Math.round(h * max / w); w = max; }
        else { w = Math.round(w * max / h); h = max; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => showToast('Could not load image. Try a different one.');
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

}

// Toggle delivery vs pickup — hides the address + schedule sections, swaps
// which payment options are valid, and zeroes the delivery fee for pickup.
function pickFulfillment(method) {
  fulfillmentMethod = method;
  document.querySelectorAll('.ff-opt').forEach(b => b.classList.toggle('active', b.dataset.ff === method));
  const addr     = document.getElementById('delivery-address-section');
  const sched    = document.getElementById('schedule-section');
  const pickup   = document.getElementById('pickup-info');
  const isPickup = method === 'pickup';
  if (addr)   { addr.style.display   = isPickup ? 'none' : ''; }
  if (sched)  { sched.classList.toggle('is-disabled', isPickup); }
  if (pickup) { pickup.style.display = isPickup ? 'block' : 'none'; }
  // Repaint the order summary because the delivery fee changes
  const feeRow = document.querySelector('.summary-fee-row:nth-of-type(2)');
  // Rather than fiddle individual rows, just re-render totals via updatePaymentOptions
  updatePaymentOptions();
  // Re-render the items section to reflect pickup having no delivery fee
  refreshTotals();
}

function refreshTotals() {
  // Update the Delivery Fee + Grand Total rows in place
  const isPickup = fulfillmentMethod === 'pickup';
  const subtotal = cartTotal();
  const fee = isPickup ? 0 : deliveryFee();
  const total = subtotal + fee;
  const card = document.querySelector('.summary-card');
  if (!card) return;
  const rows = card.querySelectorAll('.summary-fee-row');
  // rows[0] = Subtotal, rows[1] = Delivery Fee
  if (rows[1]) {
    const label = rows[1].querySelector('span:first-child');
    const value = rows[1].querySelector('span:last-child');
    if (label) label.textContent = isPickup ? 'Delivery Fee (Pick-up)' : 'Delivery Fee';
    if (value) {
      value.className = fee === 0 ? 'free' : '';
      value.textContent = fee === 0 ? '✓ Free' : STORE.currency + fee.toFixed(2);
    }
  }
  const totalEl = card.querySelector('.summary-total__amount');
  if (totalEl) totalEl.textContent = STORE.currency + total.toFixed(2);
  // Hide free-delivery nudge for pickup (irrelevant) — show otherwise
  const nudge = card.querySelector('.free-delivery-nudge');
  if (nudge) {
    const freeOn = storeSettingsData.freeDeliveryEnabled !== false;
    nudge.style.display = (!freeOn || isPickup || fee === 0) ? 'none' : '';
  }
}

function updatePaymentOptions() {
  const total = cartTotal();
  const codBtn   = document.querySelector('[data-pay="cod"]');
  const cashBtn  = document.querySelector('[data-pay="cash"]');
  const gcashBtn = document.querySelector('[data-pay="gcash"]');
  const note     = document.getElementById('cod-restricted-note');
  if (!codBtn || !cashBtn || !gcashBtn) return;

  const deliveryEnabled = storeSettingsData.deliveryEnabled !== false;
  const pickupEnabled   = storeSettingsData.pickupEnabled !== false;
  const cashAdminOn  = storeSettingsData.payCashEnabled  !== false && pickupEnabled;
  const gcashAdminOn = storeSettingsData.payGcashEnabled !== false;
  const codAdminOn   = storeSettingsData.payCodEnabled   !== false && deliveryEnabled;

  const isPickup = fulfillmentMethod === 'pickup';

  // Cash is for in-person pickup only, and only if admin allows
  cashBtn.classList.toggle('disabled', !isPickup || !cashAdminOn);
  // Cash on Delivery is for delivery only, only if admin allows, and only
  // under the per-tenant cart-total limit (0 = no limit).
  const codLimitRaw = storeSettingsData.codMaxAmount;
  const codLimit = (typeof codLimitRaw === 'number' && codLimitRaw >= 0) ? codLimitRaw : 200;
  const codAllowedByTotal = (codLimit === 0) || (total < codLimit);
  const codAllowedByFulfill = !isPickup;
  const codDisabled = !(codAllowedByTotal && codAllowedByFulfill && codAdminOn);
  codBtn.classList.toggle('disabled', codDisabled);

  // Bubble the COD limit note only when delivery is selected AND COD is admin-allowed
  if (note) {
    if (!isPickup && codAdminOn && !codAllowedByTotal) {
      note.textContent = `Cash on Delivery is not available for orders ₱${codLimit} and above. Please use GCash.`;
      note.style.display = 'block';
    } else {
      note.style.display = 'none';
    }
  }

  // If the currently selected method has just become invalid, pick a sensible default
  const cashValid  = isPickup && cashAdminOn;
  const codValid   = !isPickup && codAllowedByTotal && codAdminOn;
  const gcashValid = gcashAdminOn;
  const stillValid =
    (payMethod === 'cash'  && cashValid) ||
    (payMethod === 'cod'   && codValid)  ||
    (payMethod === 'gcash' && gcashValid);
  if (!stillValid) {
    if (cashValid)       pickPay('cash');
    else if (codValid)   pickPay('cod');
    else if (gcashValid) pickPay('gcash');
  }
}

async function placeOrder() {
  const name   = document.getElementById('cust-name').value.trim();
  const phone  = document.getElementById('cust-phone').value.trim();
  const lotBlock    = document.getElementById('cust-lot-block').value.trim();
  const subdivision = document.getElementById('cust-subdivision').value;
  const street      = document.getElementById('cust-street').value.trim();
  const floor       = document.getElementById('cust-floor').value.trim();

  let hasError = false;

  if (!name) { showToast("Please fill in your name."); hasError = true; }

  const phoneErr   = document.getElementById('phone-error');
  const phoneInput = document.getElementById('cust-phone');
  const validPhone = /^09\d{9}$/.test(phone);
  if (!validPhone) {
    if (phoneErr)   phoneErr.style.display = 'block';
    if (phoneInput) phoneInput.style.borderColor = '#dc2626';
    if (!hasError)  showToast("Mobile number must be 11 digits and start with 09.");
    hasError = true;
  } else {
    if (phoneErr)   phoneErr.style.display = 'none';
    if (phoneInput) phoneInput.style.borderColor = '';
  }

  // Address + schedule are only required for delivery
  if (fulfillmentMethod === 'delivery') {
    if (!lotBlock) {
      if (!hasError) showToast("Please enter your Lot, Block, Street, and Phase.");
      hasError = true;
    }
    if (!subdivision) {
      if (!hasError) showToast("Please enter your subdivision or barangay.");
      hasError = true;
    }
    if (!street) {
      if (!hasError) showToast("Please enter your street.");
      hasError = true;
    }
    const schedulesOn = storeSettingsData.schedulesEnabled !== false;
    const hasSlots = scheduleSlotsFromSettings().length > 0;
    if (schedulesOn && hasSlots && !deliverySlot) {
      if (!hasError) showToast("Please select a delivery schedule.");
      hasError = true;
    }
  }

  if (hasError) return;

  const btn = document.getElementById('place-order-btn');
  btn.disabled = true;
  btn.textContent = 'Placing order…';

  const items = Object.entries(cart).map(([key, qty]) => {
    const [idStr, vPart] = key.split('_v');
    const p = PRODUCTS.find(x => x.id == idStr);
    if (!p) return null;
    const variantIdx = vPart !== undefined ? parseInt(vPart) : null;
    const variant = variantIdx !== null && p.variants ? p.variants[variantIdx] : null;
    const price = variant ? parseFloat(variant.price || p.price) : p.price;
    const productName = p.name + (variant ? ` (${variant.name})` : '');
    return { productId: idStr, productName, qty, price, lineTotal: price * qty, variantIdx };
  }).filter(Boolean);

  const isPickup = fulfillmentMethod === 'pickup';
  const subtotalAmt = cartTotal();
  const feeAmt = isPickup ? 0 : deliveryFee();
  const orderData = {
    status: 'pending',
    fulfillmentMethod,
    customer: { name, phone },
    address: isPickup
      ? null
      : { lotBlock, subdivision, street, floor, ...(locPicked ? { lat: locLat, lng: locLon } : {}) },
    payment: payMethod,
    deliverySchedule: isPickup ? null : deliverySlot,
    notes: document.getElementById('cust-notes').value.trim(),
    items,
    subtotal: subtotalAmt,
    deliveryFee: feeAmt,
    total: subtotalAmt + feeAmt,
    ...(payMethod === 'gcash' && gcashReceiptData ? { gcashReceipt: gcashReceiptData, gcashReceiptName: (gcashReceiptName || 'receipt.jpg') } : {}),
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  const orderRef = (payMethod === 'gcash' && gcashOrderRefId)
    ? tcol('orders').doc(gcashOrderRefId)
    : tcol('orders').doc();
  console.log('[checkout] payMethod=', payMethod, 'hasReceipt=', !!orderData.gcashReceipt, 'receiptBytes=', orderData.gcashReceipt ? orderData.gcashReceipt.length : 0);
  console.log('[checkout] locPicked=', locPicked, 'address.lat=', orderData.address?.lat, 'address.lng=', orderData.address?.lng);
  let stockErrorMsg = null;
  console.log('[checkout] Starting order. TENANT_ID=', TENANT_ID, 'orderRef.path=', orderRef.path, 'items=', items.length);

  try {
    await db.runTransaction(async (transaction) => {
      console.log('[checkout] Inside transaction');
      // Group items by productId (one Firestore read per product, not per cart line)
      const productGroups = {};
      items.forEach(item => {
        if (!productGroups[item.productId]) productGroups[item.productId] = [];
        productGroups[item.productId].push(item);
      });
      const productIds = Object.keys(productGroups);
      const productRefs = productIds.map(pid => tcol('products').doc(pid));
      const snaps = await Promise.all(productRefs.map(ref => transaction.get(ref)));

      // Validate stock — reads must all complete before any writes
      for (let i = 0; i < productIds.length; i++) {
        const data = snaps[i].data();
        for (const item of productGroups[productIds[i]]) {
          if (item.variantIdx !== null) {
            // Variant product — check per-variant stock
            const vStock = data.variants?.[item.variantIdx]?.stock ?? null;
            if (vStock !== null) {
              if (vStock === 0) { stockErrorMsg = `"${item.productName}" is sold out.`; throw new Error(stockErrorMsg); }
              if (vStock < item.qty) { stockErrorMsg = `Only ${vStock} of "${item.productName}" left in stock.`; throw new Error(stockErrorMsg); }
            }
          } else {
            // Non-variant product — check product-level stock
            if (!snaps[i].exists || data.available === false || data.stock === 0) {
              stockErrorMsg = `"${item.productName}" is sold out.`; throw new Error(stockErrorMsg);
            }
            if (data.stock !== null && data.stock !== undefined && data.stock < item.qty) {
              stockErrorMsg = `Only ${data.stock} of "${item.productName}" left in stock.`; throw new Error(stockErrorMsg);
            }
          }
        }
      }

      // All checks passed — write order and deduct stock atomically
      transaction.set(orderRef, orderData);
      for (let i = 0; i < productIds.length; i++) {
        const data = snaps[i].data();
        const pid = productIds[i];
        const upd = {};
        const variantItems = productGroups[pid].filter(it => it.variantIdx !== null);
        const plainItems   = productGroups[pid].filter(it => it.variantIdx === null);

        if (variantItems.length > 0) {
          const newVariants = (data.variants || []).map((v, idx) => {
            const item = variantItems.find(it => it.variantIdx === idx);
            if (!item || v.stock === null || v.stock === undefined) return v;
            return { ...v, stock: Math.max(0, v.stock - item.qty) };
          });
          // Skip the write entirely if nothing changed — avoids a no-op
          // update that could trip Firestore rules' diff check.
          const variantsChanged = JSON.stringify(newVariants) !== JSON.stringify(data.variants || []);
          if (variantsChanged) upd.variants = newVariants;
          // Mark unavailable only when every TRACKED variant is depleted.
          // Variants with null/undefined stock are *untracked*, not exhausted.
          const tracked = newVariants.filter(v => v.stock !== null && v.stock !== undefined);
          if (tracked.length > 0 && tracked.every(v => v.stock === 0)) upd.available = false;
        }
        if (plainItems.length > 0 && data.stock !== null && data.stock !== undefined) {
          const totalQty = plainItems.reduce((s, it) => s + it.qty, 0);
          const newStock = Math.max(0, data.stock - totalQty);
          upd.stock = newStock;
          if (newStock === 0) upd.available = false;
        }
        if (Object.keys(upd).length > 0) transaction.update(productRefs[i], upd);
      }
      console.log('[checkout] Transaction body completed, awaiting server commit');
    });
    console.log('[checkout] Server commit OK. Order written to', orderRef.path);

    const shortId = orderRef.id.slice(-6).toUpperCase();
    sendDiscordNotification(orderData, shortId).catch(() => {});
    localStorage.setItem('sariCustomer', JSON.stringify({ name, phone }));
    localStorage.setItem('sariAddress', JSON.stringify({ lotBlock, subdivision, street, floor, noteRider: document.getElementById('cust-notes').value.trim(), ...(locPicked ? { lat: locLat, lng: locLon } : {}) }));
    localStorage.removeItem('sariCart');
    showOrderConfirmation(orderRef.id, payMethod);
  } catch (err) {
    console.error('Order error:', err);
    btn.disabled = false;
    btn.textContent = 'Place Order';
    showToast(stockErrorMsg || 'Failed to place order. Please try again.');
  }
}

function showOrderConfirmation(orderId, payment) {
  const shortId = orderId.slice(-6).toUpperCase();
  // GCash instructions live on the checkout page itself now (shown as soon
  // as the customer picks GCash) — no need to repeat them here.

  document.getElementById('main').innerHTML = `
    <div class="confirm-screen">
      <div class="confirm-icon">✅</div>
      <div class="confirm-title">Order Placed!</div>
      <div class="confirm-order-num">Order #${shortId}</div>
      <a href="${tenantUrl('')}" class="confirm-back">Continue Shopping</a>
    </div>
  `;
}

    const btn = document.getElementById('copy-btn');

let toastTimer;
function showToast(msg) {

// Load products from Firestore, then render
tcol('products').get().then(snapshot => {
  if (!snapshot.empty) {
    PRODUCTS = snapshot.docs.map(doc => doc.data());
    PRODUCTS.sort((a, b) => a.id - b.id);
  } else {
    PRODUCTS = DEFAULT_PRODUCTS;
  }
  Object.keys(cart).forEach(key => { const id = key.split('_v')[0]; if (!PRODUCTS.find(x => x.id == id)) delete cart[key]; });
  init(); updatePaymentOptions(); updateWeatherWarning();
}).catch(() => {
  PRODUCTS = JSON.parse(localStorage.getItem('sariProducts') || '[]');
  if (!PRODUCTS.length) PRODUCTS = DEFAULT_PRODUCTS;
  Object.keys(cart).forEach(key => { const id = key.split('_v')[0]; if (!PRODUCTS.find(x => x.id == id)) delete cart[key]; });
  init(); updatePaymentOptions(); updateWeatherWarning();
});

<!-- Location Picker Modal -->
<div class="loc-overlay" id="loc-overlay">
  <div class="loc-modal">
    <div class="loc-header">
      <div class="loc-header-text">
        <h2>📍 What's your exact location?</h2>
        <p>Providing your location enables more accurate search and delivery ETA, seamless order tracking and personalised recommendations.</p>
      </div>
      <button class="loc-close" onclick="closeLocPicker()">✕</button>
    </div>
    <div class="loc-search">
      <input type="text" id="loc-search-input" placeholder="Enter your address" autocomplete="off" oninput="locSearchInput(this.value)" />
      <button class="loc-search-clear" id="loc-search-clear" onclick="locClearSearch()">✕</button>
      <div class="loc-results" id="loc-results"></div>
    </div>
    <div id="loc-map"></div>
    <div class="loc-footer">
      <button class="loc-submit" onclick="submitLocPicker()">SUBMIT</button>
    </div>
  </div>
</div>

<script>
  let locMap = null, locMarker = null;
  let locLat = 14.3025, locLon = 120.9437;
  let locPicked = false;
  let locSearchTimer = null;

  // Leaflet (~150KB) only loads when the customer actually opens the
  // location picker, instead of on every checkout page load. Most orders
  // ship to a saved address so the picker is rarely opened — this saves
  // an extra script download + parse on the critical path.
  let __leafletLoadingPromise = null;
  function ensureLeaflet() {
    if (window.L) return Promise.resolve();
    if (__leafletLoadingPromise) return __leafletLoadingPromise;
    __leafletLoadingPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      s.async = true;
      s.onload  = () => resolve();
      s.onerror = () => reject(new Error('Failed to load map library'));
      document.head.appendChild(s);
    });
    return __leafletLoadingPromise;
  }

  async function openLocPicker() {
    document.getElementById('loc-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    try {
      await ensureLeaflet();
    } catch (e) {
      showToast('Map library failed to load. Check your connection.');
      closeLocPicker();
      return;
    }
    setTimeout(() => {
      if (!locMap) initLocMap();
      else locMap.invalidateSize();
    }, 60);
  }

  function closeLocPicker() {
    document.getElementById('loc-overlay').classList.remove('open');
    document.body.style.overflow = '';
    document.getElementById('loc-results').style.display = 'none';
  }

  function initLocMap() {
    locMap = L.map('loc-map', { zoomControl: true }).setView([locLat, locLon], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(locMap);

    locMarker = L.marker([locLat, locLon], { draggable: true }).addTo(locMap);

    locMarker.on('dragend', () => {
      const p = locMarker.getLatLng();
      locLat = p.lat; locLon = p.lng;
      locReverseGeocode(locLat, locLon);
    });

    locMap.on('click', e => {
      locLat = e.latlng.lat; locLon = e.latlng.lng;
      locMarker.setLatLng([locLat, locLon]);
      locReverseGeocode(locLat, locLon);
    });
  }

  function locReverseGeocode(lat, lon) {
    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`)
      .then(r => r.json())
      .then(d => {
        if (d.display_name) document.getElementById('loc-search-input').value = d.display_name;
      }).catch(() => {});
  }

  function locSearchInput(q) {
    document.getElementById('loc-search-clear').style.display = q ? 'block' : 'none';
    clearTimeout(locSearchTimer);
    if (!q.trim()) { document.getElementById('loc-results').style.display = 'none'; return; }
    locSearchTimer = setTimeout(() => {
      fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&countrycodes=ph`)
        .then(r => r.json())
        .then(results => {
          const box = document.getElementById('loc-results');
          if (!results.length) { box.style.display = 'none'; return; }
          box.style.display = 'block';
          box.innerHTML = results.map(r =>
            `<div class="loc-result" onclick="locPickResult(${r.lat},${r.lon},this.dataset.name)" data-name="${r.display_name.replace(/"/g,'&quot;')}">${r.display_name}</div>`
          ).join('');
        }).catch(() => {});
    }, 400);
  }

  function locPickResult(lat, lon, name) {
    locLat = parseFloat(lat); locLon = parseFloat(lon);
    locMarker.setLatLng([locLat, locLon]);
    locMap.setView([locLat, locLon], 17);
    document.getElementById('loc-search-input').value = name;
    document.getElementById('loc-results').style.display = 'none';
  }

  function locClearSearch() {
    document.getElementById('loc-search-input').value = '';
    document.getElementById('loc-search-clear').style.display = 'none';
    document.getElementById('loc-results').style.display = 'none';
  }

  function submitLocPicker() {
    const iframe = document.getElementById('map-iframe');
    if (iframe) iframe.src = `https://maps.google.com/maps?q=${locLat},${locLon}&z=17&output=embed`;
    locPicked = true;
    if (typeof updateLocStatus === 'function') updateLocStatus();
    closeLocPicker();
  }
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
