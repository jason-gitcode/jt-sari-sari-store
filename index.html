<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JS Mini Mart</title>
<script>if(location.pathname==='/index.html')location.replace('/');</script>
<link rel="manifest" href="/jt-sari-sari-store/manifest.json" />
<meta name="theme-color" content="#2563eb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="JS Mini Mart" />
<link rel="apple-touch-icon" href="newlogo.jpeg" />
<style>
  /* ---------- BASE ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --ok: #16a34a;
    --warn: #f59e0b;
    --soft: #f9fafb;
    --radius: 10px;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font: inherit; color: inherit; }

  /* ---------- HEADER ---------- */
  header {
    flex-shrink: 0;
    background: #fff;
    border-bottom: 1px solid var(--line);
    position: relative;
    overflow: hidden;
    transition: background .6s, border-color .6s;
  }
  header.rain-mode { background: linear-gradient(180deg, #bfdbfe 0%, #93c5fd 100%); border-bottom-color: #60a5fa; }
  .rain-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .rain-drop {
    position: absolute; top: -20px;
    width: 1.5px; border-radius: 0 0 2px 2px;
    background: linear-gradient(to bottom, transparent, rgba(96,165,250,0.7));
    animation: rain-fall linear infinite;
  }
  @keyframes rain-fall {
    0%   { transform: translateY(0);    opacity: 0.9; }
    100% { transform: translateY(90px); opacity: 0.1; }
  }
  .info-bar.rain-mode { background: #eff6ff; border-bottom-color: #bfdbfe; }
  .rain-ticker-item { color: #1e40af; }
  .rain-ticker-item strong { color: #1e40af; }
  .closed-ticker-item { color: #9f1239; }
  .closed-ticker-item strong { color: #9f1239; }
  .rain-cloud {
    position: absolute;
    background: rgba(255,255,255,0.55);
    border-radius: 50px;
    pointer-events: none;
    animation: cloud-drift ease-in-out infinite;
  }
  .rain-cloud::before, .rain-cloud::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
  }
  .rain-cloud::before { width: 55%; height: 170%; top: -60%; left: 18%; }
  .rain-cloud::after  { width: 40%; height: 130%; top: -45%; left: 50%; }
  @keyframes cloud-drift {
    0%,100% { transform: translateX(0); }
    50%     { transform: translateX(6px); }
  }
  .nav {
    max-width: 1100px; margin: 0 auto;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    position: relative; z-index: 1;
  }
  .brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .brand .logo {
    height: 54px; width: auto; flex-shrink: 0;
  }
  .brand .logo img { height: 100%; width: auto; object-fit: contain; }
  .brand h1 { font-size: 17px; font-weight: 600; line-height: 1.2; }
  .brand small { color: var(--muted); font-size: 12px; }
  .search {
    flex: 1; position: relative;
    display: flex; align-items: center; gap: 8px;
    background: var(--soft); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 12px;
  }
  .search input {
    flex: 1; border: none; background: transparent; outline: none; font-size: 16px;
    padding-right: 28px;
  }
  #search-clear {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 18px; color: var(--muted); line-height: 1; padding: 0;
  }
  .cart-btn {
    position: relative;
    padding: 8px 14px;
    background: transparent; color: var(--ink);
    border-radius: var(--radius);
    font-weight: 500; font-size: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .cart-btn .badge {
    background: var(--accent); color: #fff;
    border-radius: 999px; padding: 1px 7px;
    font-size: 12px; font-weight: 600;
  }

  /* ---------- INFO BAR / TICKER ---------- */
  .info-bar {
    flex-shrink: 0;
    background: var(--soft);
    border-bottom: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
    overflow: hidden;
    padding: 8px 0;
  }
  .ticker-track {
    display: inline-flex;
    white-space: nowrap;
    animation: ticker 22s linear infinite;
  }
  .ticker-track:hover { animation-play-state: paused; }
  .ticker-item {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0 48px;
  }
  .ticker-item strong { color: var(--ink); font-weight: 600; }
  .ticker-sep { color: var(--line); font-size: 16px; user-select: none; }
  @keyframes ticker {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ---------- CATEGORIES ---------- */
  .container {
    flex: 1; min-height: 0;
    max-width: 1100px; margin: 0 auto; padding: 0 16px;
    display: flex; gap: 20px; overflow: hidden;
    width: 100%;
  }
  .categories {
    display: flex; flex-direction: column; gap: 8px;
    width: 180px; flex-shrink: 0;
    padding: 16px 0;
    overflow-y: auto;
  }
  .products-col {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 16px 0;
  }
  .chip {
    padding: 10px 14px; border-radius: 8px;
    background: var(--soft); border: 1px solid var(--line);
    font-size: 13px; text-align: left;
    transition: all .15s; cursor: pointer;
  }
  .chip.active {
    background: var(--ink); color: #fff; border-color: var(--ink);
  }
  .chip:hover { border-color: var(--ink); background: var(--soft); }
  .chip.active:hover { background: var(--ink); }

  /* ---------- PRODUCT GRID ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 160px));
    justify-content: start;
    gap: 14px;
    flex: 1;
    align-items: stretch;
  }
  .card {
    width: 100%;
    max-width: 160px;
    min-height: 220px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.06); }
  .thumb {
    aspect-ratio: 1 / 1;
    background: var(--soft);
    display: grid; place-items: center;
    font-size: 34px;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
    position: relative;
  }
  .card-body { padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card-name {
    font-size: 14px; font-weight: 500; line-height: 1.3;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .card-unit { font-size: 12px; color: var(--muted); }
  .card-bottom {
    margin-top: auto; padding-top: 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .price { font-size: 15px; font-weight: 700; }
  .add-btn {
    background: var(--accent); color: #fff;
    width: 30px; height: 30px; border-radius: 8px;
    font-size: 18px; line-height: 1;
    display: grid; place-items: center;
    transition: background .15s;
  }
  .add-btn:hover { background: var(--accent-dark); }
  .add-btn.in-cart { background: var(--ok); font-size: 14px; font-weight: 700; }
  .add-btn.in-cart:hover { background: #15803d; }
  .add-btn.in-cart:disabled { background: var(--ok); opacity: 0.5; cursor: not-allowed; }
  .empty {
    text-align: center; color: var(--muted);
    padding: 40px 16px; grid-column: 1 / -1;
  }

  /* ---------- CART DRAWER ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 100%; max-width: 380px;
    background: #fff;
    z-index: 101;
    transform: translateX(100%);
    transition: transform .25s ease-out;
    display: flex; flex-direction: column;
    box-shadow: -8px 0 24px rgba(0,0,0,.1);
  }
  .drawer.show { transform: translateX(0); }
  .drawer-head {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .drawer-head h2 { font-size: 16px; font-weight: 600; }
  .close-btn {
    width: 30px; height: 30px;
    border-radius: 6px; font-size: 22px;
    display: grid; place-items: center;
  }
  .close-btn:hover { background: var(--soft); }
  .cart-items { flex: 1; overflow-y: auto; padding: 8px; }
  .cart-empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .cart-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px;
    border-bottom: 1px solid var(--line);
  }
  .cart-thumb {
    width: 50px; height: 50px; border-radius: 8px;
    background: var(--soft);
    display: grid; place-items: center; font-size: 26px;
    flex-shrink: 0;
  }
  .cart-info { flex: 1; min-width: 0; }
  .cart-info .name-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cart-info .name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .cart-info .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .qty {
    display: flex; align-items: center; gap: 6px;
    margin-top: 6px;
  }
  .cart-actions {
    display: flex; flex-direction: column; align-items: flex-end;
    justify-content: space-between;
    min-width: 72px;
  }
  .qty button {
    width: 24px; height: 24px; border-radius: 6px;
    border: 1px solid var(--line);
    font-size: 14px;
  }
  .qty button:hover { background: var(--soft); }
  .qty span { font-size: 13px; min-width: 20px; text-align: center; }
  .cart-line-total { font-weight: 600; font-size: 14px; align-self: center; }
  .remove-x {
    color: var(--muted); font-size: 16px; align-self: flex-start;
    padding: 2px 6px;
  }
  .remove-x:hover { color: #dc2626; }

  .drawer-foot { border-top: 1px solid var(--line); padding: 10px 12px; background: #fff; display: grid; gap: 4px; }
  .totals { display: flex; justify-content: space-between; margin-bottom: 2px; font-size: 13px; }
  .totals.grand { font-size: 14px; font-weight: 700; margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--line); }
  .checkout-btn {
    width: 100%; padding: 9px;
    background: var(--accent); color: #fff;
    border-radius: var(--radius);
    font-weight: 600; font-size: 14px;
    transition: background .15s;
  }
  .checkout-btn:hover { background: var(--accent-dark); }
  .checkout-btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

  /* ---------- MODAL ---------- */
  .modal {
    position: fixed; inset: 0;
    z-index: 200;
    display: none;
    align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(0,0,0,.4);
  }
  .modal.show { display: flex; }
  .modal-box {
    background: #fff; border-radius: var(--radius);
    width: 100%; max-width: 460px;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-head {
    padding: 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-head h2 { flex: 1; min-width: 0; word-break: break-word; line-height: 1.3; font-size: clamp(13px, 3.5vw, 17px); }
  .modal-body { padding: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; outline: none;
    background: #fff;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 60px; }
  .pay-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pay-opt {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; font-size: 14px; text-align: center;
    transition: all .15s;
  }
  .pay-opt.active { border-color: var(--accent); background: #eff6ff; color: var(--accent-dark); font-weight: 600; }
  .pay-info {
    margin-top: 10px; padding: 10px;
    background: var(--soft); border-radius: 8px;
    font-size: 13px; color: var(--muted);
    display: none;
  }
  .pay-info.show { display: block; }
  .pay-info strong { color: var(--ink); }
  .modal-foot {
    padding: 12px 16px; border-top: 1px solid var(--line);
    display: flex; gap: 8px;
  }
  .btn-secondary {
    flex: 1; padding: 7px; border-radius: 8px;
    border: 1px solid var(--line); font-size: 13px;
    background: #fff;
  }
  .btn-secondary:hover { background: var(--soft); }
  .btn-primary {
    flex: 1; padding: 10px; border-radius: 8px;
    background: var(--accent); color: #fff;
    font-size: 14px; font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent-dark); }

  /* ---------- TOAST ---------- */
  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 999px;
    font-size: 14px; opacity: 0;
    transition: opacity .2s, transform .2s;
    z-index: 300; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- FOOTER ---------- */
  footer {
    margin-top: 32px;
    border-top: 1px solid var(--line);
    background: #fafafa;
  }
  .footer-inner {
    padding: 18px 16px 14px;
    display: flex; flex-wrap: wrap; gap: 16px;
    justify-content: space-between;
  }
  .footer-section {
    flex: 1; min-width: 130px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .footer-section h4 {
    margin: 0 0 4px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.07em; text-transform: uppercase;
    color: #555;
  }
  .footer-section p, .footer-section a {
    margin: 0; font-size: 13px; line-height: 1.6;
    color: var(--muted); text-decoration: none;
  }
  .footer-section a:hover { color: var(--primary); }
  .footer-bottom {
    text-align: center; padding: 10px 16px;
    border-top: 1px solid var(--line);
    font-size: 12px; color: #bbb;
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 600px) {
    .info-bar { font-size: 11px; padding: 5px 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    .ticker-item, .ticker-item strong,
    .rain-ticker-item, .rain-ticker-item strong,
    .ticker-sep { font-size: 11px !important; font-weight: 500; }
    .nav { flex-wrap: nowrap; align-items: center; padding: 10px 12px; gap: 10px; }
    .brand { width: auto; flex-shrink: 0; }
    .brand h1, .brand small { display: none; }
    .brand .logo { height: 44px; width: auto; }
    .search { flex: 1; min-width: 0; border-radius: 999px; padding: 8px 14px; }
    .cart-btn {
      margin-top: 0; flex-shrink: 0;
      width: 44px; height: 44px; padding: 0;
      border-radius: 50%; background: transparent; color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; position: relative;
    }
    .cart-btn .badge {
      position: absolute; top: 1px; right: 1px;
      min-width: 18px; height: 18px; padding: 0 4px;
      font-size: 11px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .cart-btn span.label { display: none; }
    .container { flex-direction: column; overflow-y: auto; }
    .categories {
      width: 100%; flex-direction: row; overflow-x: auto; overflow-y: hidden;
      gap: 8px; flex-wrap: nowrap; padding: 8px 0;
      flex-shrink: 0;
      position: sticky; top: 0; z-index: 10;
      background: #fff; border-bottom: 1px solid var(--line);
    }
    .products-col { flex: unset; min-height: unset; overflow-y: unset; padding: 0; }
    .chip { white-space: nowrap; }
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      justify-content: start;
    }
    .card { max-width: 100%; min-height: 0; }
    .thumb { font-size: 40px; }
    .card-body { padding: 10px; }
    .info-inner { font-size: 12px; gap: 10px; flex-direction: column; align-items: flex-start; }
    .footer-inner { flex-direction: column; gap: 14px; align-items: flex-start; padding: 16px 16px 12px; }
    .footer-section { min-width: unset; }
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
  <div class="nav">
    <div class="brand">
      <div class="logo"><img src="newlogo.jpeg" alt="JS Mini Mart" /></div>
      <div>
        <h1 id="store-name">JS Mini Mart</h1>
        <small id="store-tag" style="display:none;"></small>
      </div>
    </div>
    <div class="search">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="Search products..." />
      <button id="search-clear" onclick="clearSearch()" style="display:none;">×</button>
    </div>
    <button class="cart-btn" onclick="openCart()">
      🛒 <span class="label">Cart</span>
      <span class="badge" id="cart-count" style="display:none;">0</span>
    </button>
  </div>
</header>

<div class="info-bar" id="info-bar">
  <div class="ticker-track" id="ticker-track"></div>
</div>

<div class="container">
  <div class="categories" id="categories"></div>
  <div class="products-col">
    <div class="grid" id="products"></div>
    <footer>
      <div class="footer-inner">
        <div class="footer-section">
          <h4>🕐 Store Hours</h4>
          <p>Monday – Sunday</p>
          <p>6:00 AM – 5:00 PM</p>
        </div>
        <div class="footer-section">
          <h4>🛵 Delivery Times</h4>
          <p>9:00 AM · 1:00 PM · 5:00 PM</p>
        </div>
        <div class="footer-section">
          <h4>🌐 Website</h4>
          <a href="https://jsminimart.com">jsminimart.com</a>
        </div>
        <div class="footer-section">
          <h4>📞 Contact Us</h4>
          <a href="tel:+639184067841">0918-406-7841</a>
        </div>
      </div>
      <div class="footer-bottom">© 2025 JS Mini Mart · Maraming salamat po! 🙏</div>
    </footer>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>Your Cart</h2>
    <button class="close-btn" onclick="closeCart()">×</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="drawer-foot">
    <div class="totals grand"><span>Total</span><span id="grand-total">₱0.00</span></div>
    <button class="btn-secondary" id="remove-all-btn" onclick="removeAll()">Remove All</button>
    <button class="checkout-btn" id="checkout-btn" onclick="window.location.href='/checkout/'" disabled>Checkout</button>
  </div>
</aside>

<!-- PRODUCT DETAIL MODAL -->
<div class="modal" id="product-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modal-product-name"></h2>
      <button class="close-btn" onclick="closeProductModal()">×</button>
    </div>
    <div class="modal-body">
      <!-- Photo gallery (shown when product has images) -->
      <div id="modal-gallery" style="display:none; margin-bottom:16px;">
        <div id="modal-slides" style="border-radius:8px; overflow:hidden; background:var(--soft); touch-action:pan-y; user-select:none;"></div>
        <div id="modal-dots" style="text-align:center; margin-top:8px;"></div>
      </div>
      <!-- Placeholder shown when no images -->
      <div style="display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:8px;margin-bottom:16px;height:160px;" id="modal-product-emoji">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.2" width="64" height="64"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </div>
      <div id="modal-product-description" style="margin-bottom: 16px; font-size: 14px; line-height: 1.5;"></div>
      <div style="background: var(--soft); padding: 12px; border-radius: 8px; margin-bottom: 16px;">
        <div style="font-size: 13px; color: var(--muted); margin-bottom: 4px;">Price</div>
        <div style="font-size: 18px; font-weight: 700;" id="modal-product-price"></div>
        <div style="font-size: 13px; color: var(--muted); margin-top: 4px;" id="modal-product-unit"></div>
      </div>
      <div id="modal-variants" style="display: none; margin-bottom: 16px;">

<script>
/* ============================================================

const STORE = {

/* ============================================================

   ============================================================
   Each product has: id, name, category, price, unit, emoji
   - id: unique number
   - category: must match one of the CATEGORIES below

const CATEGORIES = [
  "All",
  "Rice & Grains",
  "Canned Goods",
  "Noodles",
  "Snacks",
  "Beverages",
  "Cooking Essentials",
  "School Supplies",

  "Personal Care"
];

const DEFAULT_PRODUCTS = [];

// Firebase — products sync across devices via Firestore
const firebaseConfig = {
  apiKey: "AIzaSyDM0oTTumombQiZy1xFMBwro8X1oqzNDAs",
  authDomain: "jt-sari-sari-store.firebaseapp.com",
  projectId: "jt-sari-sari-store",
  storageBucket: "jt-sari-sari-store.firebasestorage.app",
  messagingSenderId: "625852109606",
  appId: "1:625852109606:web:7474c10133701eafbce7e7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let PRODUCTS = [];

// ---------- RAIN MODE / STORE CLOSED ----------
const TICKER_BASE = [
  { icon: '📍', text: 'Delivering to: ' + STORE.deliveryAreas.join(' · ') },
  { icon: '🕐', text: 'Open 6am–5pm daily' },
  { icon: '🛵', text: 'Free delivery on orders min. Php200' },
  { icon: '🕒', text: 'Delivery times: 9am · 1pm · 5pm' },
];
const RAIN_TICKER = {
  icon: '🌧️',
  text: 'Weather Advisory: Deliveries may experience delays due to inclement weather conditions. We appreciate your patience and understanding.',
  rain: true
};
const CLOSED_TICKER = {
  icon: '🔒',
  text: 'Store Closed: Our store is currently closed. Operating hours are 6:00 AM – 5:00 PM daily. Thank you for your patience.',
  closed: true
};

let storeClosedMode = false;

function buildTicker(rainMode, storeClosed) {
  const items = [...TICKER_BASE];
  if (rainMode) items.push(RAIN_TICKER);
  if (storeClosed) items.push(CLOSED_TICKER);
  const oneSet = items.map(it => {
    const cls = it.rain ? ' rain-ticker-item' : it.closed ? ' closed-ticker-item' : '';
    return `<span class="ticker-item${cls}">${it.icon} <strong>${it.text}</strong></span>` +
           `<span class="ticker-sep">|</span>`;
  }).join('');
  const track = document.getElementById('ticker-track');
  if (track) {
    track.innerHTML = oneSet + oneSet;
    track.style.animationDuration = (items.length * 7.5) + 's';
  }
}

function applyRainMode(active) {
  const header   = document.querySelector('header');
  const infoBar  = document.getElementById('info-bar');
  if (!header) return;

  if (active) {
    header.classList.add('rain-mode');
    if (infoBar) infoBar.classList.add('rain-mode');
    if (!header.querySelector('.rain-container')) {
      const container = document.createElement('div');
      container.className = 'rain-container';

      // Clouds
      [
        { left: '4%',  top: '6px',  w: 70,  h: 22, dur: '7s',  delay: '0s'   },
        { left: '30%', top: '4px',  w: 90,  h: 28, dur: '9s',  delay: '2.5s' },
        { left: '62%', top: '8px',  w: 60,  h: 19, dur: '6s',  delay: '1s'   },
        { left: '84%', top: '5px',  w: 80,  h: 24, dur: '8s',  delay: '4s'   },
      ].forEach(c => {
        const cloud = document.createElement('div');
        cloud.className = 'rain-cloud';
        cloud.style.left              = c.left;
        cloud.style.top               = c.top;
        cloud.style.width             = c.w + 'px';
        cloud.style.height            = c.h + 'px';
        cloud.style.animationDuration = c.dur;
        cloud.style.animationDelay    = c.delay;
        container.appendChild(cloud);
      });

      // Rain drops
      for (let i = 0; i < 35; i++) {
        const drop = document.createElement('div');
        drop.className = 'rain-drop';
        drop.style.left               = (Math.random() * 100) + '%';
        drop.style.height             = (8 + Math.random() * 10) + 'px';
        drop.style.animationDuration  = (0.4 + Math.random() * 0.7) + 's';
        drop.style.animationDelay     = (-Math.random() * 2) + 's';
        container.appendChild(drop);
      }
      header.appendChild(container);
    }
  } else {
    header.classList.remove('rain-mode');
    if (infoBar) infoBar.classList.remove('rain-mode');
    const c = header.querySelector('.rain-container');
    if (c) c.remove();
  }
  buildTicker(active, storeClosedMode);
}

db.collection('settings').doc('store').onSnapshot(snap => {
  const data     = snap.exists ? snap.data() : {};
  const rainMode = data.rainMode === true;
  storeClosedMode = data.storeClosed === true;
  applyRainMode(rainMode);
  buildTicker(rainMode, storeClosedMode);
});

/* ============================================================
   🚫  Below this line is the app logic — no need to edit
   unless you want to change how the store works.
============================================================ */

// ---------- GALLERY ----------
let galleryImages = [];
let galleryIndex  = 0;

function renderGallerySlide() {
  document.getElementById('modal-slides').innerHTML =
    `<img src="${galleryImages[galleryIndex]}" alt="Product photo" style="width:100%;height:220px;object-fit:contain;display:block;" />`;
  document.getElementById('modal-dots').innerHTML = galleryImages.length > 1
    ? galleryImages.map((_, i) =>
        `<span onclick="goToGallerySlide(${i})" style="display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px;cursor:pointer;background:${i === galleryIndex ? 'var(--accent)' : 'var(--line)'}"></span>`
      ).join('')
    : '';
}
function nextGallerySlide() { galleryIndex = (galleryIndex + 1) % galleryImages.length; renderGallerySlide(); }
function prevGallerySlide() { galleryIndex = (galleryIndex - 1 + galleryImages.length) % galleryImages.length; renderGallerySlide(); }
function goToGallerySlide(i) { galleryIndex = i; renderGallerySlide(); }

// ---------- STATE ----------
let cart = JSON.parse(localStorage.getItem('sariCart') || '{}');
let activeCategory = "All";
let searchTerm = "";

// ---------- INIT ----------
function init() {

  // Apply store config to header
  document.getElementById('store-name').textContent = STORE.name;
  document.getElementById('store-tag').textContent = STORE.tagline;
  document.title = STORE.name;

  renderCategories();
  renderCart();
  document.getElementById('products').innerHTML = '<div class="empty">Loading products…</div>';

  document.getElementById('search-input').addEventListener('input', (e) => {
    searchTerm = e.target.value.toLowerCase();
    document.getElementById('search-clear').style.display = searchTerm ? 'inline' : 'none';
    renderProducts();
  });

  // ESC closes modals
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeCart(); closeProductModal(); }
  });
}

// ---------- PRODUCT DETAIL ----------
function showProductDetail(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;

  document.getElementById('modal-product-id').value = id;
  document.getElementById('modal-product-name').textContent = p.name;

  // Gallery vs emoji
  const gallery   = document.getElementById('modal-gallery');
  const emojiDiv  = document.getElementById('modal-product-emoji');
  galleryImages   = (p.images && p.images.length > 0) ? p.images : [];
  galleryIndex    = 0;
  if (galleryImages.length > 0) {
    gallery.style.display  = 'block';
    emojiDiv.style.display = 'none';
    renderGallerySlide();
    const slidesEl = document.getElementById('modal-slides');
    let touchStartX = 0;
    slidesEl.ontouchstart = e => { touchStartX = e.touches[0].clientX; };
    slidesEl.ontouchend   = e => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) diff > 0 ? nextGallerySlide() : prevGallerySlide();
    };
  } else {
    gallery.style.display  = 'none';
    emojiDiv.style.display = 'flex';
  }
  const priceEl = document.getElementById('modal-product-price');
  document.getElementById('modal-product-unit').textContent = p.unit;
  document.getElementById('modal-product-description').textContent = p.description || '';

  // Handle variants
  const variantDiv = document.getElementById('modal-variants');
  const variantSelect = document.getElementById('variant-select');
  if (p.variants && p.variants.length > 0) {
    const minPrice = Math.min(...p.variants.map(v => parseFloat(v.price || p.price)));
    priceEl.textContent = STORE.currency + minPrice.toFixed(2);
    variantDiv.style.display = 'block';
    variantSelect.innerHTML = '<option value="">Select one</option>' + p.variants.map((v, i) => {
      const vStock = v.stock ?? null;
      const inCart = cart[`${p.id}_v${i}`] || 0;
      const oos    = vStock !== null && vStock === 0;
      const atMax  = vStock !== null && inCart >= vStock && vStock > 0;
      const disabled = oos || atMax;
      const suffix = oos ? ' — Out of Stock' : atMax ? ` — Max (${vStock})` : '';
      return `<option value="${i}" ${disabled ? 'disabled' : ''}>${v.name}${suffix}</option>`;
    }).join('');
    variantSelect.onchange = () => {
      const idx = variantSelect.value;
      if (idx !== '') {
        priceEl.textContent = STORE.currency + parseFloat(p.variants[idx].price || p.price).toFixed(2);
      } else {
        priceEl.textContent = STORE.currency + minPrice.toFixed(2);
      }
    };
  } else {
    priceEl.textContent = STORE.currency + p.price.toFixed(2);
    variantDiv.style.display = 'none';
    variantSelect.innerHTML = '<option value="">Select one</option>';
    variantSelect.onchange = null;
  }

  // Disable Add to Cart if out of stock
  const addBtn = document.querySelector('#product-modal .btn-primary');
  if (p.available === false) {
    addBtn.disabled = true;
    addBtn.textContent = 'Out of Stock';
    addBtn.style.cssText = 'background:var(--line);color:var(--muted);cursor:not-allowed;';
  } else {
    addBtn.disabled = false;
    addBtn.textContent = 'Add to Cart';
    addBtn.style.cssText = '';
  }

  document.getElementById('product-modal').classList.add('show');
}

function closeProductModal() {
  document.getElementById('product-modal').classList.remove('show');
}

function addFromModal() {
  const id = parseInt(document.getElementById('modal-product-id').value);
  const p = PRODUCTS.find(x => x.id == id);
  if (!p) return;
  let key;
  if (p.variants && p.variants.length > 0) {
    const sel = document.getElementById('variant-select');
    if (!sel.value) { showToast('Please select a size first'); return; }
    const vIdx = parseInt(sel.value);
    key = `${id}_v${vIdx}`;
    const vStock = p.variants[vIdx]?.stock ?? null;
    if (vStock !== null && (cart[key] || 0) >= vStock) {
      showToast(`Only ${vStock} in stock`); return;
    }
  } else {
    key = String(id);
    if (p.stock !== null && p.stock !== undefined) {
      if (productCartQty(id) >= p.stock) { showToast(`Only ${p.stock} in stock`); return; }
    }
  }
  cart[key] = (cart[key] || 0) + 1;
  saveCart(); renderCart(); renderProducts();
  closeProductModal();
  showToast("Added to cart");
}

// ---------- SEARCH CLEAR ----------
function clearSearch() {
  document.getElementById('search-input').value = '';
  searchTerm = '';
  document.getElementById('search-clear').style.display = 'none';
  renderProducts();
}

// ---------- CATEGORIES ----------
function renderCategories() {
  const wrap = document.getElementById('categories');
  // Mirror admin exactly: categories derived from products in product-id order
  const catSet = new Set();
  PRODUCTS.forEach(p => { if (p.category) catSet.add(p.category); });
  const cats = ['All', ...[...catSet].sort()];
  if (activeCategory !== 'All' && !cats.includes(activeCategory)) activeCategory = 'All';
  wrap.innerHTML = cats.map(cat =>
    `<button class="chip ${cat === activeCategory ? 'active' : ''}" onclick="pickCategory('${cat.replace(/'/g, "\\'")}')">${cat}</button>`
  ).join('');
}
function pickCategory(cat) {
  activeCategory = cat;
  renderCategories();
  renderProducts();
}

// ---------- PRODUCTS ----------
function renderProducts() {
  const grid = document.getElementById('products');
  let list = PRODUCTS.filter(p => activeCategory === "All" || p.category === activeCategory);
  if (searchTerm) {
    list = list.filter(p => {
      const text = `${p.name} ${p.description || ''}`.toLowerCase();
      return text.includes(searchTerm);
    });
  }
  const isOos = p => {
    if (p.available === false) return true;
    if (p.variants && p.variants.length > 0) return p.variants.every(v => (v.stock ?? 0) === 0);
    return p.stock === 0;
  };
  list = [...list.filter(p => !isOos(p)), ...list.filter(p => isOos(p))];
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty">No products found.</div>`;
    return;
  }
  grid.innerHTML = list.map(p => {
    const ok = p.available !== false && !isOos(p);
    const cartQty = productCartQty(p.id);
    const displayStock = (() => {
      if (p.variants && p.variants.length > 0) {
        return p.variants.reduce((sum, v) => sum + (v.stock ?? 0), 0);
      }
      return p.stock;
    })();
    const atMax = ok && displayStock !== null && displayStock !== undefined && displayStock > 0 && cartQty >= displayStock;
    const btnDisabled = !ok || atMax;
    return `
    <div class="card" onclick="showProductDetail(${p.id})">
      <div class="thumb">
        ${p.images && p.images.length > 0 ? `<img src="${p.images[0]}" alt="${p.name}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">` : p.image ? `<img src="${p.image}" alt="${p.name}" style="width:80%;height:80%;object-fit:contain;">` : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.2" width="44" height="44"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`}
        ${!ok ? `<div style="position:absolute;top:6px;left:6px;background:#dc2626;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;line-height:1.5;z-index:1;">OUT OF STOCK</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-unit">${p.unit}</div>
        ${p.description ? `<div style="font-size:12px;color:var(--muted);margin:4px 0;">${p.description.substring(0, 50)}${p.description.length > 50 ? '...' : ''}</div>` : ''}
        ${(displayStock === 0) ? `<div style="font-size:12px;color:#dc2626;">Out of Stock</div>` : ''}
        <div class="card-bottom">
          <div class="price">${(() => { if (p.variants && p.variants.length > 0) { const vp = p.variants.map(v => parseFloat(v.price || p.price)); const mn = Math.min(...vp), mx = Math.max(...vp); return mn === mx ? STORE.currency + mn.toFixed(2) : STORE.currency + mn.toFixed(2) + ' – ' + STORE.currency + mx.toFixed(2); } return STORE.currency + p.price.toFixed(2); })()}</div>
          <button class="add-btn${ok && cartQty > 0 ? ' in-cart' : ''}" onclick="${!btnDisabled ? `addToCart(${p.id}); event.stopPropagation()` : 'event.stopPropagation()'}" ${btnDisabled ? 'disabled' : ''} title="${!ok ? 'Out of stock' : atMax ? 'Maximum stock reached' : 'Add to cart'}" style="${!ok ? 'background:var(--line);cursor:not-allowed;' : ''}">${ok && cartQty > 0 ? cartQty : '+'}</button>
        </div>
      </div>
    </div>
  `;}).join('');
}

// ---------- CART ----------
function saveCart() { localStorage.setItem('sariCart', JSON.stringify(cart)); }

function productCartQty(pid) {
  return Object.entries(cart)
    .filter(([k]) => k === String(pid) || k.startsWith(`${pid}_v`))
    .reduce((s, [,q]) => s + q, 0);
}
function openSizePicker(id) {
  const p = PRODUCTS.find(x => x.id == id);
  if (!p) return;
  document.getElementById('size-picker-name').textContent = p.name;
  const allQty = productCartQty(id);
  document.getElementById('size-picker-options').innerHTML = p.variants.map((v, i) => {
    const vStock = v.stock ?? null;
    const vCartQty = cart[`${id}_v${i}`] || 0;
    const oos = vStock !== null && vStock === 0;
    const atMax = !oos && vStock !== null && vCartQty >= vStock;
    const disabled = oos || atMax;
    const statusLabel = oos ? ' · Out of stock' : atMax ? ` · Max ${vStock}` : '';
    const statusColor = oos ? '#dc2626' : '#d97706';
    return `<button onclick="addWithVariant(${id},${i})" ${disabled ? 'disabled' : ''}
      style="padding:9px 12px;border:1.5px solid ${disabled ? 'var(--line)' : 'var(--line)'};border-radius:10px;
      font-size:13px;cursor:${disabled ? 'not-allowed' : 'pointer'};background:#fff;
      text-align:left;${disabled ? 'opacity:0.4;filter:grayscale(1);' : ''}transition:border-color .1s,transform .1s;"
      ${disabled ? '' : 'onmousedown="this.style.transform=\'scale(0.96)\';this.style.borderColor=\'var(--accent)\'" onmouseup="this.style.transform=\'scale(1)\'" onmouseleave="this.style.transform=\'scale(1)\';this.style.borderColor=\'var(--line)\'"'}>
      <span style="display:block;font-weight:600;font-size:13px;color:var(--ink);">${v.name}</span>
      <span style="display:block;font-size:12px;font-weight:700;color:var(--accent);margin-top:2px;">${STORE.currency}${parseFloat(v.price || p.price).toFixed(2)}${disabled ? `<span style="color:${statusColor};font-weight:500;">${statusLabel}</span>` : ''}</span>
    </button>`;
  }).join('');
  const el = document.getElementById('size-picker');
  el.style.opacity = '1'; el.style.pointerEvents = 'all';
}
function closeSizePicker() {
  const el = document.getElementById('size-picker');
  el.style.opacity = '0'; el.style.pointerEvents = 'none';
}
function addWithVariant(id, variantIdx) {
  const p = PRODUCTS.find(x => x.id == id);
  if (!p) return;
  const variant = p.variants[variantIdx];
  const vStock = variant?.stock ?? null;
  const key = `${id}_v${variantIdx}`;
  if (vStock !== null && (cart[key] || 0) >= vStock) { showToast(`Only ${vStock} in stock`); return; }
  cart[key] = (cart[key] || 0) + 1;
  saveCart(); renderCart(); renderProducts();
  closeSizePicker();
  showToast('Added to cart');
}
function addToCart(id) {
  const p = PRODUCTS.find(x => x.id == id);
  if (!p) return;
  if (p.variants && p.variants.length > 0) { openSizePicker(id); return; }
  if (p.stock !== null && p.stock !== undefined) {
    if (productCartQty(id) >= p.stock) { showToast(`Only ${p.stock} in stock`); return; }
  }
  cart[String(id)] = (cart[String(id)] || 0) + 1;
  saveCart(); renderCart(); renderProducts();
  showToast("Added to cart");
}
function changeQty(key, delta) {
  const [idStr, vPart] = key.split('_v');
  const p = PRODUCTS.find(x => x.id == idStr);
  if (delta > 0 && p) {
    if (vPart !== undefined && p.variants) {
      const variant = p.variants[parseInt(vPart)];
      const vStock = variant?.stock ?? null;
      if (vStock !== null && (cart[key] || 0) >= vStock) { showToast(`Only ${vStock} in stock`); return; }
    } else if (p.stock !== null && p.stock !== undefined) {
      if (productCartQty(p.id) >= p.stock) { showToast(`Only ${p.stock} in stock`); return; }
    }
  }
  cart[key] = (cart[key] || 0) + delta;
  if (cart[key] <= 0) delete cart[key];
  saveCart(); renderCart(); renderProducts();
}
function removeFromCart(key) {
  delete cart[key];
  saveCart(); renderCart(); renderProducts();
}
function removeAll() {
  cart = {};
  saveCart();
  renderCart();
  renderProducts();
  showToast('Removed all items');
}
function cartTotal() {
  return Object.entries(cart).reduce((sum, [key, qty]) => {
    const [idStr, vPart] = key.split('_v');
    const p = PRODUCTS.find(x => x.id == idStr);
    if (!p) return sum;
    const variant = vPart !== undefined && p.variants ? p.variants[parseInt(vPart)] : null;
    const price = variant ? parseFloat(variant.price || p.price) : p.price;
    return sum + price * qty;
  }, 0);
}
function deliveryFee() { return cartTotal() >= 200 ? 0 : 15; }
function cartCount() {
  return Object.values(cart).reduce((a, b) => a + b, 0);
}

function renderCart() {
  const _count = cartCount();
  const _badge = document.getElementById('cart-count');
  _badge.textContent = _count;
  _badge.style.display = _count > 0 ? '' : 'none';
  const wrap = document.getElementById('cart-items');
  const ids = Object.keys(cart);
  if (ids.length === 0) {
    wrap.innerHTML = `<div class="cart-empty">Your cart is empty.<br>Add some products to get started!</div>`;
  } else {
    wrap.innerHTML = ids.map(key => {
      const [idStr, vPart] = key.split('_v');
      const p = PRODUCTS.find(x => x.id == idStr);
      if (!p) return '';
      const variant = vPart !== undefined && p.variants ? p.variants[parseInt(vPart)] : null;
      const price = variant ? parseFloat(variant.price || p.price) : p.price;
      const qty = cart[key];
      const lineTotal = (price * qty).toFixed(2);
      const allQty = productCartQty(p.id);
      const atMax = p.stock !== null && p.stock !== undefined && allQty >= p.stock;
      const thumb = p.images && p.images.length > 0 ? `<img src="${p.images[0]}" alt="${p.name}" style="width:80%;height:80%;object-fit:cover;">` : p.image ? `<img src="${p.image}" alt="${p.name}" style="width:80%;height:80%;object-fit:contain;">` : '';
      return `
        <div class="cart-row">
          <div class="cart-thumb">${thumb}</div>
          <div class="cart-info">
            <div class="name-row">
              <div class="name">${p.name.length > 30 ? p.name.slice(0, 30) + '…' : p.name}</div>
              <div class="cart-line-total">${STORE.currency}${lineTotal}</div>
            </div>
            <div class="meta">${STORE.currency}${price.toFixed(2)} · ${p.unit}${variant ? ` · ${variant.name}` : ''}</div>
            <div class="qty">
              <button onclick="changeQty('${key}', -1)">−</button>
              <span>${qty}</span>
              <button onclick="changeQty('${key}', 1)" ${atMax ? 'disabled style="opacity:0.35;cursor:not-allowed;"' : ''}>+</button>
            </div>
          </div>
          <button class="remove-x" onclick="removeFromCart('${key}')" title="Remove">×</button>
        </div>
      `;
    }).join('');
  }
  const total = cartTotal();
  const fee = deliveryFee();
  const subtotalEl = document.getElementById('subtotal');
  const deliveryEl = document.getElementById('delivery-fee');
  if (subtotalEl) subtotalEl.textContent = STORE.currency + total.toFixed(2);
  if (deliveryEl) deliveryEl.textContent = fee === 0 ? 'Free' : STORE.currency + fee.toFixed(2);
  document.getElementById('grand-total').textContent = STORE.currency + total.toFixed(2);
  document.getElementById('checkout-btn').disabled = (ids.length === 0);
}

function openCart() {
  document.getElementById('drawer').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}
function closeCart() {
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

// ---------- TOAST ----------
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- GO ----------
if (window.location.hash === '#cart') {
  openCart();
  history.replaceState(null, '', window.location.pathname);
}
init();

// Load products from Firestore — real-time sync across devices
let shuffledOrder = null;
db.collection('products').onSnapshot(snapshot => {
  const fresh = snapshot.docs.map(doc => doc.data());
  if (shuffledOrder === null) {
    // First load — shuffle once for this session
    fresh.sort((a, b) => a.id - b.id);
    for (let i = fresh.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [fresh[i], fresh[j]] = [fresh[j], fresh[i]];
    }
    shuffledOrder = fresh.map(p => p.id);
    PRODUCTS = fresh;
  } else {
    // Subsequent update (stock change, etc.) — keep shuffled order, update data
    const map = {};
    fresh.forEach(p => map[p.id] = p);
    PRODUCTS = shuffledOrder.filter(id => map[id]).map(id => map[id]);
    // Append any brand-new products at the end
    fresh.forEach(p => { if (!shuffledOrder.includes(p.id)) { PRODUCTS.push(p); shuffledOrder.push(p.id); } });
  }
  Object.keys(cart).forEach(key => { const id = key.split('_v')[0]; if (!PRODUCTS.find(x => x.id == id)) delete cart[key]; });
  saveCart();
  renderCategories();
  renderProducts();
  renderCart();
}, () => {
  // Firestore unavailable — fall back to local data
  PRODUCTS = JSON.parse(localStorage.getItem('sariProducts') || '[]');
  if (!PRODUCTS.length) PRODUCTS = DEFAULT_PRODUCTS;
  renderProducts();
  renderCart();
});
</script>
