<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JT Sari-Sari Store</title>
<style>
  /* ---------- BASE ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --ok: #16a34a;
    --warn: #f59e0b;
    --soft: #f9fafb;
    --radius: 10px;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font: inherit; color: inherit; }

  /* ---------- HEADER ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: #fff;
    border-bottom: 1px solid var(--line);
  }
  .nav {
    max-width: 1100px; margin: 0 auto;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .brand .logo {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--accent); color: #fff;
    display: grid; place-items: center; font-weight: 700;
  }
  .brand h1 { font-size: 17px; font-weight: 600; line-height: 1.2; }
  .brand small { color: var(--muted); font-size: 12px; }
  .search {
    flex: 1;
    display: flex; align-items: center; gap: 8px;
    background: var(--soft); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 12px;
  }
  .search input {
    flex: 1; border: none; background: transparent; outline: none; font-size: 16px;
  }
  .cart-btn {
    position: relative;
    padding: 8px 14px;
    background: var(--ink); color: #fff;
    border-radius: var(--radius);
    font-weight: 500; font-size: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .cart-btn .badge {
    background: var(--accent); color: #fff;
    border-radius: 999px; padding: 1px 7px;
    font-size: 12px; font-weight: 600;
  }

  /* ---------- INFO BAR ---------- */
  .info-bar {
    background: var(--soft);
    border-bottom: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
  }
  .info-inner {
    max-width: 1100px; margin: 0 auto;
    padding: 8px 16px;
    display: flex; gap: 16px; flex-wrap: wrap;
  }
  .info-inner span strong { color: var(--ink); font-weight: 600; }

  /* ---------- CATEGORIES ---------- */
  .container {
    max-width: 1100px; margin: 0 auto; padding: 16px;
    display: flex; gap: 20px;
  }
  .categories {
    display: flex; flex-direction: column; gap: 8px;
    width: 180px; flex-shrink: 0;
    padding: 4px 0;
  }
  .chip {
    padding: 10px 14px; border-radius: 8px;
    background: var(--soft); border: 1px solid var(--line);
    font-size: 13px; text-align: left;
    transition: all .15s; cursor: pointer;
  }
  .chip.active {
    background: var(--ink); color: #fff; border-color: var(--ink);
  }
  .chip:hover { border-color: var(--ink); background: var(--soft); }
  .chip.active:hover { background: var(--ink); }

  /* ---------- PRODUCT GRID ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 160px));
    justify-content: start;
    gap: 14px;
    flex: 1;
    align-items: start;
  }
  .card {
    width: 100%;
    max-width: 160px;
    min-height: 220px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.06); }
  .thumb {
    aspect-ratio: 1 / 1;
    background: var(--soft);
    display: grid; place-items: center;
    font-size: 34px;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
    position: relative;
  }
  .card-body { padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .card-name {
    font-size: 14px; font-weight: 500; line-height: 1.3;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .card-unit { font-size: 12px; color: var(--muted); }
  .card-bottom {
    margin-top: auto; padding-top: 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .price { font-size: 15px; font-weight: 700; }
  .add-btn {
    background: var(--accent); color: #fff;
    width: 30px; height: 30px; border-radius: 8px;
    font-size: 18px; line-height: 1;
    display: grid; place-items: center;
    transition: background .15s;
  }
  .add-btn:hover { background: var(--accent-dark); }
  .empty {
    text-align: center; color: var(--muted);
    padding: 40px 16px; grid-column: 1 / -1;
  }

  /* ---------- CART DRAWER ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 100%; max-width: 380px;
    background: #fff;
    z-index: 101;
    transform: translateX(100%);
    transition: transform .25s ease-out;
    display: flex; flex-direction: column;
    box-shadow: -8px 0 24px rgba(0,0,0,.1);
  }
  .drawer.show { transform: translateX(0); }
  .drawer-head {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .drawer-head h2 { font-size: 16px; font-weight: 600; }
  .close-btn {
    width: 30px; height: 30px;
    border-radius: 6px; font-size: 22px;
    display: grid; place-items: center;
  }
  .close-btn:hover { background: var(--soft); }
  .cart-items { flex: 1; overflow-y: auto; padding: 8px; }
  .cart-empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .cart-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px;
    border-bottom: 1px solid var(--line);
  }
  .cart-thumb {
    width: 50px; height: 50px; border-radius: 8px;
    background: var(--soft);
    display: grid; place-items: center; font-size: 26px;
    flex-shrink: 0;
  }
  .cart-info { flex: 1; min-width: 0; }
  .cart-info .name-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cart-info .name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .cart-info .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .qty {
    display: flex; align-items: center; gap: 6px;
    margin-top: 6px;
  }
  .cart-actions {
    display: flex; flex-direction: column; align-items: flex-end;
    justify-content: space-between;
    min-width: 72px;
  }
  .qty button {
    width: 24px; height: 24px; border-radius: 6px;
    border: 1px solid var(--line);
    font-size: 14px;
  }
  .qty button:hover { background: var(--soft); }
  .qty span { font-size: 13px; min-width: 20px; text-align: center; }
  .cart-line-total { font-weight: 600; font-size: 14px; align-self: center; }
  .remove-x {
    color: var(--muted); font-size: 16px; align-self: flex-start;
    padding: 2px 6px;
  }
  .remove-x:hover { color: #dc2626; }

  .drawer-foot { border-top: 1px solid var(--line); padding: 10px 12px; background: #fff; display: grid; gap: 4px; }
  .totals { display: flex; justify-content: space-between; margin-bottom: 2px; font-size: 13px; }
  .totals.grand { font-size: 14px; font-weight: 700; margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--line); }
  .checkout-btn {
    width: 100%; padding: 9px;
    background: var(--accent); color: #fff;
    border-radius: var(--radius);
    font-weight: 600; font-size: 14px;
    transition: background .15s;
  }
  .checkout-btn:hover { background: var(--accent-dark); }
  .checkout-btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

  /* ---------- MODAL ---------- */
  .modal {
    position: fixed; inset: 0;
    z-index: 200;
    display: none;
    align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(0,0,0,.4);
  }
  .modal.show { display: flex; }
  .modal-box {
    background: #fff; border-radius: var(--radius);
    width: 100%; max-width: 460px;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-head {
    padding: 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-head h2 { flex: 1; min-width: 0; overflow: hidden; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
  .modal-body { padding: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; outline: none;
    background: #fff;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 60px; }
  .pay-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pay-opt {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; font-size: 14px; text-align: center;
    transition: all .15s;
  }
  .pay-opt.active { border-color: var(--accent); background: #eff6ff; color: var(--accent-dark); font-weight: 600; }
  .pay-info {
    margin-top: 10px; padding: 10px;
    background: var(--soft); border-radius: 8px;
    font-size: 13px; color: var(--muted);
    display: none;
  }
  .pay-info.show { display: block; }
  .pay-info strong { color: var(--ink); }
  .modal-foot {
    padding: 12px 16px; border-top: 1px solid var(--line);
    display: flex; gap: 8px;
  }
  .btn-secondary {
    flex: 1; padding: 7px; border-radius: 8px;
    border: 1px solid var(--line); font-size: 13px;
    background: #fff;
  }
  .btn-secondary:hover { background: var(--soft); }
  .btn-primary {
    flex: 1; padding: 10px; border-radius: 8px;
    background: var(--accent); color: #fff;
    font-size: 14px; font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent-dark); }

  /* ---------- TOAST ---------- */
  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 999px;
    font-size: 14px; opacity: 0;
    transition: opacity .2s, transform .2s;
    z-index: 300; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- FOOTER ---------- */
  footer {
    margin-top: 40px; padding: 24px 16px;
    border-top: 1px solid var(--line);
    text-align: center; color: var(--muted); font-size: 13px;
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 600px) {
    .nav { flex-wrap: wrap; align-items: stretch; }
    .brand { width: 100%; }
    .brand h1 { font-size: 15px; }
    .brand small { display: none; }
    .search {
      width: 100%; min-width: 0;
      padding: 7px 10px;
    }
    .cart-btn {
      margin-top: 10px;
      width: auto;
      flex-shrink: 0;
    }
    .cart-btn span.label { display: none; }
    .container { flex-direction: column; }
    .categories {
      width: 100%; flex-direction: row; overflow-x: auto;
      gap: 8px; flex-wrap: nowrap; padding: 8px 0;
    }
    .chip { white-space: nowrap; }
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      justify-content: start;
    }
    .card { max-width: 100%; min-height: 0; }
    .thumb { font-size: 40px; }
    .card-body { padding: 10px; }
    .info-inner { font-size: 12px; gap: 10px; flex-direction: column; align-items: flex-start; }
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
  <div class="nav">
    <div class="brand">
      <div class="logo">JT</div>
      <div>
        <h1 id="store-name">JT Sari-Sari Store</h1>
        <small id="store-tag" style="display:none;"></small>
      </div>
    </div>
    <div class="search">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="Search products..." />
      <button id="search-clear" onclick="clearSearch()" style="display:none; color:var(--muted); font-size:18px; line-height:1; padding:0 2px; flex-shrink:0;">×</button>
    </div>
    <button class="cart-btn" onclick="openCart()">
      🛒 <span class="label">Cart</span>
      <span class="badge" id="cart-count">0</span>
    </button>
  </div>
</header>

<div class="info-bar">
  <div class="info-inner">
    <span>📍 <strong id="store-address">Valle Verde Subdivision</strong></span>
    <span>🕐 <strong id="store-hours">Open 6am–9pm daily</strong></span>
    <span>🛵 <strong id="store-delivery">Free delivery within Valle Verde</strong></span>
    <span style="display:none;">🕒 Delivery Time: <strong id="store-delivery-times">6am · 9am · 12pm · 3pm · 6pm · 9pm</strong></span>
  </div>
</div>

<div class="container">
  <div class="categories" id="categories"></div>
  <div class="grid" id="products"></div>
</div>

<footer>
  <div>Maraming salamat po! 🙏</div>
  <div style="margin-top:6px">Message us on Messenger anytime for orders.</div>
  <div style="margin-top:12px; font-size: 12px; color: var(--muted);"><a href="admin.html" style="color: inherit; text-decoration: none;">Store Admin</a></div>
</footer>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>Your Cart</h2>
    <button class="close-btn" onclick="closeCart()">×</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="drawer-foot">
    <div class="totals"><span>Subtotal</span><span id="subtotal">₱0.00</span></div>
    <div class="totals"><span>Delivery</span><span id="delivery-fee">Free</span></div>
    <div class="totals grand"><span>Total</span><span id="grand-total">₱0.00</span></div>
    <button class="btn-secondary" id="remove-all-btn" onclick="removeAll()">Remove All</button>
    <button class="checkout-btn" id="checkout-btn" onclick="window.location.href='checkout.html'" disabled>Checkout</button>
  </div>
</aside>

<!-- PRODUCT DETAIL MODAL -->
<div class="modal" id="product-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modal-product-name"></h2>
      <button class="close-btn" onclick="closeProductModal()">×</button>
    </div>
    <div class="modal-body">
      <!-- Photo gallery (shown when product has images) -->
      <div id="modal-gallery" style="display:none; margin-bottom:16px;">
        <div id="modal-slides" style="border-radius:8px; overflow:hidden; background:var(--soft); touch-action:pan-y; user-select:none;"></div>
        <div id="modal-dots" style="text-align:center; margin-top:8px;"></div>
      </div>
      <!-- Emoji fallback (shown when no images) -->
      <div style="font-size: 80px; text-align: center; margin-bottom: 16px;" id="modal-product-emoji"></div>
      <div id="modal-product-description" style="margin-bottom: 16px; font-size: 14px; line-height: 1.5;"></div>
      <div style="background: var(--soft); padding: 12px; border-radius: 8px; margin-bottom: 16px;">
        <div style="font-size: 13px; color: var(--muted); margin-bottom: 4px;">Price</div>
        <div style="font-size: 18px; font-weight: 700;" id="modal-product-price"></div>
        <div style="font-size: 13px; color: var(--muted); margin-top: 4px;" id="modal-product-unit"></div>
      </div>
      <div id="modal-variants" style="display: none; margin-bottom: 16px;">
        <label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px;">Choose variant:</label>
        <select id="variant-select" style="width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none; background: #fff;">
          <option value="">Select one</option>
        </select>
      </div>
      <input type="hidden" id="modal-product-id" />
    </div>
    <div class="modal-foot">
      <button class="btn-secondary" onclick="closeProductModal()">Cancel</button>
      <button class="btn-primary" onclick="addFromModal()">Add to Cart</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  apiKey: "AIzaSyDM0oTTumombQiZy1xFMBwro8X1oqzNDAs",

  storageBucket: "jt-sari-sari-store.firebasestorage.app",

};

const db = firebase.firestore();
let PRODUCTS = [];

/* ============================================================
   🚫  Below this line is the app logic — no need to edit
   unless you want to change how the store works.
============================================================ */

// ---------- GALLERY ----------
let galleryImages = [];
let galleryIndex  = 0;

function renderGallerySlide() {
  document.getElementById('modal-slides').innerHTML =
    `<img src="${galleryImages[galleryIndex]}" alt="Product photo" style="width:100%;height:220px;object-fit:contain;display:block;" />`;
  document.getElementById('modal-dots').innerHTML = galleryImages.length > 1
    ? galleryImages.map((_, i) =>
        `<span onclick="goToGallerySlide(${i})" style="display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px;cursor:pointer;background:${i === galleryIndex ? 'var(--accent)' : 'var(--line)'}"></span>`
      ).join('')
    : '';
}
function nextGallerySlide() { galleryIndex = (galleryIndex + 1) % galleryImages.length; renderGallerySlide(); }
function prevGallerySlide() { galleryIndex = (galleryIndex - 1 + galleryImages.length) % galleryImages.length; renderGallerySlide(); }
function goToGallerySlide(i) { galleryIndex = i; renderGallerySlide(); }

// ---------- STATE ----------
let cart = JSON.parse(localStorage.getItem('sariCart') || '{}');
let activeCategory = "All";
let searchTerm = "";

// ---------- INIT ----------
function adjustHeaderOffset() {
  document.body.style.paddingTop = document.querySelector('header').offsetHeight + 'px';
}

function init() {
  adjustHeaderOffset();
  window.addEventListener('resize', adjustHeaderOffset);

  // Apply store config to header / info bar
  document.getElementById('store-name').textContent = STORE.name;
  document.getElementById('store-tag').textContent = STORE.tagline;
  document.getElementById('store-address').textContent = STORE.address;
  document.getElementById('store-hours').textContent = STORE.hours;
  document.getElementById('store-delivery').textContent = STORE.delivery;
  document.getElementById('store-delivery-times').textContent = STORE.deliveryTimes;
  document.title = STORE.name;

  renderCategories();
  renderCart();
  document.getElementById('products').innerHTML = '<div class="empty">Loading products…</div>';

  document.getElementById('search-input').addEventListener('input', (e) => {
    searchTerm = e.target.value.toLowerCase();
    document.getElementById('search-clear').style.display = searchTerm ? 'inline' : 'none';
    renderProducts();
  });

  // ESC closes modals
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeCart(); closeProductModal(); }
  });
}

// ---------- PRODUCT DETAIL ----------
function showProductDetail(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;

  document.getElementById('modal-product-id').value = id;
  document.getElementById('modal-product-name').textContent = p.name;

  // Gallery vs emoji
  const gallery   = document.getElementById('modal-gallery');
  const emojiDiv  = document.getElementById('modal-product-emoji');
  galleryImages   = (p.images && p.images.length > 0) ? p.images : [];
  galleryIndex    = 0;
  if (galleryImages.length > 0) {
    gallery.style.display  = 'block';
    emojiDiv.style.display = 'none';
    renderGallerySlide();
    const slidesEl = document.getElementById('modal-slides');
    let touchStartX = 0;
    slidesEl.ontouchstart = e => { touchStartX = e.touches[0].clientX; };
    slidesEl.ontouchend   = e => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) diff > 0 ? nextGallerySlide() : prevGallerySlide();
    };
  } else {
    gallery.style.display  = 'none';
    emojiDiv.style.display = 'block';
    emojiDiv.textContent   = p.emoji || '📦';
  }
  document.getElementById('modal-product-price').textContent = STORE.currency + p.price.toFixed(2);
  document.getElementById('modal-product-unit').textContent = p.unit;
  document.getElementById('modal-product-description').textContent = p.description || 'No description available';

  // Handle variants
  const variantDiv = document.getElementById('modal-variants');
  const variantSelect = document.getElementById('variant-select');
  if (p.variants && p.variants.length > 0) {
    variantDiv.style.display = 'block';
    variantSelect.innerHTML = '<option value="">Select one</option>' + p.variants.map((v, i) => 
      `<option value="${i}">${v.name} (${STORE.currency}${parseFloat(v.price || 0).toFixed(2)})</option>`
    ).join('');
  } else {
    variantDiv.style.display = 'none';
    variantSelect.innerHTML = '<option value="">Select one</option>';
  }

  // Disable Add to Cart if out of stock
  const addBtn = document.querySelector('#product-modal .btn-primary');
  if (p.available === false) {
    addBtn.disabled = true;
    addBtn.textContent = 'Out of Stock';
    addBtn.style.cssText = 'background:var(--line);color:var(--muted);cursor:not-allowed;';
  } else {
    addBtn.disabled = false;
    addBtn.textContent = 'Add to Cart';
    addBtn.style.cssText = '';
  }

  document.getElementById('product-modal').classList.add('show');
}

function closeProductModal() {
  document.getElementById('product-modal').classList.remove('show');
}

function addFromModal() {
  const id = parseInt(document.getElementById('modal-product-id').value);
  cart[id] = (cart[id] || 0) + 1;
  saveCart();
  renderCart();
  closeProductModal();
  showToast("Added to cart");
}

// ---------- SEARCH CLEAR ----------
function clearSearch() {
  document.getElementById('search-input').value = '';
  searchTerm = '';
  document.getElementById('search-clear').style.display = 'none';
  renderProducts();
}

// ---------- CATEGORIES ----------
function renderCategories() {
  const wrap = document.getElementById('categories');
  // Merge hardcoded order with any custom categories from loaded products
  const cats = ['All', ...new Set([
    ...CATEGORIES.filter(c => c !== 'All'),
    ...PRODUCTS.map(p => p.category).filter(Boolean)
  ])];
  // If active category no longer exists, fall back to All
  if (activeCategory !== 'All' && !cats.includes(activeCategory)) activeCategory = 'All';
  wrap.innerHTML = cats.map(cat =>
    `<button class="chip ${cat === activeCategory ? 'active' : ''}" onclick="pickCategory('${cat.replace(/'/g, "\\'")}')">${cat}</button>`
  ).join('');
}
function pickCategory(cat) {
  activeCategory = cat;
  renderCategories();
  renderProducts();
}

// ---------- PRODUCTS ----------
function renderProducts() {
  const grid = document.getElementById('products');
  let list = PRODUCTS.filter(p => activeCategory === "All" || p.category === activeCategory);
  if (searchTerm) {
    list = list.filter(p => {
      const text = `${p.name} ${p.description || ''}`.toLowerCase();
      return text.includes(searchTerm);
    });
  }
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty">No products found.</div>`;
    return;
  }
  grid.innerHTML = list.map(p => {
    const ok = p.available !== false;
    return `
    <div class="card" onclick="showProductDetail(${p.id})">
      <div class="thumb">
        ${p.images && p.images.length > 0 ? `<img src="${p.images[0]}" alt="${p.name}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">` : p.image ? `<img src="${p.image}" alt="${p.name}" style="width:80%;height:80%;object-fit:contain;">` : p.emoji || '📦'}
        ${!ok ? `<div style="position:absolute;top:6px;left:6px;background:#dc2626;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;line-height:1.5;z-index:1;">OUT OF STOCK</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-unit">${p.unit}</div>
        ${p.description ? `<div style="font-size:12px;color:var(--muted);margin:4px 0;">${p.description.substring(0, 50)}${p.description.length > 50 ? '...' : ''}</div>` : ''}
        ${p.stock ? `<div style="font-size:12px;color:var(--warn);">Stock: ${p.stock}</div>` : ''}
        <div class="card-bottom">
          <div class="price">${STORE.currency}${p.price.toFixed(2)}</div>
          <button class="add-btn" onclick="${ok ? `addToCart(${p.id}); event.stopPropagation()` : 'event.stopPropagation()'}" ${!ok ? 'disabled' : ''} title="${ok ? 'Add to cart' : 'Out of stock'}" style="${!ok ? 'background:var(--line);cursor:not-allowed;' : ''}">+</button>
        </div>
      </div>
    </div>
  `;}).join('');
}

// ---------- CART ----------
function saveCart() { localStorage.setItem('sariCart', JSON.stringify(cart)); }

function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  saveCart();
  renderCart();
  showToast("Added to cart");
}
function changeQty(id, delta) {
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  saveCart();
  renderCart();
}
function removeFromCart(id) {
  delete cart[id];
  saveCart();
  renderCart();
}
function removeAll() {
  cart = {};
  saveCart();
  renderCart();
  showToast('Removed all items');
}
function cartTotal() {
  return Object.entries(cart).reduce((sum, [id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    return p ? sum + p.price * qty : sum;
  }, 0);
}
function cartCount() {
  return Object.values(cart).reduce((a, b) => a + b, 0);
}

function renderCart() {
  document.getElementById('cart-count').textContent = cartCount();
  const wrap = document.getElementById('cart-items');
  const ids = Object.keys(cart);
  if (ids.length === 0) {
    wrap.innerHTML = `<div class="cart-empty">Your cart is empty.<br>Add some products to get started!</div>`;
  } else {
    wrap.innerHTML = ids.map(id => {
      const p = PRODUCTS.find(x => x.id == id);
      if (!p) return '';
      const qty = cart[id];
      const lineTotal = (p.price * qty).toFixed(2);
      return `
        <div class="cart-row">
          <div class="cart-thumb">${p.images && p.images.length > 0 ? `<img src="${p.images[0]}" alt="${p.name}" style="width:80%;height:80%;object-fit:cover;">` : p.image ? `<img src="${p.image}" alt="${p.name}" style="width:80%;height:80%;object-fit:contain;">` : p.emoji}</div>
          <div class="cart-info">
            <div class="name-row">
              <div class="name">${p.name.length > 30 ? p.name.slice(0, 30) + '…' : p.name}</div>
              <div class="cart-line-total">${STORE.currency}${lineTotal}</div>
            </div>
            <div class="meta">${STORE.currency}${p.price.toFixed(2)} · ${p.unit}</div>
            <div class="qty">
              <button onclick="changeQty(${p.id}, -1)">−</button>
              <span>${qty}</span>
              <button onclick="changeQty(${p.id}, 1)">+</button>
            </div>
          </div>
          <button class="remove-x" onclick="removeFromCart(${p.id})" title="Remove">×</button>
        </div>
      `;
    }).join('');
  }
  const total = cartTotal();
  document.getElementById('subtotal').textContent = STORE.currency + total.toFixed(2);
  document.getElementById('grand-total').textContent = STORE.currency + total.toFixed(2);
  document.getElementById('checkout-btn').disabled = (ids.length === 0);
}

function openCart() {
  document.getElementById('drawer').classList.add('show');
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeCart() {
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow = '';
}

// ---------- TOAST ----------
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- GO ----------
if (window.location.hash === '#cart') {
  openCart();
  history.replaceState(null, '', window.location.pathname);
}
init();

// Load products from Firestore — real-time sync across devices
db.collection('products').onSnapshot(snapshot => {
  PRODUCTS = snapshot.docs.map(doc => doc.data());
  PRODUCTS.sort((a, b) => a.id - b.id);
  Object.keys(cart).forEach(id => { if (!PRODUCTS.find(x => x.id == id)) delete cart[id]; });
  saveCart();
  renderCategories();
  renderProducts();
  renderCart();
}, () => {
  // Firestore unavailable — fall back to local data
  PRODUCTS = JSON.parse(localStorage.getItem('sariProducts') || '[]');
  if (!PRODUCTS.length) PRODUCTS = DEFAULT_PRODUCTS;
  renderProducts();
  renderCart();
});
</script>
