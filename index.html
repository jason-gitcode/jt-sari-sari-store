<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JS Mini Mart</title>
<!-- Resolve all relative URLs from the site root so /jsminimart/, /tenant1/, etc.
     still pull /logo.PNG, /sw.js, etc. without hitting tenant-prefixed 404s. -->
<base href="/">
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2563eb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="JS Mini Mart" />
<link rel="apple-touch-icon" href="/newlogo.jpeg" />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="dns-prefetch" href="https://www.googleapis.com">
<script>
  // Sync URL → root class so the jsminimart logo is hidden BEFORE the
  // header paints on any other tenant. Avoids a "JS Mini Mart" flash
  // when loading e.g. /ggssminimart/.
  (function () {
    var parts = window.location.pathname.split('/').filter(Boolean);
    if (parts[0] && parts[0] !== 'jsminimart') {
      document.documentElement.classList.add('no-default-logo');
    }
  })();
</script>
<style>
  html.no-default-logo .logo { display: none !important; }
  /* Also blank the hardcoded "JS Mini Mart" <h1> until settings snapshot
     replaces it with the tenant's real storeName. */
  html.no-default-logo #store-name { visibility: hidden; }
  html.no-default-logo #store-tag  { visibility: hidden; }
  /* ---------- BASE ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --ink: #1a1a1a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --ok: #16a34a;
    --warn: #f59e0b;
    --soft: #f9fafb;
    --radius: 10px;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font: inherit; color: inherit; }

  /* ---------- HEADER ---------- */
  header {
    flex-shrink: 0;
    background: #fff;
    border-bottom: 1px solid var(--line);
    position: relative;
    overflow: hidden;
    transition: background .6s, border-color .6s;
  }
  header.rain-mode { background: linear-gradient(180deg, #bfdbfe 0%, #93c5fd 100%); border-bottom-color: #60a5fa; }
  .rain-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .rain-drop {
    position: absolute; top: -20px;
    width: 1.5px; border-radius: 0 0 2px 2px;
    background: linear-gradient(to bottom, transparent, rgba(96,165,250,0.7));
    animation: rain-fall linear infinite;
  }
  @keyframes rain-fall {
    0%   { transform: translateY(0);    opacity: 0.9; }
    100% { transform: translateY(90px); opacity: 0.1; }
  }
  .info-bar.rain-mode { background: #eff6ff; border-bottom-color: #bfdbfe; }
  .rain-ticker-item { color: #1e40af; }
  .rain-ticker-item strong { color: #1e40af; }
  header.rain-mode .brand .logo img {
    mix-blend-mode: multiply;
    filter: contrast(1.2) saturate(1.3) brightness(0.95);
  }
  header.rain-mode .cart-btn {
    background: rgba(255,255,255,0.85);
    color: #1e3a8a;
    border-radius: 8px;
    font-weight: 700;
  }
  header.rain-mode .cart-btn .badge {
    background: #e53e3e;
  }
  .closed-ticker-item { color: #9f1239; }
  .closed-ticker-item strong { color: #9f1239; }
  .maintenance-ticker-item { color: #92400e; }
  .maintenance-ticker-item strong { color: #92400e; }
  .rain-cloud {
    position: absolute;
    background: rgba(255,255,255,0.55);
    border-radius: 50px;
    pointer-events: none;
    animation: cloud-drift ease-in-out infinite;
  }
  .rain-cloud::before, .rain-cloud::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
  }
  .rain-cloud::before { width: 55%; height: 170%; top: -60%; left: 18%; }
  .rain-cloud::after  { width: 40%; height: 130%; top: -45%; left: 50%; }
  @keyframes cloud-drift {
    0%,100% { transform: translateX(0); }
    50%     { transform: translateX(6px); }
  }
  .nav {
    max-width: 1100px; margin: 0 auto;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    position: relative; z-index: 1;
  }
  .brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; max-width: 240px; }
  .brand .logo {
    height: 54px; width: 54px; flex-shrink: 0;
    border-radius: 50%; overflow: hidden;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: 4px;
  }
  .brand .logo img { height: 100%; width: 100%; object-fit: contain; }
  .brand > div { min-width: 0; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .brand h1 {
    font-size: 17px; font-weight: 600; line-height: 1.2;
    word-break: break-word; max-height: 3em; overflow: hidden;
    text-align: center; width: 100%;
  }
  /* Scale down for longer storeNames so the full name fits on screen. */
  .brand h1.scale-md { font-size: 14px; }
  .brand h1.scale-sm { font-size: 12px; }
  .brand h1.scale-xs { font-size: 11px; }
  .brand small { color: var(--muted); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; width: 100%; }
  .search {
    flex: 1; position: relative;
    display: flex; align-items: center; gap: 8px;
    background: var(--soft); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 12px;
  }
  .search input {
    flex: 1; border: none; background: transparent; outline: none; font-size: 16px;
    padding-right: 28px;
  }
  #search-clear {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 18px; color: var(--muted); line-height: 1; padding: 0;
  }
  .cart-btn {
    position: relative;
    padding: 8px 14px;
    background: transparent; color: var(--ink);
    border-radius: var(--radius);
    font-weight: 500; font-size: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .cart-btn .badge {
    background: #e53e3e; color: #fff;
    border-radius: 999px; padding: 1px 7px;
    font-size: 12px; font-weight: 600;
  }

  /* ---------- INFO BAR / TICKER ---------- */
  .info-bar {
    flex-shrink: 0;
    background: var(--soft);
    border-bottom: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
    overflow: hidden;
    padding: 8px 0;
  }
  .ticker-track {
    display: inline-flex;
    white-space: nowrap;
    animation: ticker 22s linear infinite;
  }
  .ticker-track:hover { animation-play-state: paused; }
  .ticker-item {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0 48px;
  }
  .ticker-item strong { color: var(--ink); font-weight: 600; }
  .ticker-sep { color: var(--line); font-size: 16px; user-select: none; }
  @keyframes ticker {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ---------- CATEGORIES ---------- */
  .container {
    flex: 1; min-height: 0;
    max-width: 1100px; margin: 0 auto; padding: 0 16px;
    display: flex; gap: 20px; overflow: hidden;
    width: 100%;
  }
  .categories {
    display: flex; flex-direction: column; gap: 8px;
    width: 180px; flex-shrink: 0;
    padding: 16px 0;
    overflow-y: auto;
  }
  .products-col {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 16px 0;
  }
  .chip {
    padding: 10px 14px; border-radius: 8px;
    background: var(--soft); border: 1px solid var(--line);
    font-size: 13px; text-align: left;
    transition: all .15s; cursor: pointer;
  }
  .chip.active {
    background: var(--ink); color: #fff; border-color: var(--ink);
  }
  .chip:hover { border-color: var(--ink); background: var(--soft); }
  .chip.active:hover { background: var(--ink); }

  /* ---------- PRODUCT GRID ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);   /* desktop: max 4 columns so names + prices have room */
    gap: 14px;
    flex: 1;
    align-items: stretch;                    /* every card in a row matches the tallest — no jagged heights from uneven descriptions */
  }
  .card {
    width: 100%;
    max-width: 220px;
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: box-shadow .15s, transform .15s;
    position: relative;
    /* Skip rendering off-screen cards entirely until they scroll close to
       the viewport — browser only pays layout + paint cost for what's
       visible. contain-intrinsic-size reserves a placeholder so the
       scrollbar doesn't jump as cards materialise. */
    content-visibility: auto;
    contain-intrinsic-size: 220px 240px;
  }
  .card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.06); }
  .thumb {
    aspect-ratio: 1 / 1;
    background: var(--soft);
    display: grid; place-items: center;
    font-size: 34px;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
    position: relative;
  }
  .card-body {
    padding: 10px 12px 12px 12px;
    display: flex; flex-direction: column; gap: 4px; flex: 1;
  }
  .card-name {
    font-size: 14px; font-weight: 500; line-height: 1.3;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .card-unit { font-size: 12px; color: var(--muted); }
  .card-bottom {
    margin-top: auto;                         /* push to the bottom of the card so price + add-btn align across the row even when descriptions differ in length */
    padding-top: 8px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
  }
  .price {
    font-size: 15px; font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
    min-width: 0; flex: 1;
  }
  /* All prices render at the same size — if a range price doesn't fit,
     the existing overflow:hidden + text-overflow:ellipsis chops it with "…". */
  .add-btn {
    background: var(--accent); color: #fff;
    width: 34px; height: 34px; border-radius: 8px;
    font-size: 18px; line-height: 1;
    display: grid; place-items: center;
    flex-shrink: 0;
    transition: background .15s;
    box-shadow: 0 1px 4px rgba(37, 99, 235, 0.25);
  }
  .add-btn:hover { background: var(--accent-dark); }
  .add-btn.in-cart { background: var(--ok); font-size: 14px; font-weight: 700; }
  .add-btn.in-cart:hover { background: #15803d; }
  .add-btn.in-cart:disabled { background: var(--ok); opacity: 0.5; cursor: not-allowed; }
  .empty {
    text-align: center; color: var(--muted);
    padding: 40px 16px; grid-column: 1 / -1;
  }

  /* ---------- CART DRAWER ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 100%; max-width: 380px;
    background: #fff;
    z-index: 101;
    transform: translateX(100%);
    transition: transform .25s ease-out;
    display: flex; flex-direction: column;
    box-shadow: -8px 0 24px rgba(0,0,0,.1);
  }
  .drawer.show { transform: translateX(0); }
  .drawer-head {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .drawer-head h2 { font-size: 16px; font-weight: 600; }
  .close-btn {
    width: 30px; height: 30px;
    border-radius: 6px; font-size: 22px;
    display: grid; place-items: center;
  }
  .close-btn:hover { background: var(--soft); }
  .cart-items { flex: 1; overflow-y: auto; padding: 8px; }
  .cart-empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .cart-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px;
    border-bottom: 1px solid var(--line);
  }
  .cart-thumb {
    width: 50px; height: 50px; border-radius: 8px;
    background: var(--soft);
    display: grid; place-items: center; font-size: 26px;
    flex-shrink: 0;
  }
  .cart-info { flex: 1; min-width: 0; }
  .cart-info .name-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cart-info .name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .cart-info .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .qty {
    display: flex; align-items: center; gap: 6px;
    margin-top: 6px;
  }
  .cart-actions {
    display: flex; flex-direction: column; align-items: flex-end;
    justify-content: space-between;
    min-width: 72px;
  }
  .qty button {
    width: 24px; height: 24px; border-radius: 6px;
    border: 1px solid var(--line);
    font-size: 14px;
  }
  .qty button:hover { background: var(--soft); }
  .qty span { font-size: 13px; min-width: 20px; text-align: center; }
  .cart-line-total { font-weight: 600; font-size: 14px; align-self: center; }
  .remove-x {
    color: var(--muted); font-size: 16px; align-self: flex-start;
    padding: 2px 6px;
  }
  .remove-x:hover { color: #dc2626; }

  .drawer-foot { border-top: 1px solid var(--line); padding: 10px 12px; background: #fff; display: grid; gap: 4px; }
  .totals { display: flex; justify-content: space-between; margin-bottom: 2px; font-size: 13px; }
  .totals.grand { font-size: 14px; font-weight: 700; margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--line); }
  .checkout-btn {
    width: 100%; padding: 14px;          /* +50% vertical heft */
    background: var(--accent); color: #fff;
    border-radius: var(--radius);
    font-weight: 700; font-size: 21px;   /* 14px → 21px (+50%) */
    letter-spacing: 0.01em;
    transition: background .15s;
  }
  .checkout-btn:hover { background: var(--accent-dark); }
  .checkout-btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

  /* ---------- MODAL ---------- */
  .modal {
    position: fixed; inset: 0;
    z-index: 200;
    display: none;
    align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(0,0,0,.4);
  }
  .modal.show { display: flex; }
  .modal-box {
    background: #fff; border-radius: var(--radius);
    width: 100%; max-width: 460px;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-head {
    padding: 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-head h2 {
    flex: 1; min-width: 0;
    word-break: break-word; line-height: 1.25;
    font-size: clamp(20px, 5.5vw, 26px);
    font-weight: 700;
    color: var(--ink);
    margin: 0;
  }
  /* Long product names that wrap to 2+ lines look oversized at the
     full clamp size — JS adds `.is-wrapped` after layout when this
     happens, dropping the title to a more comfortable range. */
  .modal-head h2.is-wrapped {
    font-size: clamp(16px, 4.2vw, 20px);
    line-height: 1.3;
  }
  .modal-body { padding: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; outline: none;
    background: #fff;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 60px; }
  .pay-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pay-opt {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; font-size: 14px; text-align: center;
    transition: all .15s;
  }
  .pay-opt.active { border-color: var(--accent); background: #eff6ff; color: var(--accent-dark); font-weight: 600; }
  .pay-info {
    margin-top: 10px; padding: 10px;
    background: var(--soft); border-radius: 8px;
    font-size: 13px; color: var(--muted);
    display: none;
  }
  .pay-info.show { display: block; }
  .pay-info strong { color: var(--ink); }
  .modal-foot {
    padding: 12px 16px; border-top: 1px solid var(--line);
    display: flex; gap: 8px;
  }
  .btn-secondary {
    flex: 1; padding: 7px; border-radius: 8px;
    border: 1px solid var(--line); font-size: 13px;
    background: #fff;
  }
  .btn-secondary:hover { background: var(--soft); }
  .btn-primary {
    flex: 1; padding: 10px; border-radius: 8px;
    background: var(--accent); color: #fff;
    font-size: 14px; font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent-dark); }

  /* ---------- TOAST ---------- */
  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 999px;
    font-size: 14px; opacity: 0;
    transition: opacity .2s, transform .2s;
    z-index: 300; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- FOOTER ---------- */
  footer {
    margin-top: 32px;
    border-top: 1px solid var(--line);
    background: #fafafa;
  }
  .footer-inner {
    padding: 18px 16px 14px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .footer-section {
    display: flex; flex-direction: column; gap: 4px;
    align-items: center; text-align: center;
  }
  .footer-section h4 {
    margin: 0 0 4px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.07em; text-transform: uppercase;
    color: #555;
  }
  .footer-section p, .footer-section a {
    margin: 0; font-size: 13px; line-height: 1.6;
    color: var(--muted); text-decoration: none;
  }
  .footer-section a:hover { color: var(--primary); }
  .footer-bottom {
    text-align: center; padding: 10px 16px;
    border-top: 1px solid var(--line);
    font-size: 12px; color: #bbb;
  }

  /* ---------- iPad / tablet — 4 columns, slightly smaller gap to keep the row tidy ---------- */
  @media (min-width: 601px) and (max-width: 1100px) {
    .grid { gap: 12px; }
    .card { max-width: none; }
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 600px) {
    .info-bar { font-size: 11px; padding: 5px 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    .ticker-item, .ticker-item strong,
    .rain-ticker-item, .rain-ticker-item strong,
    .ticker-sep { font-size: 11px !important; font-weight: 500; }
    .nav { flex-wrap: nowrap; align-items: center; padding: 10px 12px; gap: 10px; }
    .brand { width: auto; flex-shrink: 0; }
    .brand h1, .brand small { display: none; }
    .brand .logo { height: 44px; width: 44px; }
    .search { flex: 1; min-width: 0; border-radius: 999px; padding: 8px 14px; }
    .cart-btn {
      margin-top: 0; flex-shrink: 0;
      width: 44px; height: 44px; padding: 0;
      border-radius: 50%; background: transparent; color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; position: relative;
    }
    .cart-btn .badge {
      position: absolute; top: 1px; right: 1px;
      min-width: 18px; height: 18px; padding: 0 4px;
      font-size: 11px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .cart-btn span.label { display: none; }
    header.rain-mode .cart-btn {
      background: rgba(255,255,255,0.85); color: #1e3a8a; border-radius: 50%;
    }
    header.rain-mode .cart-btn .badge { background: #e53e3e; }
    .container { flex-direction: column; overflow-y: auto; }
    .categories {
      width: 100%; flex-direction: row; overflow-x: auto; overflow-y: hidden;
      gap: 8px; flex-wrap: nowrap; padding: 8px 0;
      flex-shrink: 0;
      position: sticky; top: 0; z-index: 10;
      background: #fff; border-bottom: 1px solid var(--line);
    }
    .products-col { flex: unset; min-height: unset; overflow-y: unset; padding: 0; }
    .chip { white-space: nowrap; }
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      justify-content: start;
      align-items: stretch;       /* match card heights row-by-row so different description lengths don't produce jagged tile heights */
    }
    .card { max-width: 100%; }
    .thumb { font-size: 40px; }
    .card-body {
      padding: 8px 10px 10px 10px;
      gap: 2px;
    }
    .card-bottom { margin-top: 6px; gap: 6px; }
    .add-btn { width: 30px; height: 30px; }
    .info-inner { font-size: 12px; gap: 10px; flex-direction: column; align-items: flex-start; }
    .footer-inner { grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 16px 16px 12px; }
  }

  /* ====================================================================
     LIST LAYOUT — FoodPanda-style stacked rows for restaurants/carinderias.
     Activated by `<html data-layout="list">` (set when settings/store loads).
     Falls back to grid otherwise. All rules are scoped under [data-layout="list"]
     so they never affect grid-mode tenants.
     ==================================================================== */
  html[data-layout="list"] .container {

function getOpenHour()  { return (typeof storeSettingsData.storeOpenHour  === 'number') ? storeSettingsData.storeOpenHour  : 6; }
function getCloseHour() { return (typeof storeSettingsData.storeCloseHour === 'number') ? storeSettingsData.storeCloseHour : 16; }

function getManilaDayIdx() {
  const wd = new Intl.DateTimeFormat('en-US', { weekday: 'short', timeZone: 'Asia/Manila' }).format(new Date());

function fmtOpenDays(days) {
  if (!Array.isArray(days) || days.length === 0) return 'never';
  if (days.length === 7) return 'daily';
  const sorted = [...days].sort((a,b) => a-b);
  if (sorted.length === 5 && sorted.join(',') === '1,2,3,4,5') return 'weekdays';
  if (sorted.length === 2 && sorted.includes(0) && sorted.includes(6)) return 'weekends';
  const lbls = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const contig = sorted.every((d, i) => i === 0 || d === sorted[i-1] + 1);
  if (contig && sorted.length >= 3) return `${lbls[sorted[0]]}–${lbls[sorted[sorted.length-1]]}`;
  return sorted.map(d => lbls[d]).join(' · ');
}
// Footer-friendly variant — full weekday names + Title Case so it reads
// naturally as a standalone line ("Monday – Friday" vs the ticker's "weekdays").
function fmtOpenDaysFooter(days) {
  if (!Array.isArray(days) || days.length === 0) return 'Closed';
  if (days.length === 7) return 'Daily';
  const sorted = [...days].sort((a,b) => a-b);
  if (sorted.length === 5 && sorted.join(',') === '1,2,3,4,5') return 'Monday – Friday';
  if (sorted.length === 2 && sorted.includes(0) && sorted.includes(6)) return 'Saturday & Sunday';
  const full  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const short = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const contig = sorted.every((d, i) => i === 0 || d === sorted[i-1] + 1);
  if (contig && sorted.length >= 3) return `${full[sorted[0]]} – ${full[sorted[sorted.length-1]]}`;
  return sorted.map(d => short[d]).join(' · ');
}
function fmtHour12Short(h) {
  if (h === 0) return '12am'; if (h < 12) return `${h}am`;
  if (h === 12) return '12pm'; return `${h - 12}pm`;
}
function fmtHour12Long(h) {
  if (h === 0) return '12:00 AM'; if (h < 12) return `${h}:00 AM`;
  if (h === 12) return '12:00 PM'; return `${h - 12}:00 PM`;
}
function fmtTime12Short(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'pm' : 'am';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return m === 0 ? `${h12}${ampm}` : `${h12}:${String(m).padStart(2, '0')}${ampm}`;
}
function fmtTime12Long(t) {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;

  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Manila',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: 'numeric', hour12: false
  }).formatToParts(new Date());
  const y = parts.find(p => p.type === 'year').value;
  const m = parts.find(p => p.type === 'month').value;
  const d = parts.find(p => p.type === 'day').value;
  const h = parseInt(parts.find(p => p.type === 'hour').value);
  const o = getOpenHour(), c = getCloseHour();
  if (o < c) {
    if (h >= o && h < c) return `${y}-${m}-${d}-open`;
    if (h >= c)          return `${y}-${m}-${d}-closed`;
    const utc = new Date(`${y}-${m}-${d}T00:00:00Z`);
    utc.setUTCDate(utc.getUTCDate() - 1);
    return `${utc.getUTCFullYear()}-${String(utc.getUTCMonth() + 1).padStart(2,'0')}-${String(utc.getUTCDate()).padStart(2,'0')}-closed`;
  } else {
    if (h >= c && h < o) return `${y}-${m}-${d}-closed`;
    return `${y}-${m}-${d}-open`;
  }
}

  if (areasOn && areas.length > 0) {

  }
  items.push({ icon: '🕐', text: `Open ${hoursShort} ${fmtOpenDays(getOpenDays())}` });
  if (!feeOn) {
    items.push({ icon: '🛵', text: 'Free delivery on every order' });
  } else if (freeDelOn && threshold > 0) {
    items.push({ icon: '🛵', text: `Free delivery on orders min. Php ${threshold}` });
  }
  if (schedulesOn && schedules.length > 0) {
    const labels = schedules.map(s => `${fmtTime12Short(s.start)}–${fmtTime12Short(s.end)}`);
    items.push({ icon: '🕒', text: `Delivery windows: ${labels.join(' · ')}` });
  }
  // Keep the footer "Delivery Times" line in sync with whatever schedule
  // windows the tenant has configured. Shows each window's START time.
  const footDel = document.getElementById('footer-delivery-times');
  if (footDel) {
    if (schedulesOn && schedules.length > 0) {
      footDel.textContent = schedules.map(s => fmtTime12Long(s.start)).join(' · ');
    } else {
      footDel.textContent = '—';
    }
  }

  if (rainMode) items.push(RAIN_TICKER);
  if (storeClosed) items.push({ ...CLOSED_TICKER, text: `Store Closed: Our store is currently closed. Operating hours are ${hoursLong} ${fmtOpenDays(getOpenDays())}. Thank you for your patience.` });
  if (maintenance) items.push(MAINTENANCE_TICKER);
  if (offlineMode) items.push(OFFLINE_TICKER);
  // Also keep the footer hours + open-days in sync with admin settings.
  const footHours = document.getElementById('footer-hours');
  if (footHours) footHours.textContent = hoursLong;
  const footDays = document.getElementById('footer-days');
  if (footDays) footDays.textContent = fmtOpenDaysFooter(getOpenDays());
  const oneSet = items.map(it => {
    const cls = it.rain ? ' rain-ticker-item' : it.closed ? ' closed-ticker-item' : it.maintenance ? ' maintenance-ticker-item' : '';
    return `<span class="ticker-item${cls}">${it.icon} <strong>${it.text}</strong></span>` +
           `<span class="ticker-sep">|</span>`;
  }).join('');
  const track = document.getElementById('ticker-track');
  if (track) {
    track.innerHTML = oneSet + oneSet;
    track.style.animationDuration = (items.length * 7.5) + 's';
  }
}

function applyRainMode(active) {
  const header   = document.querySelector('header');
  const infoBar  = document.getElementById('info-bar');
  if (!header) return;

  if (active) {
    header.classList.add('rain-mode');
    if (infoBar) infoBar.classList.add('rain-mode');
    if (!header.querySelector('.rain-container')) {
      const container = document.createElement('div');
      container.className = 'rain-container';

      // Clouds
      [
        { left: '4%',  top: '6px',  w: 70,  h: 22, dur: '7s',  delay: '0s'   },
        { left: '30%', top: '4px',  w: 90,  h: 28, dur: '9s',  delay: '2.5s' },
        { left: '62%', top: '8px',  w: 60,  h: 19, dur: '6s',  delay: '1s'   },
        { left: '84%', top: '5px',  w: 80,  h: 24, dur: '8s',  delay: '4s'   },
      ].forEach(c => {
        const cloud = document.createElement('div');
        cloud.className = 'rain-cloud';
        cloud.style.left              = c.left;
        cloud.style.top               = c.top;
        cloud.style.width             = c.w + 'px';
        cloud.style.height            = c.h + 'px';
        cloud.style.animationDuration = c.dur;
        cloud.style.animationDelay    = c.delay;
        container.appendChild(cloud);
      });

      // Rain drops
      for (let i = 0; i < 35; i++) {
        const drop = document.createElement('div');
        drop.className = 'rain-drop';
        drop.style.left               = (Math.random() * 100) + '%';
        drop.style.height             = (8 + Math.random() * 10) + 'px';
        drop.style.animationDuration  = (0.4 + Math.random() * 0.7) + 's';
        drop.style.animationDelay     = (-Math.random() * 2) + 's';
        container.appendChild(drop);
      }
      header.appendChild(container);
    }
  } else {
    header.classList.remove('rain-mode');
    if (infoBar) infoBar.classList.remove('rain-mode');
    const c = header.querySelector('.rain-container');
    if (c) c.remove();
  }
  buildTicker(active, storeClosedMode, maintenanceMode);
}

tdoc('settings', 'store').onSnapshot(snap => {
  storeSettingsData = snap.exists ? snap.data() : {};
  const rainMode    = storeSettingsData.rainMode === true;
  maintenanceMode   = storeSettingsData.maintenanceMode === true;
  offlineMode       = storeSettingsData.offlineMode === true;
  storeClosedMode   = getEffectiveStoreClosed();
  lastRainMode      = rainMode;
  applyRainMode(rainMode);
  buildTicker(rainMode, storeClosedMode, maintenanceMode);
  // Storefront layout — 'list' for restaurants/carinderias, 'grid'
  // (default) for sari-sari stores. Switches via a data attribute on the
  // root so CSS picks up the right layout without re-mounting.
  const layout = (storeSettingsData.storefrontLayout === 'list') ? 'list' : 'grid';
  const layoutChanged = document.documentElement.getAttribute('data-layout') !== layout;
  if (layoutChanged) document.documentElement.setAttribute('data-layout', layout);

  // Re-render on layout flip OR when the owner saves a new category order
  // so the storefront updates live without the customer reloading.
  const newOrderKey = JSON.stringify(Array.isArray(storeSettingsData.categoryOrder) ? storeSettingsData.categoryOrder : []);
  const orderChanged = (window.__lastCategoryOrderKey !== newOrderKey);
  window.__lastCategoryOrderKey = newOrderKey;
  if (layoutChanged || orderChanged) {
    if (typeof renderCategories === 'function') renderCategories();
    if (typeof renderProducts === 'function') renderProducts();
  }
  // In list mode, attach the chip-nav scroll-spy. Idempotent — internal
  // flag prevents double-attach if settings/store fires again.
  if (layout === 'list' && typeof attachListScrollSpy === 'function') {
    attachListScrollSpy();
  }
  // Apply tenant-specific display name dynamically.
  const dynName = storeSettingsData.storeName;
  const nameEl = document.getElementById('store-name');
  const tagEl  = document.getElementById('store-tag');
  let shownName = '';
  if (dynName) {
    if (nameEl) nameEl.textContent = dynName;
    document.title = dynName;
    shownName = dynName;
  } else if (nameEl && TENANT_ID && TENANT_ID !== 'jsminimart') {
    nameEl.textContent = TENANT_ID;
    shownName = TENANT_ID;
  } else if (nameEl) {
    shownName = nameEl.textContent || '';
  }

  // Sync the footer website link with the tenant slug and the contact-us
  // link with the configured GCash number.
  const webEl  = document.getElementById('footer-website');
  if (webEl) {
    const path = 'pabilimart.com/' + (TENANT_ID || 'jsminimart') + '/';
    webEl.href = 'https://' + path;
    webEl.textContent = path;
  }
  const contactEl = document.getElementById('footer-contact');
  if (contactEl) {
    const num = storeSettingsData.gcashNumber || '';
    if (num) {
      // Pretty-print as 09XX-XXX-XXXX
      const pretty = num.length === 11 ? num.replace(/^(\d{4})(\d{3})(\d{4})$/, '$1-$2-$3') : num;
      contactEl.href = 'tel:+63' + num.replace(/^0/, '');
      contactEl.textContent = pretty;
      contactEl.style.display = '';
    } else {
      contactEl.textContent = '—';
      contactEl.removeAttribute('href');
    }
  }
  // Footer-bottom storeName mirror
  const footerStoreNameEl = document.getElementById('footer-store-name');
  if (footerStoreNameEl && shownName) footerStoreNameEl.textContent = shownName;
  // Scale the brand-name font so long names stay readable AND fully visible
  // (no ellipsis). Wraps to multiple lines naturally inside the bounded box.
  if (nameEl) {
    nameEl.classList.remove('scale-md', 'scale-sm', 'scale-xs');
    const len = shownName.trim().length;
    if (len > 45) nameEl.classList.add('scale-xs');
    else if (len > 30) nameEl.classList.add('scale-sm');
    else if (len > 20) nameEl.classList.add('scale-md');
  }
  // Restore visibility (CSS hid these via the no-default-logo class to
  // prevent the JS Mini Mart flash for non-jsminimart tenants).
  if (nameEl) nameEl.style.visibility = 'visible';
  if (tagEl)  tagEl.style.visibility  = 'visible';
});

// Re-evaluate every minute so the ticker flips automatically at 6am / 4pm
// boundaries even without a Firestore update.
setInterval(() => {
  const newClosed = getEffectiveStoreClosed();
  if (newClosed !== storeClosedMode) {
    storeClosedMode = newClosed;
    buildTicker(lastRainMode, storeClosedMode, maintenanceMode);
  }
}, 60000);

/* ============================================================
   🚫  Below this line is the app logic — no need to edit
   unless you want to change how the store works.
============================================================ */

// ---------- GALLERY ----------
let galleryImages = [];
let galleryIndex  = 0;

function renderGallerySlide() {
  document.getElementById('modal-slides').innerHTML =
    `<img src="${galleryImages[galleryIndex]}" alt="Product photo" style="width:100%;height:220px;object-fit:contain;display:block;" />`;
  document.getElementById('modal-dots').innerHTML = galleryImages.length > 1
    ? galleryImages.map((_, i) =>
        `<span onclick="goToGallerySlide(${i})" style="display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px;cursor:pointer;background:${i === galleryIndex ? 'var(--accent)' : 'var(--line)'}"></span>`
      ).join('')
    : '';
}
function nextGallerySlide() { galleryIndex = (galleryIndex + 1) % galleryImages.length; renderGallerySlide(); }
function prevGallerySlide() { galleryIndex = (galleryIndex - 1 + galleryImages.length) % galleryImages.length; renderGallerySlide(); }
function goToGallerySlide(i) { galleryIndex = i; renderGallerySlide(); }

// ---------- STATE ----------
let cart = JSON.parse(localStorage.getItem('sariCart') || '{}');
let activeCategory = "All";
let searchTerm = "";

// ---------- INIT ----------
function init() {

  // Apply store config to header
  document.getElementById('store-name').textContent = STORE.name;
  document.getElementById('store-tag').textContent = STORE.tagline;
  document.title = STORE.name;
  // Logo is jsminimart-specific. Hide for any other tenant until per-tenant
  // logo upload is added.
  if (TENANT_ID && TENANT_ID !== 'jsminimart') {
    const lg = document.getElementById('brand-logo');
    if (lg) lg.style.display = 'none';
  }

  renderCategories();
  renderCart();
  document.getElementById('products').innerHTML = '<div class="empty">Loading products…</div>';

  // Debounce: don't re-render against 850+ products on every keystroke —
  // batch typed input into ~180ms windows so "tuna" runs one filter+render
  // pass instead of four.
  let __searchDebounce = 0;
  document.getElementById('search-input').addEventListener('input', (e) => {
    const v = e.target.value.toLowerCase();
    document.getElementById('search-clear').style.display = v ? 'inline' : 'none';
    clearTimeout(__searchDebounce);
    __searchDebounce = setTimeout(() => { searchTerm = v; renderProducts(); }, 180);
  });

  // ESC closes modals
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeCart(); closeProductModal(); }
  });
}

// ---------- PRODUCT DETAIL ----------
function showProductDetail(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;

  document.getElementById('modal-product-id').value = id;
  document.getElementById('modal-product-name').textContent = p.name;

  // Gallery vs emoji
  const gallery   = document.getElementById('modal-gallery');
  const emojiDiv  = document.getElementById('modal-product-emoji');
  galleryImages   = (p.images && p.images.length > 0) ? p.images : [];
  galleryIndex    = 0;
  if (galleryImages.length > 0) {
    gallery.style.display  = 'block';
    emojiDiv.style.display = 'none';
    renderGallerySlide();
    const slidesEl = document.getElementById('modal-slides');
    let touchStartX = 0;
    slidesEl.ontouchstart = e => { touchStartX = e.touches[0].clientX; };
    slidesEl.ontouchend   = e => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) diff > 0 ? nextGallerySlide() : prevGallerySlide();
    };
  } else {
    gallery.style.display  = 'none';
    emojiDiv.style.display = 'flex';
  }
  const priceEl = document.getElementById('modal-product-price');
  document.getElementById('modal-product-unit').textContent = p.unit;
  document.getElementById('modal-product-description').textContent = p.description || '';

  // Handle variants
  const variantDiv = document.getElementById('modal-variants');
  const variantSelect = document.getElementById('variant-select');
  if (p.variants && p.variants.length > 0) {
    const variantPrices = p.variants.map(v => parseFloat(v.price || p.price));
    const minPrice = Math.min(...variantPrices);
    const maxPrice = Math.max(...variantPrices);
    // Until a variant is picked, show the full range so the customer knows
    // pricing varies (e.g. "₱200.00 – ₱239.00"). Single-price products with
    // variants (same price across all) just show the price.
    const rangeText = minPrice === maxPrice
      ? STORE.currency + fmt(minPrice)
      : STORE.currency + fmt(minPrice) + ' – ' + STORE.currency + fmt(maxPrice);
    priceEl.textContent = rangeText;
    variantDiv.style.display = 'block';
    variantSelect.innerHTML = '<option value="">Select one</option>' + p.variants.map((v, i) => {
      const vStock = v.stock ?? null;
      const inCart = cart[`${p.id}_v${i}`] || 0;
      const oos    = vStock !== null && vStock === 0;
      const atMax  = vStock !== null && inCart >= vStock && vStock > 0;
      const disabled = oos || atMax;
      const suffix = oos ? ' — Out of Stock' : atMax ? ` — Max (${vStock})` : '';
      return `<option value="${i}" ${disabled ? 'disabled' : ''}>${v.name}${suffix}</option>`;
    }).join('');
    variantSelect.onchange = () => {
      const idx = variantSelect.value;
      if (idx !== '') {
        priceEl.textContent = STORE.currency + fmt(p.variants[idx].price || p.price);
      } else {
        priceEl.textContent = rangeText;
      }
    };
  } else {
    priceEl.textContent = STORE.currency + fmt(p.price);
    variantDiv.style.display = 'none';
    variantSelect.innerHTML = '<option value="">Select one</option>';
    variantSelect.onchange = null;
  }

  // Disable Add to Cart if out of stock
  const addBtn = document.querySelector('#product-modal .btn-primary');
  if (p.available === false) {
    addBtn.disabled = true;
    addBtn.textContent = 'Out of Stock';
    addBtn.style.cssText = 'background:var(--line);color:var(--muted);cursor:not-allowed;';
  } else {
    addBtn.disabled = false;
    addBtn.textContent = 'Add to Cart';
    addBtn.style.cssText = '';
  }

  document.getElementById('product-modal').classList.add('show');
  // After the modal lays out, check whether the title wrapped to 2+
  // lines and shrink it via the .is-wrapped class if so. Comparing the
  // rendered offsetHeight to the single-line lineHeight is a reliable
  // wrap-detect on every viewport without character-count heuristics.
  requestAnimationFrame(() => {
    const t = document.getElementById('modal-product-name');
    if (!t) return;
    t.classList.remove('is-wrapped');
    const lineH = parseFloat(getComputedStyle(t).lineHeight) || 30;
    if (t.offsetHeight > lineH * 1.5) {
      t.classList.add('is-wrapped');
    }
  });
}

function closeProductModal() {
  document.getElementById('product-modal').classList.remove('show');
}

function addFromModal() {
  const id = parseInt(document.getElementById('modal-product-id').value);
  const p = PRODUCTS.find(x => x.id == id);
  if (!p) return;
  let key;
  if (p.variants && p.variants.length > 0) {
    const sel = document.getElementById('variant-select');
    if (!sel.value) { showToast('Please select a size first'); return; }
    const vIdx = parseInt(sel.value);
    key = `${id}_v${vIdx}`;
    const vStock = p.variants[vIdx]?.stock ?? null;
    if (vStock !== null && (cart[key] || 0) >= vStock) {
      showToast(`Only ${vStock} in stock`); return;
    }
  } else {
    key = String(id);
    if (p.stock !== null && p.stock !== undefined) {
      if (productCartQty(id) >= p.stock) { showToast(`Only ${p.stock} in stock`); return; }
    }
  }
  cart[key] = (cart[key] || 0) + 1;
  saveCart(); renderCart(); renderProducts();
  closeProductModal();
  showToast("Added to cart");
}

// ---------- SEARCH CLEAR ----------
function clearSearch() {
  document.getElementById('search-input').value = '';
  searchTerm = '';
  document.getElementById('search-clear').style.display = 'none';
  renderProducts();
}

// ---------- CATEGORIES ----------
// Apply the owner's saved `settings/store.categoryOrder` to a list of
// category names: entries from the saved order come first (in order),
// then any category not in that list is appended alphabetically. The
// owner doesn't need to re-save every time they add a product with a
// new category — new ones just fall to the end until they decide to
// reorder. Used by both grid (sidebar chips) and list (section order).
function applyCategoryOrder(allCats) {
  const saved = Array.isArray(storeSettingsData.categoryOrder) ? storeSettingsData.categoryOrder : [];
  if (saved.length === 0) return allCats.slice().sort();
  const allSet = new Set(allCats);
  const seen = new Set();
  const ordered = [];
  saved.forEach(c => {
    if (allSet.has(c) && !seen.has(c)) { ordered.push(c); seen.add(c); }
  });
  const remaining = allCats.filter(c => !seen.has(c)).sort();
  return [...ordered, ...remaining];
}

function renderCategories() {
  const wrap = document.getElementById('categories');
  // Mirror admin exactly: categories derived from products in product-id order.
  // Hidden products (admin → Products → HIDE toggle ON) are skipped so the
  // category list and chip counts only reflect what's actually shoppable.
  const catSet = new Set();
  PRODUCTS.forEach(p => { if (p.category && p.hidden !== true) catSet.add(p.category); });
  const cats = ['All', ...applyCategoryOrder([...catSet])];
  const layout = document.documentElement.getAttribute('data-layout');
  if (layout === 'list') {
    // List mode: chips are jump-to-section anchors, not filters. "All" jumps
    // to the top. The clicked chip becomes active until another is clicked
    // (Phase 2 will add scroll-spy that updates this as the user scrolls).
    if (!cats.includes(jumpActiveCategory)) jumpActiveCategory = 'All';
    wrap.innerHTML = cats.map(cat =>
      `<button class="chip ${cat === jumpActiveCategory ? 'active' : ''}" onclick="jumpToCategory('${cat.replace(/'/g, "\\'")}')">${cat}</button>`
    ).join('');
    return;
  }
  if (activeCategory !== 'All' && !cats.includes(activeCategory)) activeCategory = 'All';
  wrap.innerHTML = cats.map(cat =>
    `<button class="chip ${cat === activeCategory ? 'active' : ''}" onclick="pickCategory('${cat.replace(/'/g, "\\'")}')">${cat}</button>`
  ).join('');
}
function pickCategory(cat) {
  activeCategory = cat;
  renderCategories();
  renderProducts();
}
// Tracks which list-mode chip is currently highlighted; updated by either
// a tap on a chip (jumpToCategory) or by scroll-spy (listScrollSpyTick).
let jumpActiveCategory = 'All';
function listSectionId(cat) {
  return 'list-section-' + String(cat).replace(/[^a-z0-9]+/gi, '-').toLowerCase();
}
function jumpToCategory(cat) {
  // Suppress scroll-spy for the duration of the smooth-scroll so the chip
  // doesn't flicker through every category the animation crosses.
  _listSpyLockUntil = Date.now() + 700;
  jumpActiveCategory = cat;
  document.querySelectorAll('#categories .chip').forEach(b => {
    b.classList.toggle('active', b.textContent === cat);
  });
  if (cat === 'All') {
    const sc = document.querySelector('.container');
    if (sc && typeof sc.scrollTo === 'function') sc.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const el = document.getElementById(listSectionId(cat));
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---------- LIST MODE: scroll-spy ----------
// Mirrors the Settings sub-nav scroll-spy in admin: rAF-throttled scroll
// listener on the container, finds whichever .list-section is currently
// anchored just below the sticky chip nav, marks its chip active, and
// horizontally recenters that chip in the bar so the user can always
// see which section they're in and what's around it.
let _listSpyRafRequested = false;
let _listSpyLockUntil = 0;
let _listSpyAttached = false;

function listScrollSpyTick() {
  _listSpyRafRequested = false;
  if (Date.now() < _listSpyLockUntil) return;
  if (document.documentElement.getAttribute('data-layout') !== 'list') return;
  const sc = document.querySelector('.container');
  if (!sc) return;
  const sections = document.querySelectorAll('.list-section');
  if (!sections.length) return;
  const nav = document.getElementById('categories');
  const navH = nav ? nav.offsetHeight : 0;
  // Trigger line just below the sticky chip nav; the +24 keeps the active
  // chip from flipping one pixel too early as the user scrolls.
  const triggerLine = sc.getBoundingClientRect().top + navH + 24;
  let activeIdx = 0;
  for (let i = 0; i < sections.length; i++) {
    if (sections[i].getBoundingClientRect().top <= triggerLine) activeIdx = i;
    else break;
  }
  const catName = sections[activeIdx].dataset.cat || '';
  if (!catName || catName === jumpActiveCategory) return;
  jumpActiveCategory = catName;
  let activeBtn = null;
  document.querySelectorAll('#categories .chip').forEach(b => {
    const isActive = b.textContent === catName;
    b.classList.toggle('active', isActive);
    if (isActive) activeBtn = b;
  });
  if (activeBtn && nav && nav.scrollWidth > nav.clientWidth) {
    const targetLeft = activeBtn.offsetLeft - (nav.clientWidth - activeBtn.offsetWidth) / 2;
    nav.scrollTo({ left: Math.max(0, targetLeft), behavior: 'smooth' });
  }
}

function attachListScrollSpy() {
  if (_listSpyAttached) return;
  const sc = document.querySelector('.container');
  if (!sc) return;
  _listSpyAttached = true;
  sc.addEventListener('scroll', () => {
    if (_listSpyRafRequested) return;
    _listSpyRafRequested = true;
    requestAnimationFrame(listScrollSpyTick);
  }, { passive: true });
}

// ---------- PRODUCTS ----------
function renderProducts() {
  const grid = document.getElementById('products');
  const layout = document.documentElement.getAttribute('data-layout');
  // Hidden products never appear in the storefront, even when their category
  // is selected or they match the active search term. PRODUCTS itself stays
  // untouched so cart resolution for items already in cart (added before the
  // admin hid them) keeps working at checkout.
  let list = PRODUCTS.filter(p => p.hidden !== true);
  // Grid mode filters by activeCategory; list mode always shows all
  // categories (chips jump to sections, they don't filter).
  if (layout !== 'list') {
    list = list.filter(p => activeCategory === "All" || p.category === activeCategory);
  }
  if (searchTerm) {
    list = list.filter(p => {
      const text = `${p.name} ${p.description || ''}`.toLowerCase();
      return text.includes(searchTerm);
    });
  }
  const isOos = p => {
    if (p.available === false) return true;
    if (p.variants && p.variants.length > 0) return p.variants.every(v => (v.stock ?? 0) === 0);
    return p.stock === 0;
  };
  list = [...list.filter(p => !isOos(p)), ...list.filter(p => isOos(p))];
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty">No products found.</div>`;
    return;
  }
  if (layout === 'list') {
    grid.innerHTML = renderListLayout(list, !!searchTerm, isOos);
    return;
  }
  grid.innerHTML = list.map(p => {
    const ok = p.available !== false && !isOos(p);
    const cartQty = productCartQty(p.id);
    const displayStock = (() => {
      if (p.variants && p.variants.length > 0) {
        return p.variants.reduce((sum, v) => sum + (v.stock ?? 0), 0);
      }
      return p.stock;
    })();
    const atMax = ok && displayStock !== null && displayStock !== undefined && displayStock > 0 && cartQty >= displayStock;
    const btnDisabled = !ok || atMax;
    // Compute price string + whether it's a range so the CSS can shrink it on one line
    let priceStr, isRange = false;
    if (p.variants && p.variants.length > 0) {
      const vp = p.variants.map(v => parseFloat(v.price || p.price));
      const mn = Math.min(...vp), mx = Math.max(...vp);
      if (mn === mx) priceStr = STORE.currency + fmt(mn);
      else { priceStr = STORE.currency + fmt(mn) + ' – ' + STORE.currency + fmt(mx); isRange = true; }
    } else {
      priceStr = STORE.currency + fmt(p.price);
    }
    return `
    <div class="card" onclick="showProductDetail(${p.id})">
      <div class="thumb">
        ${p.images && p.images.length > 0 ? `<img src="${p.images[0]}" alt="${p.name}" loading="lazy" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">` : p.image ? `<img src="${p.image}" alt="${p.name}" loading="lazy" decoding="async" style="width:80%;height:80%;object-fit:contain;">` : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.2" width="44" height="44"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`}
        ${!ok ? `<div style="position:absolute;top:6px;left:6px;background:#dc2626;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;line-height:1.5;z-index:1;">OUT OF STOCK</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-unit">${p.unit}</div>
        ${p.description ? `<div style="font-size:12px;color:var(--muted);margin:4px 0;">${p.description.substring(0, 50)}${p.description.length > 50 ? '...' : ''}</div>` : ''}
        ${(displayStock === 0) ? `<div style="font-size:12px;color:#dc2626;">Out of Stock</div>` : ''}
        <div class="card-bottom">
          <div class="price${isRange ? ' is-range' : ''}">${priceStr}</div>
          <button class="add-btn${ok && cartQty > 0 ? ' in-cart' : ''}" onclick="${!btnDisabled ? `addToCart(${p.id}); event.stopPropagation()` : 'event.stopPropagation()'}" ${btnDisabled ? 'disabled' : ''} title="${!ok ? 'Out of stock' : atMax ? 'Maximum stock reached' : 'Add to cart'}" style="${!ok ? 'background:var(--line);cursor:not-allowed;box-shadow:none;' : ''}">${ok && cartQty > 0 ? cartQty : '+'}</button>
        </div>
      </div>
    </div>
  `;}).join('');
}

// ---------- LIST LAYOUT (FoodPanda-style stacked rows) ----------
// Reuses renderProducts's filter pipeline (hidden/search/oos handled there).
// In search mode, items render as one flat "Search results" section.
// Otherwise items are grouped under per-category headings; the chip nav
// at the top is a jump-to-section index (see `jumpToCategory`).
function renderListLayout(list, isSearching, isOos) {
  const renderItem = (p) => {
    const ok = p.available !== false && !isOos(p);
    const cartQty = productCartQty(p.id);
    const displayStock = (() => {
      if (p.variants && p.variants.length > 0) return p.variants.reduce((s, v) => s + (v.stock ?? 0), 0);
      return p.stock;
    })();
    const atMax = ok && displayStock !== null && displayStock !== undefined && displayStock > 0 && cartQty >= displayStock;
    const btnDisabled = !ok || atMax;
    let priceStr;
    if (p.variants && p.variants.length > 0) {
      const vp = p.variants.map(v => parseFloat(v.price || p.price));
      const mn = Math.min(...vp), mx = Math.max(...vp);
      priceStr = (mn === mx) ? `${STORE.currency}${fmt(mn)}` : `from ${STORE.currency}${fmt(mn)}`;
    } else {
      priceStr = `${STORE.currency}${fmt(p.price)}`;
    }
    const imgHtml = (p.images && p.images.length > 0)
      ? `<img src="${p.images[0]}" alt="${p.name}" loading="lazy" decoding="async">`
      : (p.image
          ? `<img src="${p.image}" alt="${p.name}" loading="lazy" decoding="async" style="object-fit:contain;width:80%;height:80%;">`
          : (p.emoji || '📦'));
    const descSafe = p.description ? p.description.replace(/[<>]/g, '') : '';
    const onClickRow = ok ? `showProductDetail(${p.id})` : '';
    const addBtnLabel = ok && cartQty > 0 ? String(cartQty) : '+';
    const addBtnClass = `list-item-add${ok && cartQty > 0 ? ' in-cart' : ''}`;
    const addOnClick = btnDisabled ? 'event.stopPropagation()' : `event.stopPropagation(); addToCart(${p.id})`;
    return `
      <div class="list-item${!ok ? ' is-oos' : ''}" onclick="${onClickRow}">
        <div class="list-item-info">
          <div class="list-item-name">${p.name}</div>
          <div class="list-item-price">${priceStr}</div>
          ${descSafe ? `<div class="list-item-desc">${descSafe}</div>` : ''}
          ${!ok ? `<div class="list-item-oos-tag">Out of stock</div>` : ''}
        </div>
        <div class="list-item-thumb">
          ${imgHtml}
          <button class="${addBtnClass}" ${btnDisabled ? 'disabled' : ''} onclick="${addOnClick}" title="${!ok ? 'Out of stock' : atMax ? 'Maximum stock reached' : 'Add to cart'}">${addBtnLabel}</button>
        </div>
      </div>
    `;
  };
  if (isSearching) {
    return `<div class="list-section">
      <div class="list-section-title">Search results (${list.length})</div>
      ${list.map(renderItem).join('')}
    </div>`;
  }
  const grouped = {};
  list.forEach(p => {
    const cat = p.category || 'Uncategorized';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(p);
  });
  const cats = applyCategoryOrder(Object.keys(grouped));
  return cats.map(cat => `
    <div class="list-section" id="${listSectionId(cat)}" data-cat="${cat.replace(/"/g, '&quot;')}">
      <div class="list-section-title">${cat}</div>
      ${grouped[cat].map(renderItem).join('')}
    </div>
  `).join('');
}

// ---------- CART ----------
function saveCart() { localStorage.setItem('sariCart', JSON.stringify(cart)); }

function productCartQty(pid) {
  return Object.entries(cart)
    .filter(([k]) => k === String(pid) || k.startsWith(`${pid}_v`))
    .reduce((s, [,q]) => s + q, 0);
}
function openSizePicker(id) {
  const p = PRODUCTS.find(x => x.id == id);
  if (!p) return;
  document.getElementById('size-picker-name').textContent = p.name;
  const allQty = productCartQty(id);
  document.getElementById('size-picker-options').innerHTML = p.variants.map((v, i) => {
    const vStock = v.stock ?? null;
    const vCartQty = cart[`${id}_v${i}`] || 0;
    const oos = vStock !== null && vStock === 0;
    const atMax = !oos && vStock !== null && vCartQty >= vStock;
    const disabled = oos || atMax;
    const statusLabel = oos ? ' · Out of stock' : atMax ? ` · Max ${vStock}` : '';
    const statusColor = oos ? '#dc2626' : '#d97706';
    return `<button onclick="addWithVariant(${id},${i})" ${disabled ? 'disabled' : ''}
      style="padding:9px 12px;border:1.5px solid ${disabled ? 'var(--line)' : 'var(--line)'};border-radius:10px;
      font-size:13px;cursor:${disabled ? 'not-allowed' : 'pointer'};background:#fff;
      text-align:left;${disabled ? 'opacity:0.4;filter:grayscale(1);' : ''}transition:border-color .1s,transform .1s;"
      ${disabled ? '' : 'onmousedown="this.style.transform=\'scale(0.96)\';this.style.borderColor=\'var(--accent)\'" onmouseup="this.style.transform=\'scale(1)\'" onmouseleave="this.style.transform=\'scale(1)\';this.style.borderColor=\'var(--line)\'"'}>
      <span style="display:block;font-weight:600;font-size:13px;color:var(--ink);">${v.name}</span>
      <span style="display:block;font-size:12px;font-weight:700;color:var(--accent);margin-top:2px;">${STORE.currency}${fmt(v.price || p.price)}${disabled ? `<span style="color:${statusColor};font-weight:500;">${statusLabel}</span>` : ''}</span>
    </button>`;
  }).join('');
  const el = document.getElementById('size-picker');
  el.style.opacity = '1'; el.style.pointerEvents = 'all';
}
function closeSizePicker() {
  const el = document.getElementById('size-picker');
  el.style.opacity = '0'; el.style.pointerEvents = 'none';
}
function addWithVariant(id, variantIdx) {
  const p = PRODUCTS.find(x => x.id == id);
  if (!p) return;
  const variant = p.variants[variantIdx];
  const vStock = variant?.stock ?? null;
  const key = `${id}_v${variantIdx}`;
  if (vStock !== null && (cart[key] || 0) >= vStock) { showToast(`Only ${vStock} in stock`); return; }
  cart[key] = (cart[key] || 0) + 1;
  saveCart(); renderCart(); renderProducts();
  closeSizePicker();
  showToast('Added to cart');
}
function addToCart(id) {
  const p = PRODUCTS.find(x => x.id == id);
  if (!p) return;
  if (p.variants && p.variants.length > 0) { openSizePicker(id); return; }
  if (p.stock !== null && p.stock !== undefined) {
    if (productCartQty(id) >= p.stock) { showToast(`Only ${p.stock} in stock`); return; }
  }
  cart[String(id)] = (cart[String(id)] || 0) + 1;
  saveCart(); renderCart(); renderProducts();
  showToast("Added to cart");
}
function changeQty(key, delta) {
  const [idStr, vPart] = key.split('_v');
  const p = PRODUCTS.find(x => x.id == idStr);
  if (delta > 0 && p) {
    if (vPart !== undefined && p.variants) {
      const variant = p.variants[parseInt(vPart)];
      const vStock = variant?.stock ?? null;
      if (vStock !== null && (cart[key] || 0) >= vStock) { showToast(`Only ${vStock} in stock`); return; }
    } else if (p.stock !== null && p.stock !== undefined) {
      if (productCartQty(p.id) >= p.stock) { showToast(`Only ${p.stock} in stock`); return; }
    }
  }
  cart[key] = (cart[key] || 0) + delta;
  if (cart[key] <= 0) delete cart[key];
  saveCart(); renderCart(); renderProducts();
}
function removeFromCart(key) {
  delete cart[key];
  saveCart(); renderCart(); renderProducts();
}
function removeAll() {
  cart = {};
  saveCart();
  renderCart();
  renderProducts();
  showToast('Removed all items');
}
function cartTotal() {
  return Object.entries(cart).reduce((sum, [key, qty]) => {
    const [idStr, vPart] = key.split('_v');
    const p = PRODUCTS.find(x => x.id == idStr);
    if (!p) return sum;
    const variant = vPart !== undefined && p.variants ? p.variants[parseInt(vPart)] : null;
    const price = variant ? parseFloat(variant.price || p.price) : p.price;
    return sum + price * qty;
  }, 0);
}
function deliveryFee() {
  const feeOn = storeSettingsData.deliveryFeeEnabled !== false;
  if (!feeOn) return 0;
  const freeOn = storeSettingsData.freeDeliveryEnabled !== false;
  const threshold = (typeof storeSettingsData.freeDeliveryThreshold === 'number') ? storeSettingsData.freeDeliveryThreshold : 400;
  if (freeOn && cartTotal() >= threshold) return 0;
  const amt = (typeof storeSettingsData.deliveryFee === 'number') ? storeSettingsData.deliveryFee : 45;
  return amt;
}
function cartCount() {
  return Object.values(cart).reduce((a, b) => a + b, 0);
}

function renderCart() {
  const _count = cartCount();
  const _badge = document.getElementById('cart-count');
  _badge.textContent = _count;
  _badge.style.display = _count > 0 ? '' : 'none';
  const wrap = document.getElementById('cart-items');
  const ids = Object.keys(cart);
  if (ids.length === 0) {
    wrap.innerHTML = `<div class="cart-empty">Your cart is empty.<br>Add some products to get started!</div>`;
  } else {
    wrap.innerHTML = ids.map(key => {
      const [idStr, vPart] = key.split('_v');
      const p = PRODUCTS.find(x => x.id == idStr);
      if (!p) return '';
      const variant = vPart !== undefined && p.variants ? p.variants[parseInt(vPart)] : null;
      const price = variant ? parseFloat(variant.price || p.price) : p.price;
      const qty = cart[key];
      const lineTotal = fmt(price * qty);
      const allQty = productCartQty(p.id);
      const atMax = p.stock !== null && p.stock !== undefined && allQty >= p.stock;
      const thumb = p.images && p.images.length > 0 ? `<img src="${p.images[0]}" alt="${p.name}" style="width:80%;height:80%;object-fit:cover;">` : p.image ? `<img src="${p.image}" alt="${p.name}" style="width:80%;height:80%;object-fit:contain;">` : '';
      return `
        <div class="cart-row">
          <div class="cart-thumb">${thumb}</div>
          <div class="cart-info">
            <div class="name-row">
              <div class="name">${p.name.length > 30 ? p.name.slice(0, 30) + '…' : p.name}</div>
              <div class="cart-line-total">${STORE.currency}${lineTotal}</div>
            </div>
            <div class="meta">${STORE.currency}${fmt(price)} · ${p.unit}${variant ? ` · ${variant.name}` : ''}</div>
            <div class="qty">
              <button onclick="changeQty('${key}', -1)">−</button>
              <span>${qty}</span>
              <button onclick="changeQty('${key}', 1)" ${atMax ? 'disabled style="opacity:0.35;cursor:not-allowed;"' : ''}>+</button>
            </div>
          </div>
          <button class="remove-x" onclick="removeFromCart('${key}')" title="Remove">×</button>
        </div>
      `;
    }).join('');
  }
  const total = cartTotal();
  const fee = deliveryFee();
  const subtotalEl = document.getElementById('subtotal');
  const deliveryEl = document.getElementById('delivery-fee');
  if (subtotalEl) subtotalEl.textContent = STORE.currency + fmt(total);
  if (deliveryEl) deliveryEl.textContent = fee === 0 ? 'Free' : STORE.currency + fmt(fee);
  document.getElementById('grand-total').textContent = STORE.currency + fmt(total);
  document.getElementById('checkout-btn').disabled = (ids.length === 0);
}

function openCart() {
  document.getElementById('drawer').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}
function closeCart() {
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
}

// ---------- TOAST ----------
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- GO ----------
if (window.location.hash === '#cart') {
  openCart();
  history.replaceState(null, '', window.location.pathname);
}
init();

// Load products from Firestore — real-time sync across devices
let shuffledOrder = null;
tcol('products').onSnapshot(snapshot => {
  const fresh = snapshot.docs.map(doc => doc.data());
  if (shuffledOrder === null) {
    // First load — shuffle once for this session
    fresh.sort((a, b) => a.id - b.id);
    for (let i = fresh.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [fresh[i], fresh[j]] = [fresh[j], fresh[i]];
    }
    shuffledOrder = fresh.map(p => p.id);
    PRODUCTS = fresh;
  } else {
    // Subsequent update (stock change, etc.) — keep shuffled order, update data
    const map = {};
    fresh.forEach(p => map[p.id] = p);
    PRODUCTS = shuffledOrder.filter(id => map[id]).map(id => map[id]);
    // Append any brand-new products at the end
    fresh.forEach(p => { if (!shuffledOrder.includes(p.id)) { PRODUCTS.push(p); shuffledOrder.push(p.id); } });
  }
  Object.keys(cart).forEach(key => { const id = key.split('_v')[0]; if (!PRODUCTS.find(x => x.id == id)) delete cart[key]; });
  saveCart();
  renderCategories();
  renderProducts();
  renderCart();
}, () => {
  // Firestore unavailable — fall back to local data
  PRODUCTS = JSON.parse(localStorage.getItem('sariProducts') || '[]');
  if (!PRODUCTS.length) PRODUCTS = DEFAULT_PRODUCTS;
  renderProducts();
  renderCart();
});
</script>

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
